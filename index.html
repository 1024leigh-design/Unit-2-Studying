<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside the Bacterial Cell: From DNA to Protein</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{

    --more:#5b3fb0; --more-soft:#f3effd;

  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font)}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
  header{text-align:center;margin-bottom:14px}
  h1{font-size:1.7rem;line-height:1.15;margin:0;letter-spacing:-0.01em}
  .sub{color:var(--muted);font-size:.98rem;margin-top:6px}
  [hidden]{display:none !important}

  .stagewrap{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 20px rgba(29,36,51,.07)}
  #cell{display:block;width:100%;height:auto;font-family:var(--font);touch-action:manipulation}
  .hint{text-align:center;color:var(--muted);font-size:.92rem;margin:10px 4px 0}

  .hot{cursor:pointer}
  .hot .ring{fill:none;stroke:rgba(242,177,52,0);stroke-width:14;transition:stroke .18s}
  .hot:hover .ring,.hot:focus-visible .ring,.hot.sel .ring{stroke:rgba(242,177,52,.55)}
  .hot:focus{outline:none}
  .tag{cursor:pointer}
  .tag:focus{outline:none}
  .tag:hover .tagbg,.tag:focus-visible .tagbg{filter:brightness(1.08)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .tag .tagg{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}
  @media (prefers-reduced-motion:reduce){ .tag .tagg{animation:none} }

  .pop{position:absolute;width:min(430px,88%);max-height:calc(100% - 28px);overflow-y:auto;overscroll-behavior:contain;
    background:var(--card);border-radius:18px;box-shadow:0 14px 40px rgba(20,26,40,.3);border-top:6px solid var(--accent);
    padding:0 0 16px;z-index:5;animation:popin .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes popin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  .hero{background:#f4f6fb;border-bottom:1px solid var(--line)}
  .hero svg{display:block;width:100%;height:auto}
  .popbody{padding:12px 18px 0}
  .pophead{padding-right:24px}
  .pophead h2{margin:0;font-size:1.24rem}
  .pophead .kick{font-size:.82rem;font-weight:700;color:var(--muted)}
  .closeX{position:absolute;top:8px;right:10px;border:0;background:rgba(255,255,255,.88);font:700 1.25rem var(--font);color:var(--muted);cursor:pointer;line-height:1;padding:3px 9px;border-radius:999px;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .closeX:hover{color:var(--ink)}

  .facts{display:grid;gap:7px;margin:12px 0 4px}
  .fact{display:flex;gap:9px;align-items:flex-start;background:#f5f7fb;border-radius:11px;padding:8px 11px;font-size:.92rem;line-height:1.42}
  .fact b{color:var(--accent)}
  .fact .em{flex:none;font-size:1rem;line-height:1.3}
  #extraFacts{display:grid;gap:7px}
  .morebtn{border:0;background:transparent;color:var(--accent);font:700 .88rem var(--font);cursor:pointer;padding:6px 0 0}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  .tile{display:flex;flex-direction:column;gap:5px;text-decoration:none;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 11px;background:#fff;transition:transform .14s, border-color .14s, box-shadow .14s}
  .tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--tc,var(--accent));box-shadow:0 6px 16px rgba(29,36,51,.12);outline:none}
  .tile svg{width:100%;height:38px}
  .tile b{font-size:.93rem;line-height:1.2}
  .donechk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#1b7f4e;color:#fff;font-style:normal;font-size:.7rem;vertical-align:1px;margin-left:4px}
  .tile span{font-size:.79rem;color:var(--muted);line-height:1.3}
  .tile.wide{grid-column:span 2}
  .tile.soon{border-style:dashed;background:#f7f8fb;cursor:default;opacity:.88}
  .tile.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .tile.soon b::after{content:" \00b7 coming soon";font-weight:400;color:var(--muted);font-size:.78rem}
  .tile.fun{border-color:#cbbdf2;background:var(--more-soft);--tc:var(--more)}

  .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
  .chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:700 .88rem var(--font);color:var(--ink);cursor:pointer}
  .chip:hover,.chip:focus-visible{border-color:#f2b134;outline:none}
  .chip i{width:12px;height:12px;border-radius:50%;display:inline-block}

  .scrim{position:absolute;inset:0;background:rgba(20,26,40,.16);z-index:4;animation:popin .2s}
  @media (max-width:720px){
    h1{font-size:1.32rem}
    .pop{position:fixed;left:0;right:0;bottom:0;top:auto !important;width:100%;max-height:86vh;border-radius:20px 20px 0 0;z-index:30}
    .scrim{position:fixed;z-index:29}
  }
  .moddir{display:grid;gap:14px;margin-top:18px}
  .moddir h2{font-size:1.15rem;margin:6px 0 0}
  .moddir .grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:640px){ .moddir .grid{grid-template-columns:repeat(2,1fr)} }
  @media (min-width:920px){ .moddir .grid{grid-template-columns:repeat(3,1fr)} }
  .modtabs{display:flex;gap:8px;flex-wrap:wrap}
  .modtab{font:700 .95rem var(--font);padding:10px 18px;border-radius:999px;border:2px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
  .modtab:hover{border-color:var(--accent)}
  .modtab[aria-selected="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
  .modpanel{display:grid;gap:14px;margin-top:4px}
  .moddesc{color:var(--muted);margin:0;line-height:1.5;max-width:70ch}
  .pathcard{background:var(--card);border:3px solid var(--accent);border-radius:20px;padding:18px 22px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
  .pathcard h2{margin:2px 0 6px;font-size:1.45rem}
  .pathcard p{margin:0 0 10px;color:var(--muted);line-height:1.5;max-width:62ch}
  .pc-tag{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;border-radius:999px;padding:3px 12px}
  .pc-stops{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0}
  .pc-stops .bucket{font-size:.86rem;font-weight:700;border-radius:999px;padding:6px 14px;background:#eef1f5;color:var(--muted)}
  .pc-stops .bucket b{color:var(--ink)}
  .pc-stops .bucket.done{background:#e1f3e8;color:#1b7f4e}
  .pc-stops .bucket.done b{color:#1b7f4e}
  .pc-actions{display:grid;gap:8px;justify-items:stretch;min-width:220px}
  .pc-go{font:700 1.1rem var(--font);border-radius:999px;padding:14px 26px;border:0;background:var(--accent);color:#fff;cursor:pointer}
  .pc-alt{font:700 .88rem var(--font);border-radius:999px;padding:8px 16px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer}
</style>
</head>

  const CELL = {cx:500, cy:282, w:800, h:312};
  function capsule(inset, pts){
    const w = CELL.w - inset * 2, h = CELL.h - inset * 2, r = h / 2;
    const L = CELL.cx - w / 2 + r, R = CELL.cx + w / 2 - r, T = CELL.cy - r, B = CELL.cy + r;
    const out = [], TOT = 360;
    const noise = u => { const a = u * Math.PI * 2; return 3.4 * Math.sin(3 * a + .7) + 2.1 * Math.sin(5 * a + 2.1) + 1.2 * Math.sin(7 * a + .3); };
    const straightN = 110, arcN = 70, total = straightN * 2 + arcN * 2;
    let idx = 0;
    const push = (x, y, nx, ny) => { const d = noise(idx / total) * (1 - inset / 100); out.push([x + nx * d, y + ny * d]); idx++; };
    for (let i = 0; i < straightN; i++) push(lerp(L, R, i / straightN), T, 0, -1);

      o += `<ellipse cx="${cx}" cy="${f1(sy)}" rx="72" ry="24" fill="url(#hRiboS)"/>`;
      if (j > .7){ const op = (j - .7) / .3;
        [["E", cx - 46],["P", cx],["A", cx + 46]].forEach(q => { o += `<rect x="${f1(q[1] - 18)}" y="${f1(ly + 18)}" width="36" height="22" rx="11" fill="#fff" opacity="${f3o(op * .92)}"/><text x="${f1(q[1])}" y="${f1(ly + 34)}" font-size="13" font-weight="700" fill="#8a4a24" text-anchor="middle" opacity="${f3o(op)}">${q[0]}</text>`; });
      }
      o += `<text x="${cx + 96}" y="${f1(ly + 14)}" font-size="12" font-weight="700" fill="#8a4a24">Large subunit</text>`;
      o += `<text x="${cx + 84}" y="${f1(sy + 20)}" font-size="12" font-weight="700" fill="#8a4a24">Small subunit</text>`;
      o += `<text x="215" y="16" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">${j > .8 ? "Subunits assemble on the mRNA: A, P, and E sites" : "Two subunits come together for translation"}</text>`;
      o += `<defs><radialGradient id="hRiboL" cx="35%" cy="28%" r="75%"><stop offset="0%" stop-color="#e5a271"/><stop offset="100%" stop-color="#b96a3c"/></radialGradient><radialGradient id="hRiboS" cx="35%" cy="28%" r="75%"><stop offset="0%" stop-color="#f3c79f"/><stop offset="100%" stop-color="#d9976a"/></radialGradient></defs>`;
      return wrapSvg(o);
    },
    mrna:t => {
      const seqs = "AUGGCAUUCGGA";
      let o = `<rect width="${W}" height="${H}" fill="#f4f6fb"/>`;
      o += `<path d="M28,86 H402" stroke="${ORANGE}" stroke-width="4" stroke-linecap="round"/>`;
      for (let i = 0; i < seqs.length; i++){
        const x = 44 + i * 30, on = ((Math.floor(t * 1.6) % seqs.length) + seqs.length) % seqs.length === i;
        o += tile(x, 86 - (on ? 5 : 0), seqs[i], .82);
      }
      const CD = [["Codon 1", 44, 104],["Codon 2", 134, 194],["Codon 3", 224, 284],["Codon 4", 314, 374]];
      const k = ((Math.floor(t / 2.4) % CD.length) + CD.length) % CD.length;
      const cd = CD[k] || CD[0];
      o += `<path d="M${cd[1] - 15},112 v8 H${cd[2] + 15} v-8" fill="none" stroke="${ORANGE}" stroke-width="2.5"/><text x="${(cd[1] + cd[2]) / 2}" y="136" font-size="12" font-weight="700" fill="${ORANGE}" text-anchor="middle">${cd[0]}</text>`;
      o += `<text x="20" y="62" font-size="12" font-weight="700" fill="#5a6376">5'</text><text x="404" y="62" font-size="12" font-weight="700" fill="#5a6376">3'</text>`;
      o += `<text x="215" y="30" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">Single-stranded, built 5' to 3', read in codons</text>`;
      return wrapSvg(o);
    },
    prot:t => {
      const T = 8, tt = t % T, fold = smooth(seg(tt, 1.4, 4)) * (1 - smooth(seg(tt, 6.8, 7.8)));
      let o = `<rect width="${W}" height="${H}" fill="#f4f6fb"/>`;
      const cols = ["#2f9e63","#f2b134","#3b7dd8","#8e5bd0","#d9443a","#0f9fb0"];
      const n = 12;
      const pts = [];
      for (let i = 0; i < n; i++){
        const lx = 70 + i * 26, ly = 92 + (i % 2 ? -7 : 7);
        const a = i / n * Math.PI * 2 + .4, fx = 215 + 46 * Math.cos(a), fy = 84 + 30 * Math.sin(a);
        pts.push([lerp(lx, fx, fold), lerp(ly, fy, fold)]);
      }
      if (fold > .5) o += `<ellipse cx="215" cy="84" rx="72" ry="52" fill="url(#gProt)" opacity="${f3o((fold - .5) * 1.6)}"/>`;
      let d = ""; pts.forEach((p, i) => { d += (i ? "L" : "M") + f1(p[0]) + "," + f1(p[1]); });
      o += `<path d="${d}" fill="none" stroke="#b9a0e0" stroke-width="4" stroke-linejoin="round"/>`;
      pts.forEach((p, i) => { o += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="8" fill="${cols[i % 6]}" stroke="#fff" stroke-width="1.6"/>`; });
      if (fold > .8){ const op = (fold - .8) * 5;
        o += `<path d="M176,66 a22,22 0 0 1 36,6" fill="none" stroke="#5a3f95" stroke-width="3" opacity="${f3o(op)}"/><text x="150" y="44" font-size="12" font-weight="700" fill="#5a3f95" opacity="${f3o(op)}">Active site</text>`; }
      o += `<text x="215" y="140" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">${fold > .7 ? "Folded protein: shape gives it its job" : "Amino acids joined by peptide bonds"}</text>`;
      o += `<defs><radialGradient id="gProt" cx="34%" cy="26%" r="78%"><stop offset="0%" stop-color="#d9c6f2"/><stop offset="100%" stop-color="#a982dd"/></radialGradient></defs>`;
      return wrapSvg(o);
    },
    plasmid:t => {
      let o = `<rect width="${W}" height="${H}" fill="#f4f6fb"/>`;
      const cx = 140, cy = 76;
      o += `<ellipse cx="240" cy="76" rx="150" ry="52" fill="#eaf4e3" stroke="#5d8a4f" stroke-width="3"/>`;
      let d = ""; for (let i = 0; i <= 200; i++){ const a = i / 200 * Math.PI * 2, r = 92 + 4 * Math.sin(9 * a); d += (i ? "L" : "M") + f1(240 + r * .88 * Math.cos(a)) + "," + f1(76 + r * .38 * Math.sin(a)); }
      o += `<path d="${d}Z" fill="none" stroke="${TEAL}" stroke-width="4"/>`;
      const rot = t * .6;
      [[196,64,17],[280,88,14],[300,58,11]].forEach((p, i) => {
        let pd = ""; for (let k = 0; k <= 90; k++){ const a = k / 90 * Math.PI * 2, r = p[2] * (1 + .04 * Math.sin(4 * a + rot + i)); pd += (k ? "L" : "M") + f1(p[0] + r * Math.cos(a)) + "," + f1(p[1] + r * .85 * Math.sin(a)); }
        o += `<path d="${pd}Z" fill="none" stroke="#f0c6e8" stroke-width="6"/><path d="${pd}Z" fill="none" stroke="${RED}" stroke-width="3"/>`;
      });
      o += `<text x="240" y="140" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">Small circular DNA, separate from the chromosome</text>`;
      o += `<text x="72" y="40" font-size="12" font-weight="700" fill="${TEAL}">Chromosome</text><text x="332" y="122" font-size="12" font-weight="700" fill="${RED}">Plasmids</text>`;
      return wrapSvg(o);
    },
    env:t => {
      let o = `<rect width="${W}" height="${H}" fill="#f4f6fb"/>`;
      const layers = [[30,"Outer membrane + LPS","#5d8a4f"],[58,"Peptidoglycan (thin)","#b5d3a8"],[86,"Plasma membrane","#7da86f"]];
      layers.forEach(l => {
        o += `<rect x="22" y="${l[0]}" width="190" height="15" rx="7" fill="${l[2]}"/>`;
        o += `<text x="220" y="${l[0] + 12}" font-size="12" font-weight="700" fill="#3f6335">${l[1]}</text>`;
      });
      const k = (t * .8) % 4;
      for (let i = 0; i < 4; i++){ const x = 42 + i * 44, on = Math.floor(k) === i;
        o += `<circle cx="${x}" cy="118" r="${on ? 8 : 6.5}" fill="${on ? "#3b7dd8" : "#9dc0ea"}"/>`;
        if (i < 3) o += `<path d="M${x + 10},118 H${x + 34}" stroke="#9aa3b5" stroke-width="2"/>`;
      }
      o += `<text x="228" y="123" font-size="12" font-weight="700" fill="#b0873a">\u2192 ATP</text>`;
      o += `<text x="215" y="145" font-size="11.5" font-weight="700" fill="#5a6376" text-anchor="middle">No mitochondria: the electron transport chain runs here</text>`;
      return wrapSvg(o);
    },
    flag:t => {
      let o = `<rect width="${W}" height="${H}" fill="#f4f6fb"/>`;
      o += `<rect x="20" y="52" width="70" height="52" rx="22" fill="#84b471"/>`;
      let d = "M90,78";
      for (let s = 0; s <= 300; s += 5){ const amp = Math.min(1, s / 50) * 17, w = amp * Math.sin(s / 24 - t * 7); d += ` L${f1(90 + s)},${f1(78 + w)}`; }
      o += `<path d="${d}" fill="none" stroke="#c0b193" stroke-width="7" stroke-linecap="round" opacity=".5"/><path d="${d}" fill="none" stroke="#8a7a5a" stroke-width="3.4" stroke-linecap="round"/>`;
      o += `<circle cx="92" cy="78" r="10" fill="#6b5f45"/><circle cx="92" cy="78" r="4" fill="#bdae90"/>`;
      o += `<text x="215" y="134" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">A rotary motor spins the filament like a propeller</text>`;
      return wrapSvg(o);
    }
  };
  const f3o = v => (+v).toFixed(3);

  /* ================= Popup ================= */
  const tileHTML = (k, opts) => {
    opts = opts || {};
    const m = MOD[k], ic = ICON[m.icon] || "";
    const cls = `tile${(m.wide && !opts.noWide) ? " wide" : ""}${m.soon ? " soon" : ""}${m.fun ? " fun" : ""}`;
    let doneMod = false; try { doneMod = !!(m.wide && m.href && localStorage.getItem("bio112-done:" + m.href.split("#")[0]) === "1"); } catch (e) {}
    const inner = `${ic}<b>${m.name}${doneMod ? ' <i class="donechk" title="Test mode complete">\u2713</i>' : ""}</b>${opts.noDesc ? "" : `<span>${m.desc}</span>`}`;
    return m.soon ? `<div class="${cls}">${inner}</div>` : `<a class="${cls}" style="--tc:${m.col || "#5b3fb0"}" href="${m.href}">${inner}</a>`;
  };
  (function(){
    const CH8 = ["pretx","transcription","posttx","translation","mutations"];
    const LABS_DIR = ["build","lab","splice","editor"];
    const CH5 = ["enzymes","energy","glycolysis","krebs","ferment"];
    const t = k => tileHTML(k, {noDesc:true, noWide:true});
    const el = document.getElementById("modDir");
    if (!el) return;
    el.innerHTML = `<div class="modtabs" role="tablist">
        <button class="modtab" data-tab="ch8" aria-selected="true">Chapter 8: From DNA to Protein</button>
        <button class="modtab" data-tab="ch5" aria-selected="false">Chapter 5: Microbial Metabolism</button>
      </div>
      <div class="modpanel" data-panel="ch8">
        <div class="grid">${CH8.map(t).join("")}</div>
        <h2>Practice labs</h2>
        <p class="moddesc">Ready to put it to the test? These hands-on labs let you test your knowledge and explore the material at your own pace.</p>
        <div class="grid">${LABS_DIR.map(t).join("")}</div>
      </div>
      <div class="modpanel" data-panel="ch5" hidden>
        <div class="grid">${CH5.map(t).join("")}</div>
      </div>`;
    el.querySelectorAll(".modtab").forEach(b => b.addEventListener("click", () => {
      el.querySelectorAll(".modtab").forEach(x => x.setAttribute("aria-selected", String(x === b)));
      el.querySelectorAll(".modpanel").forEach(p => { p.hidden = p.dataset.panel !== b.dataset.tab; });
    }));
  })();
  const factHTML = f => `<div class="fact"><span class="em">${f[0]}</span><span>${f[1]}</span></div>`;
  let heroKey = null, heroT0 = 0;
  function showPanel(key){
    const P = PARTS[key];
    if (!P) return;
    closePop(true);
    open = key; markSel();
    const scrim = document.createElement("div");
    scrim.className = "scrim"; scrim.id = "scrim";
    scrim.addEventListener("click", () => closePop());
    const el = document.createElement("div");
    el.className = "pop"; el.id = "pop";
    el.setAttribute("role", "dialog"); el.setAttribute("aria-label", P.title);
    el.style.borderTopColor = P.col;
    el.style.top = P.top;
    el.style[P.side === "left" ? "left" : "right"] = "3%";
    el.innerHTML = `<button class="closeX" id="popClose" aria-label="Close">\u00d7</button>`
      + `<div class="hero" id="hero"></div>`
      + `<div class="popbody"><div class="pophead"><div class="kick" style="color:${P.col}">${P.kick}</div><h2>${P.title}</h2></div>`
      + `<div class="facts">${P.facts.map(factHTML).join("")}<div id="extraFacts" hidden>${(P.extra || []).map(factHTML).join("")}</div></div>`
      + ((P.extra || []).length ? `<button class="morebtn" id="moreFacts">+ more facts</button>` : "")
      + (P.mods.length ? `<div class="tiles">${P.mods.map(tileHTML).join("")}</div>` : "")
      + `</div>`;
    stage.appendChild(scrim); stage.appendChild(el);
    heroKey = P.hero; heroT0 = performance.now();
    $("popClose").addEventListener("click", () => closePop());
    const mf = $("moreFacts");
    if (mf) mf.addEventListener("click", () => { const x = $("extraFacts"); x.hidden = !x.hidden; mf.textContent = x.hidden ? "+ more facts" : "\u2212 fewer facts"; });
    $("popClose").focus({preventScroll:true});
  }
  function closePop(quiet){
    const p = $("pop"), s = $("scrim");
    if (p) p.remove();
    if (s) s.remove();
    heroKey = null;
    if (!quiet){ open = null; markSel(); }
  }
  const activate = el => { const g = el.closest("[data-part]"); if (g) showPanel(g.dataset.part); };
  svg.addEventListener("click", e => activate(e.target));
  svg.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.closest("[data-part]")){ e.preventDefault(); activate(e.target); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });

  const CHIPS = [["dna","DNA",TEAL],["mrna","mRNA",ORANGE],["ribosome","Ribosomes",BROWN],["protein","Proteins",PURPLE],["plasmid","Plasmids",RED],["envelope","Cell envelope","#5d8a4f"],["flagellum","Flagellum","#6b5f45"]];
  $("legend").innerHTML = CHIPS.map(c => `<button class="chip" data-part="${c[0]}"><i style="background:${c[2]}"></i>${c[1]}</button>`).join("");
  $("legend").querySelectorAll("[data-part]").forEach(b => b.addEventListener("click", () => showPanel(b.dataset.part)));

  const t0 = performance.now();
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now){
    const fw = $("flagWaves");
    if (fw && !reduced) fw.innerHTML = waves((now - t0) / 1000);
    const h = $("hero");
    if (h && heroKey && HERO[heroKey]){
      const ht = reduced ? 5 : ((now - heroT0) / 1000) % 600;
      try { h.innerHTML = HERO[heroKey](ht >= 0 ? ht : 0); } catch (err){ heroKey = null; }
    }
    requestAnimationFrame(frame);
  }
  draw();
  requestAnimationFrame(frame);
  window.__hub = {showPanel, closePop, PARTS, MOD, HERO};
})();
</script>
<script src="studypath.js"></script>
<script>
(function(){
  const SP = window.StudyPath; if (!SP) return;
  const d = SP.done(), first = SP.STOPS.findIndex((x, i) => !d.includes(i)), cur = SP.active() ? SP.current() : (d.length ? Math.max(first, 0) : -1);
  const idxed = SP.STOPS.map((s, i) => ({s, i}));
  const ch8 = idxed.filter(x => !x.s.area.startsWith("Chapter 5")), ch5 = idxed.filter(x => x.s.area.startsWith("Chapter 5"));
  const bucket = (arr, label) => { const n = arr.filter(x => d.includes(x.i)).length; return `<span class="bucket${n === arr.length ? " done" : ""}"><b>${label}</b>: ${n} of ${arr.length}</span>`; };
  document.getElementById("pcStops").innerHTML = bucket(ch8, "Chapter 8") + bucket(ch5, "Chapter 5");
  const A = document.getElementById("pcActions");
  A.innerHTML = cur >= 0 || d.length
    ? `<button class="pc-go" id="pcGo">Continue: stop ${Math.max(cur, 0) + 1} \u2192</button><button class="pc-alt" id="pcRestart">Start the path over</button>`
    : `<button class="pc-go" id="pcGo">Start the Study Path \u2192</button>`;
  document.getElementById("pcGo").onclick = () => SP.go(Math.max(cur, 0));
  const r = document.getElementById("pcRestart"); if (r) r.onclick = () => SP.start();
})();
</script>
