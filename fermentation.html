<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fermentation and Anaerobic Respiration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
.typelink{position:absolute;top:83%;transform:translate(-50%,-100%);box-shadow:0 2px 6px rgba(29,36,51,.18)}
@media (max-width:640px){.typelink{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script src="bioart.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, f3, lerp, clamp, smooth, seg, C} = A;
  const BL = {
    notoxygen:{show:"not oxygen", ans:["notoxygen","noto2","nototwo","nooxygen","anythingbutoxygen","notoxygeno2"], fuzzy:true},
    nitrate:{show:"Nitrate", ans:["nitrate","no3"], fuzzy:true},
    sulfate:{show:"Sulfate", ans:["sulfate","sulphate","so4"], fuzzy:true},
    etc:{show:"electron transport chain", ans:["electrontransportchain","etc","electrontransport"], fuzzy:true},
    less:{show:"less", ans:["less","fewer","lower"], fuzzy:true},
    nadplus:{show:"NAD⁺", ans:["nad","nadplus"]},
    two:{show:"2", ans:["2","two"]},
    oxygen:{show:"oxygen", ans:["oxygen","o2"], fuzzy:true},
    alcohol:{show:"Alcohol", ans:["alcohol","alcoholic","ethanol"], fuzzy:true},
    lactic:{show:"lactic acid", ans:["lacticacid","lactate","lactic"], fuzzy:true},
    phenol:{show:"phenol red", ans:["phenolred","phenol"], fuzzy:true},
    acid:{show:"acid", ans:["acid","acids","acidic","lacticacid","h"], fuzzy:true}
  };
  const MORE = {
    denit:{title:"Denitrification and rotten eggs", html:`<p>Bacteria like <i>Pseudomonas</i> and <i>Bacillus</i> can use nitrate as their final electron acceptor. Reducing nitrate all the way to N₂ gas is called denitrification, and it returns nitrogen to the atmosphere (and pulls it out of farm soil).</p><p>Sulfate-reducing bacteria like <i>Desulfovibrio</i> turn sulfate into hydrogen sulfide (H₂S), the rotten-egg smell of marshes and black mud.</p>`},
    why:{title:"Why less ATP than aerobic?", html:`<p>Oxygen pulls on electrons harder than nitrate or sulfate does. With a weaker final acceptor, electrons release less energy as they move down the chain, so fewer H⁺ get pumped and less ATP is made. Only part of the Krebs cycle may run too.</p>`},
    lactic:{title:"Your muscles ferment too", html:`<p>During hard exercise, your muscle cells can run low on oxygen. They switch to lactic acid fermentation to keep glycolysis going, making lactate. It's a quick 2 ATP per glucose, a lot less than aerobic respiration, but fast!</p>`},
    swiss:{title:"The holes in Swiss cheese", html:`<p><i>Propionibacterium</i> ferments lactic acid into propionic acid and CO₂. The propionic acid gives Swiss cheese its nutty flavor, and the trapped CO₂ bubbles make the holes (called "eyes").</p>`},
    test:{title:"Durham tubes", html:`<p>The tiny upside-down tube inside a fermentation tube is a Durham tube. It starts full of broth. If the bacteria make gas (like CO₂ or H₂), some gets trapped at the top of the Durham tube as a visible bubble.</p>`}
  };

  /* ================= Scenes ================= */
  /* Every activity happens on the diagram: chips start on the graphic and drop onto parts of it.
     The box under the diagram only holds the instructions and feedback. */
  const BA = window.BioArt;
  const ECOL = ["#7c8be8", "#eab04d", "#5fbd9c", "#e78a80"];
  const WALL = `<defs><pattern id="fWall" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#c6dcb5"/><path d="M0,5 H10 M5,0 V10" stroke="#93b57d" stroke-width="1.5"/></pattern></defs>`;
  /* the same rod-shaped bacterium used on the gene-expression pages: wall, membrane bilayer, nucleoid */
  function cell(cx, cy, rx, ry, seed, key){
    const pk = BA.capsule(cx, cy, rx, ry, 0.03, seed);
    return WALL + BA.outline(BA.grow(pk, 11), "url(#fWall)", "#5f8a4f", 2) + BA.bilayer(pk, {fill:"#f1f7ec", head:"#c9a15a", tail:"#f4e8cc", gap:4, r:2.3, step:7.5}, key)
      + BA.tangle(cx - rx * .52, cy + ry * .18, rx * .3, ry * .4, seed + 3, {col:"#0f766e", n:10, loops:3, op:.5});
  }
  const RED = "#e0463c", YEL = "#f5c518", NADG = "#1b7f4e";
  const now = () => performance.now() / 1000;
  /* drag bookkeeping shared by every activity */
  const dragging = (st, k) => !!(st && st.drag && st.drag.moved && st.drag.kind === k);
  const at = (st, k, x, y) => dragging(st, k) ? [st.drag.x, st.drag.y] : [x, y];
  const holding = st => !!(st && ((st.drag && st.drag.moved) || (st.pick !== undefined && st.pick !== null)));
  const overZ = (st, z) => !!(st && st.drag && st.drag.moved && (z.hit ? z.hit(st.drag) : Math.abs(st.drag.x - z.x) <= z.w / 2 && Math.abs(st.drag.y - z.y) <= z.h / 2));
  const zState = (st, z) => overZ(st, z) ? "over" : holding(st) ? "ready" : "";
  /* a chip the student can pick up, drawn last so it floats over everything */
  const tokChip = (st, id, label, x, y) => { const [px, py] = at(st, id, x, y); return `<g data-drag="${id}" style="cursor:grab">${A.chip(px, py, label, st.pick === id ? "pick" : "")}</g>`; };
  const tokens = (st, list) => list.slice().sort((a, b) => dragging(st, a.id) - dragging(st, b.id)).map(it => it.draw ? it.draw(st) : tokChip(st, it.id, it.label, it.x, it.y)).join("");
  const play = (g, done) => !!g && !done;

  /* ---------- Step 1: same cell, two environments. The student supplies the final acceptor. ---------- */
  const ACC_SOCK = [[806, 168], [878, 168]];
  const ACC_ITEMS = [{id:"o2", label:"O₂", x:556, y:140}, {id:"no3", label:"NO₃⁻", x:626, y:140}, {id:"so4", label:"SO₄²⁻", x:696, y:140}, {id:"glu", label:"Glucose", x:580, y:190}];
  const accDraw = (k, x, y) => k === "no3" ? A.no3(x, y) : k === "so4" ? A.so4(x, y) : k === "o2" ? A.o2(x, y, 13) : `<rect x="${f1(x - 44)}" y="${f1(y - 16)}" width="88" height="32" rx="16" fill="#fff" stroke="#5a6376" stroke-width="2.5"/>` + A.tx(x, y + 5, "Glucose", "t14 mid");
  function pipesScene(t, R, g, done){
    const T = 7, ph = (t % T) / T, live = play(g, done);
    let o = A.tx(500, 36, "Same cell, same pathway. What waits at the end of the chain?", "t20 mid");
    const one = (cx, aerobic, seed) => {
      const col = aerobic ? "#1b7f4e" : "#9a6212", cy = 316, ry = 72, top = cy - ry, ex = cx + 90;
      let s = `<rect x="${cx - 235}" y="62" width="470" height="378" rx="26" fill="${aerobic ? "#f2f8ff" : "#fdf7ec"}" stroke="${aerobic ? "#cfe0f5" : "#f0dcb0"}" stroke-width="2"/>`;
      s += A.tx(cx, 94, aerobic ? "Aerobic respiration" : "Anaerobic respiration", "t20 mid", `style="fill:${col}"`);
      s += cell(cx, cy, 200, ry, seed, aerobic ? "fAe2" : "fAn2");
      s += A.tx(cx + 72, cy + 10, "Glycolysis + Krebs cycle", "t14 mid muted") + A.tx(cx + 72, cy + 30, "load up NADH and FADH₂", "t14 mid muted");
      [-90, -30, 30, 90].forEach((dx, i) => s += `<rect x="${cx + dx - 15}" y="${top - 22}" width="30" height="44" rx="10" fill="${ECOL[i]}" stroke="#fff" stroke-width="2"/>` + A.tx(cx + dx, top + 5, ["I", "II", "III", "IV"][i], "t14 mid wht"));
      /* which acceptors sit at the end of the chain right now */
      const accs = aerobic ? [[ex + 36, 168, "o2"]] : live ? ACC_SOCK.map((q, k) => g.sock[k] ? [q[0], q[1], g.sock[k].id, g.sock[k].t] : null).filter(Boolean) : [[ACC_SOCK[0][0], 168, "no3", -9], [ACC_SOCK[1][0], 168, "so4", -9]];
      /* electrons run along the membrane, then hop to whatever sits at the end */
      let hit = -1;
      for (let j = 0; j < 3; j++){
        const q = (ph + j / 3) % 1;
        if (q < .62) s += A.eDot(lerp(cx - 90, ex, q / .62), top + 28, 8);
        else if (accs.length && q < .8){ const u = smooth((q - .62) / .18), a = accs[(Math.floor(t / T) + j) % accs.length]; s += A.eDot(lerp(ex, a[0], u), lerp(top + 28, a[1] + 18, u), 8); if (u > .85) hit = accs.indexOf(a); }
      }
      if (!aerobic && live) ACC_SOCK.forEach((q, k) => { if (!g.sock[k]) s += `<circle cx="${q[0]}" cy="${q[1]}" r="27" fill="${overZ(g, {x:q[0], y:q[1], w:60, h:60}) ? "#dfe3fb" : holding(g) ? "#eef0fd" : "#fff"}" stroke="${holding(g) ? "#3f4cc0" : "#8a93a3"}" stroke-width="2.5" stroke-dasharray="6 4"/>` + A.tx(q[0], q[1] + 6, "?", "t16 mid muted"); });
      if (!aerobic) s += A.tx(842, 130, "end of the chain", "t12 mid muted");
      accs.forEach((a, k) => {
        const bob = 3 * Math.sin(t * 2 + k * 2), age = a[3] === undefined || a[3] < 0 ? 9 : now() - a[3];
        if (hit === k) s += `<circle cx="${a[0]}" cy="${f1(a[1] + bob)}" r="28" fill="#f2b134" opacity=".4"/>`;
        /* a fresh acceptor flashes, then turns into its reduced product */
        const red = age > 1.4, fl = clamp(1 - Math.abs(age - 1.2) / .3, 0, 1);
        if (fl > 0) s += `<circle cx="${a[0]}" cy="${f1(a[1] + bob)}" r="${f1(20 + 16 * fl)}" fill="#f2b134" opacity="${f1(.5 * fl)}"/>`;
        if (a[2] === "o2") s += A.o2(a[0], a[1] + bob, 13);
        else if (a[2] === "no3") s += red && live ? A.no2(a[0], a[1] + bob) : A.no3(a[0], a[1] + bob);
        else s += red && live ? A.h2s(a[0], a[1] + bob) : A.so4(a[0], a[1] + bob);
      });
      if (aerobic){
        for (let i = 0; i < 3; i++){ const x = cx - 190 + ((t * 22 + i * 87) % 260), y = 150 + 8 * Math.sin(t * 1.5 + i * 2); s += A.op(.75, A.o2(x, y, 11)); }
        s += A.tx(cx, 418, "Final acceptor: O₂ → H₂O", "t16 mid", `style="fill:${col}"`);
      } else {
        const got = live ? g.sock.filter(Boolean).map(q => q.id) : ["no3", "so4"];
        const line = got.length ? got.map(k => k === "no3" ? "NO₃⁻ → NO₂⁻ or N₂" : "SO₄²⁻ → H₂S").join("   ·   ") : `Final acceptor: ${R("notoxygen") === "?" ? "?" : "NOT oxygen"}`;
        s += A.tx(cx, 418, line, "t16 mid", `style="fill:${col}"`);
      }
      return s;
    };
    o += one(260, true, 7) + one(740, false, 12);
    if (live){
      o += tokens(g, ACC_ITEMS.filter(it => !g.sock.some(q => q && q.id === it.id)).map(it => ({...it, draw:st => {
        const [x, y] = at(st, it.id, it.x, it.y), sel = st.pick === it.id;
        return `<g data-drag="${it.id}" style="cursor:grab"><circle cx="${f1(x)}" cy="${f1(y)}" r="30" fill="#fff" opacity=".01"/>${sel ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="28" fill="none" stroke="${C.gold}" stroke-width="4" stroke-dasharray="6 4"/>` : ""}${accDraw(it.id, x, y)}${it.id === "o2" ? `<path d="M${f1(x - 16)},${f1(y - 14)} L${f1(x + 16)},${f1(y + 14)} M${f1(x + 16)},${f1(y - 14)} L${f1(x - 16)},${f1(y + 14)}" stroke="#b83a34" stroke-width="3.5" stroke-linecap="round"/>` : ""}</g>`; }})));
    } else o += A.op(.45, A.o2(580, 150, 12)) + `<path d="M558,136 L602,164 M602,136 L558,164" stroke="#d9443a" stroke-width="4" stroke-linecap="round"/>` + A.tx(580, 190, "no O₂", "t14 mid", `style="fill:#b83a34"`);
    o += A.tx(500, 462, `Less ATP than aerobic respiration, but more than fermentation.`, "t14 mid muted");
    return o;
  }

  /* ---------- Step 2: aerobic vs. anaerobic, as a Venn diagram ---------- */
  const VENN = {L:[360, 255], R:[640, 255], rx:270, ry:175};
  const inEll = (c, p) => ((p.x - c[0]) / VENN.rx) ** 2 + ((p.y - c[1]) / VENN.ry) ** 2 <= 1;
  const vennBin = p => { const l = inEll(VENN.L, p), r = inEll(VENN.R, p); return l && r ? "both" : l ? "aer" : r ? "an" : null; };
  const SORT = [["a", "Glycolysis + Krebs + ETC", "both"], ["g", "Uses ATP synthase", "both"], ["h", "Glucose in, CO₂ out", "both"],
    ["b", "Final acceptor: O₂", "aer", "Only aerobic respiration hands electrons to O₂."], ["d", "Makes 32–38 ATP", "aer", "That's the big aerobic payoff. Anaerobic respiration makes less."], ["f", "Makes water (H₂O)", "aer", "O₂ + electrons + H⁺ → H₂O. That only happens with oxygen."],
    ["c", "Acceptor: NO₃⁻ or SO₄²⁻", "an", "Nitrate and sulfate stand in for oxygen in anaerobic respiration."], ["e", "Can make H₂S", "an", "Sulfate gets reduced to hydrogen sulfide."], ["l", "Less ATP than aerobic", "an", "A weaker final acceptor releases less energy, so less ATP."]];
  const SLOT = {aer:[255, [185, 230, 275]], both:[500, [212, 257, 302]], an:[745, [185, 230, 275]]};
  const TRAY2 = () => A.chipRows(SORT.map(c => [c[0], c[1]]), 500, 458, 960, 42);
  function vennScene(t, R, g, done){
    const live = play(g, done), placed = live ? g.placed : Object.fromEntries(SORT.map(c => [c[0], c[2]]));
    let o = A.tx(500, 34, "Aerobic vs. anaerobic respiration", "t20 mid");
    const hl = k => live && g.drag && g.drag.moved && vennBin(g.drag) === k;
    o += `<ellipse cx="${VENN.L[0]}" cy="${VENN.L[1]}" rx="${VENN.rx}" ry="${VENN.ry}" fill="#e3effd" fill-opacity=".85" stroke="#8fb2e6" stroke-width="${hl("aer") ? 4 : 2.5}"/>`;
    o += `<ellipse cx="${VENN.R[0]}" cy="${VENN.R[1]}" rx="${VENN.rx}" ry="${VENN.ry}" fill="#fbecd2" fill-opacity=".65" stroke="#e2c27d" stroke-width="${hl("an") ? 4 : 2.5}"/>`;
    if (hl("both")) o += `<path d="M500,${f1(VENN.L[1] - 155)} Q620,255 500,${f1(VENN.L[1] + 155)} Q380,255 500,${f1(VENN.L[1] - 155)}Z" fill="#3f4cc0" opacity=".12"/>`;
    o += A.tx(280, 140, "Aerobic only", "t16 mid", `style="fill:#1b7f4e"`) + A.tx(500, 140, "Both", "t16 mid", `style="fill:#3f4cc0"`) + A.tx(720, 140, "Anaerobic only", "t16 mid", `style="fill:#9a6212"`);
    /* a little mechanism in each side: what happens at the end of the chain */
    o += A.o2(190, 352, 12) + A.arrow(214, 352, 246, 352, "#1b7f4e", 2.5) + A.h2o(268, 349) + A.tx(229, 386, "O₂ → H₂O", "t14 mid", `style="fill:#1b7f4e"`);
    o += A.no3(690, 352) + A.arrow(712, 352, 744, 352, "#9a6212", 2.5) + A.no2(764, 352) + A.tx(727, 386, "NO₃⁻ → NO₂⁻", "t14 mid", `style="fill:#9a6212"`);
    /* placed cards stack in their region */
    ["aer", "both", "an"].forEach(k => { const L = SORT.filter(c => placed[c[0]] === k); L.forEach((c, i) => { o += A.chip(SLOT[k][0], SLOT[k][1][i], c[1], "ok"); }); });
    if (live){
      const P = TRAY2(), un = SORT.filter(c => !placed[c[0]]);
      o += tokens(g, un.map(c => ({id:c[0], label:c[1], x:P[c[0]][0], y:P[c[0]][1]})));
    }
    return o;
  }

  /* ---------- Step 3: fermentation recycles NAD⁺ ---------- */
  const NB = 250, GLY = {x:275, y:NB, w:176, h:82}, FER = {x:665, y:NB, w:176, h:82};
  const pair = (x, y, full) => A.carrier(x + 8, y, "NAD", full) + `<circle cx="${f1(x - 30)}" cy="${f1(y)}" r="13" fill="#fff" stroke="${NADG}" stroke-width="2"/>` + A.tx(x - 30, y + 4.5, "×2", "t12 mid", `style="fill:${NADG}"`);
  const bez = (u, p0, p1, p2, p3) => { const v = 1 - u; return v * v * v * p0 + 3 * v * v * u * p1 + 3 * v * u * u * p2 + u * u * u * p3; };
  const rowX = (n, i) => 500 - (n - 1) * 46 + i * 92;
  function nadScene(t, R, g, done){
    const live = play(g, done);
    let o = A.tx(500, 34, "Fermentation's job: recycle NAD⁺", "t20 mid");
    const stuck = live && g.nad === 0 && g.nadh > 0;
    /* glucose → glycolysis → pyruvate → fermentation → product */
    o += A.glucoseRing(78, NB - 8, {r:7}) + A.tx(78, NB + 44, "Glucose", "t14 mid") + A.arrow(116, NB, GLY.x - GLY.w / 2 - 6, NB, "#5a6376", 3);
    const box = (Z, title, sub, col, zs) => (zs ? A.zone(Z.x, Z.y, Z.w + 18, Z.h + 18, zs, 20) : "") + `<rect x="${Z.x - Z.w / 2}" y="${Z.y - Z.h / 2}" width="${Z.w}" height="${Z.h}" rx="16" fill="#fff" stroke="${col}" stroke-width="3"/>` + A.tx(Z.x, Z.y - 6, title, "t16 mid", `style="fill:${col}"`) + A.tx(Z.x, Z.y + 20, sub, "t14 mid muted");
    const zs = Z => live && holding(g) ? zState(g, Z) : "";
    const flash = (k) => live && g.fx && g.fx.k === k ? clamp(1 - (now() - g.fx.t) / 1.2, 0, 1) : 0;
    if (flash("gly") > 0) o += `<rect x="${GLY.x - 100}" y="${NB - 52}" width="200" height="104" rx="22" fill="#f2b134" opacity="${f1(.45 * flash("gly"))}"/>`;
    if (flash("fer") > 0) o += `<rect x="${FER.x - 100}" y="${NB - 52}" width="200" height="104" rx="22" fill="#f2b134" opacity="${f1(.45 * flash("fer"))}"/>`;
    o += (stuck ? `<rect x="${GLY.x - 98}" y="${NB - 50}" width="196" height="100" rx="20" fill="none" stroke="#b83a34" stroke-width="3" stroke-dasharray="6 5"/>` : "")
      + box(GLY, "Glycolysis", stuck ? "STUCK: no NAD⁺!" : live ? `ATP made: ${g.runs * 2}` : "makes 2 ATP", "#b83a34", zs(GLY));
    o += A.arrow(GLY.x + GLY.w / 2 + 4, NB, 418, NB, "#5a6376", 3) + A.carbons(470, NB - 8, 3, {r:9, gap:21}) + A.tx(470, NB + 30, "Pyruvate", "t14 mid") + A.arrow(522, NB, FER.x - FER.w / 2 - 6, NB, "#5a6376", 3);
    o += box(FER, "Fermentation", live ? `NAD⁺ recycled: ${g.back * 2}` : "pyruvate takes the e⁻", "#9a6212", zs(FER));
    o += A.arrow(FER.x + FER.w / 2 + 4, NB, 838, NB, "#9a6212", 3) + A.carbons(895, NB - 8, 3, {r:9, gap:21, col:"#9a6212"}) + A.tx(895, NB + 30, "Lactate", "t14 mid", `style="fill:#9a6212"`) + A.tx(895, NB + 50, "(or ethanol + CO₂)", "t12 mid muted");
    /* the two loops: NADH carries electrons over, NAD⁺ comes back */
    o += `<path d="M${GLY.x},${NB + 43} C${GLY.x},${NB + 140} ${FER.x},${NB + 140} ${FER.x},${NB + 45}" fill="none" stroke="${NADG}" stroke-width="3.5"/>` + A.arrow(FER.x, NB + 60, FER.x, NB + 43, NADG, 3.5);
    o += `<path d="M${FER.x},${NB - 43} C${FER.x},${NB - 138} ${GLY.x},${NB - 138} ${GLY.x},${NB - 45}" fill="none" stroke="${NADG}" stroke-width="3.5" stroke-dasharray="8 6"/>` + A.arrow(GLY.x, NB - 60, GLY.x, NB - 43, NADG, 3.5);
    o += A.tx(470, NB + 96, "NADH carries e⁻ over", "t14 mid", `style="fill:${NADG}"`) + A.tx(470, NB - 82, "NAD⁺ comes back", "t14 mid", `style="fill:${NADG}"`);
    if (live){
      o += A.tx(250, 88, "NAD⁺ ready", "t14 end muted") + A.tx(250, 424, "NADH waiting", "t14 end muted");
      /* a pair that was just used flies along its loop */
      if (g.fx && now() - g.fx.t < 1.2){
        const u = smooth((now() - g.fx.t) / 1.2);
        if (g.fx.k === "gly") o += pair(bez(u, GLY.x, GLY.x, FER.x, FER.x), bez(u, NB + 43, NB + 140, NB + 140, NB + 45) + 4, true) + A.op(1 - u, A.tx(GLY.x, NB - 60 - 30 * u, "+2 ATP", "t16 mid", `style="fill:${C.atpText}"`));
        else o += pair(bez(u, FER.x, FER.x, GLY.x, GLY.x), bez(u, NB - 43, NB - 138, NB - 138, NB - 45) - 4, false);
      }
      const items = [];
      for (let i = 0; i < g.nad; i++) items.push({id:"nad" + i, label:"2 NAD⁺", x:rowX(g.nad, i), y:84, draw:st => { const [x, y] = at(st, "nad" + i, rowX(g.nad, i), 84); return `<g data-drag="nad${i}" style="cursor:grab"><rect x="${f1(x - 40)}" y="${f1(y - 26)}" width="80" height="52" fill="#fff" opacity=".01"/>${st.pick === "nad" + i ? `<rect x="${f1(x - 42)}" y="${f1(y - 26)}" width="84" height="52" rx="18" fill="none" stroke="${C.gold}" stroke-width="4" stroke-dasharray="6 4"/>` : ""}${pair(x, y, false)}</g>`; }});
      for (let i = 0; i < g.nadh; i++) items.push({id:"nadh" + i, label:"2 NADH", x:rowX(g.nadh, i), y:420, draw:st => { const [x, y] = at(st, "nadh" + i, rowX(g.nadh, i), 420); return `<g data-drag="nadh${i}" style="cursor:grab"><rect x="${f1(x - 40)}" y="${f1(y - 26)}" width="80" height="52" fill="#fff" opacity=".01"/>${st.pick === "nadh" + i ? `<rect x="${f1(x - 42)}" y="${f1(y - 26)}" width="84" height="52" rx="18" fill="none" stroke="${C.gold}" stroke-width="4" stroke-dasharray="6 4"/>` : ""}${pair(x, y, true)}</g>`; }});
      o += tokens(g, items);
    } else {
      const q = (t % 6) / 6, a = q < .5 ? q * 2 : 1, b = q >= .5 ? (q - .5) * 2 : 0;
      if (q < .5) o += A.carrier(bez(a, GLY.x, GLY.x, FER.x, FER.x), bez(a, NB + 43, NB + 140, NB + 140, NB + 45) - 4, "NAD", true);

  /* ---------- Step 4: types of fermentation. Products drop onto the microbes that make them ---------- */

  /* ================= Activities: all on the diagram ================= */

      zones:st => MATCH.filter(m => !st.ok[m[0]]).map(m => ({id:m[0], label:m[0] === "lac" ? "Lactic acid fermentation" : m[0] === "eth" ? "Alcohol fermentation" : m[0] === "prop" ? "Propionibacterium" : "Clostridium", x:m[2][0], y:m[2][1], w:m[2][2], h:m[2][3]})),
      put:(st, k, z, api) => { if (k !== z){ api.msg("Not that one. Read the microbe names on each card!", "bad"); return; }
        st.ok[k] = 1; if (Object.keys(st.ok).length === 4) finish(api, "All matched!"); else api.msg("Yes!", "good"); }}),
    food:placeGate({title:"Your turn: which kind of fermentation?", done:"Sorted! Lactic acid sours foods; alcohol fermentation makes drinks and makes bread rise.",
      init:() => ({placed:{}}),
      tip:"Drag each food onto the branch of fermentation that makes it.",
      miss:"Drop the food onto one of the three dashed shelves.",
      items:st => { const P = TRAY5(); return FOODS.filter(f => !st.placed[f[0]]).map(f => ({id:f[0], label:f[1], x:P[f[0]][0], y:P[f[0]][1]})); },
      zones:() => LANES.map(l => ({id:l.k, label:l.t, ...SHELF(l.k)})),
      put:(st, k, z, api) => { const f = FOODS.find(q => q[0] === k); if (!f || st.placed[k]) return;
        if (f[2] !== z){ api.msg(f[3] || "Not quite. Is it sour (lactic acid), boozy or bubbly (alcohol), or something else?", "bad"); return; }
        st.placed[k] = z; const left = FOODS.filter(q => !st.placed[q[0]]).length;
        if (!left) finish(api, "All sorted!"); else api.msg(f[3] ? "Yes! " + f[3] : `Yes! ${left} to go.`, "good"); }}),
    tubes:placeGate({title:"Your turn: read the tubes", done:"Yellow = acid from fermentation. A bubble = gas. Red = no fermentation.",
      init:() => ({ok:{}}),
      tip:"Drag each result onto the tube that shows it.",
      miss:"Drop the result right onto one of the three tubes.",
      items:st => { const P = TRAY6(); return RES.filter(r => !st.ok[r[0]]).map(r => ({id:r[0], label:r[1], x:P[r[0]][0], y:P[r[0]][1]})); },
      zones:() => TX.map((x, i) => ({id:RES[i][0], label:`Tube ${i + 1}`, ...TUBEZ(i)})),
      put:(st, k, z, api) => { if (k !== z){ api.msg("Remember: yellow means acid (low pH), and a bubble in the Durham tube means gas.", "bad"); return; }
        st.ok[k] = 1; if (Object.keys(st.ok).length === 3) finish(api, "You can read a fermentation test!"); else api.msg("Yes!", "good"); }}),
    final:placeGate({title:"Your turn: fill in the table", done:"You've got it: aerobic, anaerobic, and fermentation!",
      init:() => ({cells:{}, used:{}}),
      tip:"Drag each answer from under the table into its empty box (or tap an answer, then tap a box).",
      miss:"Drop the answer into one of the empty boxes in the table.",
      items:st => { const P = TRAY7(); return FIN_BANK.filter(c => !st.used[c.id]).map(c => ({id:c.id, label:c.text, x:P[c.id][0], y:P[c.id][1]})); },
      zones:st => { const z = []; for (let j = 0; j < FIN_ROWS.length; j++) for (let i = 1; i <= 3; i++) if (!st.cells[j + "_" + i]) z.push({...CELLZ(j, i), label:`${FIN_ROWS[j][0]}, ${["", "aerobic", "anaerobic", "fermentation"][i]}`}); return z; },
      put:(st, id, key, api) => { const c = FIN_BANK.find(q => q.id === id); if (!c || st.used[id]) return;
        const j = +key.split("_")[0], i = +key.split("_")[1];
        if (FIN_ROWS[j][i] !== c.text){ api.msg("Not that one. Think about the row: " + FIN_ROWS[j][0], "bad"); return; }
        st.cells[key] = c.text; st.used[id] = 1;
        if (Object.keys(st.cells).length === 15) finish(api, "Table complete!", 900); else api.msg("Yes!", "good"); }})
  };

  const P1 = "Anaerobic respiration", P2 = "Fermentation", P3 = "Wrap-up";
  const STEPS = [
    {part:P1, title:"When oxygen ghosts you", scene:(t, c) => pipesScene(t, c.R, c.g, c.done), gate:GATES.acceptor, more:"denit", live:true,
     text:`Many bacteria can still respire without oxygen! In anaerobic respiration, the final electron acceptor is {{notoxygen}}. The cell still uses glycolysis, the Krebs cycle, the {{etc}}, and chemiosmosis. Instead of O₂, it uses other inorganic molecules: {{nitrate}} (NO₃⁻) is reduced to nitrite (NO₂⁻) or N₂ gas, and {{sulfate}} (SO₄²⁻) is reduced to hydrogen sulfide (H₂S).`},
    {part:P1, title:"How is it different from aerobic?", scene:(t, c) => vennScene(t, c.R, c.g, c.done), gate:GATES.sort3, more:"why", live:true, vh:520,
     text:`Anaerobic respiration starts with the same material, glucose (or another organic molecule), and it still releases CO₂. The big difference is the final electron acceptor, so the end products are things like nitrite, N₂, or H₂S instead of water. It makes {{less}} ATP than aerobic respiration, but more than fermentation.`},
    {part:P2, title:"Fermentation: recycling NAD⁺", scene:(t, c) => nadScene(t, c.R, c.g, c.done), gate:GATES.free, more:"lactic", live:true,
     text:`Fermentation happens when there's no {{oxygen}} available (anaerobic conditions), and no O₂ is needed. It makes only {{two}} ATP per glucose, all from glycolysis. Its main purpose is to regenerate {{nadplus}}: NADH hands its electrons to pyruvate (or something made from it), so NAD⁺ is free to keep glycolysis running. Without fermentation, glycolysis would stop!`,
     after:`Fermentation = glycolysis + a way to recycle NAD⁺.`},
    {part:P2, title:"Types of fermentation", scene:(t, c) => typesScene(t, c.R, c.g, c.done), gate:GATES.match, more:"swiss", live:true, vh:520,
     links:[["Methyl red (MR) test →", "id-tests.html#mr"], ["Voges-Proskauer (VP) test →", "id-tests.html#vp"]],
     stageHTML:`<a class="btn secondary sm typelink" style="left:62.7%" href="id-tests.html#mr">Methyl red (MR) test →</a><a class="btn secondary sm typelink" style="left:87.2%" href="id-tests.html#vp">VP test →</a>`,
     text:`{{alcohol}} fermentation produces ethanol + CO₂ (yeast like Saccharomyces, used in brewing and baking). Lactic acid fermentation produces {{lactic}}, also called lactate (Streptococcus, Lactobacillus; also your tired muscles and yogurt). Other bacteria make other organic acids and alcohols, like propionic acid or butanol. Two of them are the basis of lab tests: E. coli and Salmonella use mixed-acid fermentation (the methyl red test), while Enterobacter makes butanediol (the Voges-Proskauer test).`},
    {part:P2, title:"Fermented foods and industry", scene:(t, c) => foodScene(t, c.R, c.g, c.done), gate:GATES.food, live:true, vh:520,
     table:{cap:"Some industrial uses for different fermentations", head:["End product","Use","Starting material","Microorganism"], rows:[["Ethanol","Beer, wine, fuel","Starch, sugar, agricultural wastes","<i>Saccharomyces cerevisiae</i> (yeast)"],["Acetic acid","Vinegar","Ethanol","<i>Acetobacter</i>"],["Lactic acid","Cheese, yogurt, rye bread, sauerkraut, summer sausage","Milk, grain, cabbage, meat","<i>Lactobacillus, Streptococcus, Pediococcus</i>"],["Propionic acid + CO₂","Swiss cheese","Lactic acid","<i>Propionibacterium</i>"],["Acetone and butanol","Pharmaceutical, industrial uses","Molasses","<i>Clostridium acetobutylicum</i>"],["Citric acid","Flavoring","Molasses","<i>Aspergillus</i> (fungus)"]]},
     text:`Humans have used fermentation for thousands of years! Lactic acid bacteria sour yogurt, cheese, sauerkraut, pickles, and kimchi. Yeast's ethanol makes beer and wine, and its CO₂ makes bread rise. Industry uses fermentation to make vinegar, solvents, and flavorings too.`},
    {part:P2, title:"The sugar fermentation test", scene:(t, c) => testScene(t, c.R, c.g, c.done), gate:GATES.tubes, more:"test", live:true, vh:490,
     text:`The {{phenol}} sugar fermentation test tells you whether a bacterium can use a certain carbohydrate. Put the sugar, the bacteria, and a pH indicator in a tube. If fermentation happens, {{acid}} is made (H⁺), the pH drops, and the color changes from red to yellow. A bubble trapped in the small inner tube means gas (like CO₂) was produced too. So the color is about acid, like the lactic acid from lactic acid fermentation, and the bubble is about gas, like the CO₂ from alcohol fermentation.`,
     after:`Yellow = acid (like lactic acid). Bubble = gas (like the CO₂ in alcohol fermentation).`},
    {part:P3, title:"Aerobic vs. anaerobic vs. fermentation", scene:(t, c) => compareScene(t, c.R, c.g, c.done), gate:GATES.final, live:true, vh:560,
     table:{cap:"Carbohydrate catabolism: the three options", head:["","Aerobic respiration","Anaerobic respiration","Fermentation"], rows:[["O₂ needed?","Yes","No","No"],["Final electron acceptor","O₂","Inorganic molecule other than O₂ (nitrate, sulfate)","Organic molecule (pyruvate or a derivative)"],["Electron transport chain?","Yes","Yes","No"],["ATP per glucose","32–38","Moderate (less than aerobic)","2"],["End products","CO₂, H₂O","CO₂, NO₂⁻ / N₂, H₂S","Lactic acid, ethanol + CO₂, others"]]},
     text:`Let's compare! Aerobic respiration uses O₂ as the final electron acceptor and makes the most ATP. Anaerobic respiration uses a different inorganic acceptor and makes less. Fermentation skips the electron transport chain entirely: just 2 ATP, with the goal of recycling NAD⁺. Bacteria are experts at switching between these depending on their environment!`,
     after:`Respiration: complete!`}
  ];

  Metab.start({title:"Fermentation and Anaerobic Respiration", page:"fermentation.html", BL, MORE, STEPS,
    nextLabel:"You finished the respiration modules!", next:[["Back to all modules","index.html"],["Try it in the lab: sugar fermentation tests →","id-tests.html#durham"],["Review: the Krebs cycle","krebs.html"],["Review: the electron transport chain","etc.html"]]});
})();
