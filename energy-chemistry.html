<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enzymes and Energy Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .eqlink{position:absolute;left:50%;top:2.2%;transform:translateX(-50%);display:grid;justify-items:center;gap:2px;text-decoration:none;color:var(--ink,#1d2433);background:#fff;border:2px solid #c7cdf5;border-radius:14px;padding:6px 16px;box-shadow:0 2px 0 #dfe3f7;white-space:nowrap}
  .eqlink .eq{font-weight:700;font-size:clamp(.95rem,2.3vw,1.3rem)}
  .eqlink .hint{font-size:clamp(.7rem,1.5vw,.82rem);color:#3f4cc0;font-weight:700}
  .eqlink:hover,.eqlink:focus-visible{border-color:#3f4cc0;background:#f4f5ff}
</style>
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, f3, lerp, clamp, smooth, seg, C} = A;
  const blob = (x, y, label, col, o) => A.op(o === undefined ? 1 : o, `<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="78" ry="54" fill="${col}" stroke="#343b4a" stroke-width="2"/><text x="${f1(x)}" y="${f1(y + 6)}" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">${label}</text>`);

  /* small shared helpers for the new activation-energy / enzyme graphics */
  const eaBracket = (x, yBase, yPeak, col, label) => {
    let s = `<line x1="${f1(x - 16)}" y1="${f1(yBase)}" x2="${f1(x + 16)}" y2="${f1(yBase)}" stroke="${col}" stroke-width="2.5"/>`;
    s += `<line x1="${f1(x)}" y1="${f1(yBase)}" x2="${f1(x)}" y2="${f1(yPeak)}" stroke="${col}" stroke-width="2.5" stroke-dasharray="5 4"/>`;
    s += `<line x1="${f1(x - 16)}" y1="${f1(yPeak)}" x2="${f1(x + 16)}" y2="${f1(yPeak)}" stroke="${col}" stroke-width="2.5"/>`;
    s += A.tx(x + 26, (yBase + yPeak) / 2 + 5, label, "t14", `style="fill:${col};font-weight:700"`);
    return s;
  };
  const hexPoints = (cx, cy, r) => Array.from({length:6}, (_, i) => { const a = Math.PI / 6 + i * Math.PI / 3; return `${f1(cx + r * Math.cos(a))},${f1(cy + r * Math.sin(a))}`; }).join(" ");
  const enzTop = (x, y, sc) => ({x, y:y - 60 * sc});
  const enzAllo = (x, y, sc) => ({x:x + 79 * sc, y:y + 23 * sc});

  const BL = {
    oxidation:{show:"Oxidation", ans:["oxidation","oxidized","oxidize"], fuzzy:true},
    reduction:{show:"Reduction", ans:["reduction","reduced","reduce"], fuzzy:true},
    redox:{show:"redox", ans:["redox","oxidationreduction","reductionoxidation"], fuzzy:true},
    oxidized:{show:"oxidized", ans:["oxidized","oxidised","oxidation"], fuzzy:true},
    reduced:{show:"reduced", ans:["reduced","reduction"], fuzzy:true},
    nad:{show:"NAD⁺", ans:["nad","nadplus","nad+"]},
    fad:{show:"FAD", ans:["fad"]},
    nadp:{show:"NADP⁺", ans:["nadp","nadpplus"]},
    endergonic:{show:"Endergonic", ans:["endergonic","endothermic"], fuzzy:true},
    exergonic:{show:"Exergonic", ans:["exergonic","exothermic"], fuzzy:true},
    activation:{show:"activation energy", ans:["activationenergy","activation"], fuzzy:true},
    enzyme:{show:"Enzymes", ans:["enzyme","enzymes"], fuzzy:true},
    active:{show:"active site", ans:["activesite","active"], fuzzy:true},
    allosteric:{show:"allosteric site", ans:["allostericsite","allosteric"], fuzzy:true},
    competitive:{show:"Competitive", ans:["competitive"], fuzzy:true},
    noncompetitive:{show:"Noncompetitive", ans:["noncompetitive","noncompetitive"], fuzzy:true}
  };
  const MORE = {
    oil:{title:"Why electrons carry energy", html:`<p>Electrons held loosely in bonds with carbon and hydrogen (like in glucose or fats) are "high energy." When they move to an atom that pulls on them strongly, like oxygen, energy is released. Cells capture that energy in small steps instead of all at once, which is exactly what the electron transport chain does.</p><p>In biology, oxidation often looks like losing hydrogen atoms (a hydrogen = a proton + an electron), and reduction looks like gaining them. That's why NAD⁺ becoming NADH counts as reduction.</p>`},
    vit:{title:"Why do cells bother picking up electrons?", html:`<p><b>Energy lives in electrons.</b> The electrons in the C–H and C–C bonds of glucose and fats are held loosely, so they are "high energy." Oxygen pulls on electrons much harder. When electrons move from a place where they're held loosely to a place where they're held tightly, energy is released, a bit like a ball rolling downhill. Breaking down glucose is really a way of letting those electrons roll downhill.</p><p><b>Why carriers?</b> If glucose handed its electrons straight to oxygen, all that energy would come out at once as heat (that's what burning is). Instead, enzymes pull the electrons off a few at a time and load them onto NAD⁺ and FAD. Now NADH and FADH₂ are holding the high-energy electrons, so the energy is stored in them, ready to deliver.</p><p><b>Dropping them off at the electron transport chain.</b> NADH and FADH₂ carry their electrons to the electron transport chain in the cell membrane. The electrons are passed down a chain of proteins, each holding them a little more tightly, until they reach the final electron acceptor (oxygen, in aerobic respiration). At each step a bit of energy is released and used to pump H⁺ across the membrane. That H⁺ build-up then powers ATP synthase to make ATP. The empty NAD⁺ and FAD go back to pick up more electrons. No carriers, no delivery, and the whole process stops.</p><p><b>B vitamins and "energy."</b> NAD⁺ is built from niacin (vitamin B3), and FAD is built from riboflavin (vitamin B2). That's why B vitamins are often sold as "energy" vitamins. They don't contain energy themselves, but without them you can't build the carriers that move energy from your food to ATP. Severe niacin deficiency causes a disease called pellagra, partly because cells can't make enough NAD⁺.</p>`}
  };

  /* ================= Scenes ================= */
  function egScene(t, R){
    /* Frozen-vs-animated is decided per step below: this version always draws the full curve */
    let o = "";
    const panel = (x0, title, col, y1, y2, note) => {
      let s = A.tx(x0 + 210, 50, title, "t20 mid", `style="fill:${col}"`) + `<line x1="${x0 + 30}" y1="80" x2="${x0 + 30}" y2="380" stroke="#343b4a" stroke-width="2.5"/><line x1="${x0 + 30}" y1="380" x2="${x0 + 400}" y2="380" stroke="#343b4a" stroke-width="2.5"/>`;
      const draw = smooth(seg((t % 7), .4, 4));
      const d = `M${x0 + 40},${y1} C${x0 + 150},${y1} ${x0 + 160},130 ${x0 + 210},130 C${x0 + 260},130 ${x0 + 270},${y2} ${x0 + 380},${y2}`;
      s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="4" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${f3(1 - draw)}"/>`;
      s += `<circle cx="${x0 + 40}" cy="${y1}" r="6" fill="${col}"/>` + A.tx(x0 + 44, y1 + 26, "Reactants", "t12", "");
      s += A.op(smooth(seg(draw, .92, 1)), `<circle cx="${x0 + 380}" cy="${y2}" r="6" fill="${col}"/>` + A.tx(x0 + 380, y2 + 26, "Products", "t12 end"));
      s += A.tx(x0 + 215, 404, "Time (the reaction goes on) →", "t12 mid muted");
      s += A.tx(x0 + 210, 432, note, "t14 mid");
      return s;
    };
    o += panel(40, `${R("endergonic")}`, "#3f4cc0", 320, 200, "Absorbs energy: products have MORE");
    o += panel(540, `${R("exergonic")}`, "#d9443a", 200, 320, "Releases energy: products have LESS");
    o += `<line x1="500" y1="40" x2="500" y2="440" stroke="#d9dee7" stroke-width="2" stroke-dasharray="6 6"/>`;
    o += A.tx(240, 458, "Anabolic (building up)", "t14 mid", `style="fill:#1b7f4e"`) + A.tx(740, 458, "Catabolic (breaking down)", "t14 mid", `style="fill:#b83a34"`);
    o += A.tx(58, 230, "Energy", "t12 mid", `transform="rotate(-90 58 230)"`) + A.tx(558, 230, "Energy", "t12 mid", `transform="rotate(-90 558 230)"`);
    return o;
  }
  function eaScene(t, R){
    /* Same two panels as before, but frozen (no drawing-in animation) with the activation energy marked */
    let o = "";
    const panel = (x0, title, col, y1, y2, note) => {
      let s = A.tx(x0 + 210, 50, title, "t20 mid", `style="fill:${col}"`) + `<line x1="${x0 + 30}" y1="80" x2="${x0 + 30}" y2="380" stroke="#343b4a" stroke-width="2.5"/><line x1="${x0 + 30}" y1="380" x2="${x0 + 400}" y2="380" stroke="#343b4a" stroke-width="2.5"/>`;
      const d = `M${x0 + 40},${y1} C${x0 + 150},${y1} ${x0 + 160},130 ${x0 + 210},130 C${x0 + 260},130 ${x0 + 270},${y2} ${x0 + 380},${y2}`;
      s += `<path d="${d}" fill="none" stroke="${col}" stroke-width="4"/>`;
      s += `<circle cx="${x0 + 40}" cy="${y1}" r="6" fill="${col}"/>` + A.tx(x0 + 44, y1 + 26, "Reactants", "t12", "");
      s += `<circle cx="${x0 + 380}" cy="${y2}" r="6" fill="${col}"/>` + A.tx(x0 + 380, y2 + 26, "Products", "t12 end");
      s += eaBracket(x0 + 210, y1, 130, col, "Eₐ");
      s += A.tx(x0 + 215, 404, "Time (the reaction goes on) →", "t12 mid muted");
      s += A.tx(x0 + 210, 432, note, "t14 mid");
      return s;
    };
    o += panel(40, "Endergonic", "#3f4cc0", 320, 200, "Absorbs energy overall: products have MORE");
    o += panel(540, "Exergonic", "#d9443a", 200, 320, "Releases energy overall: products have LESS");
    o += `<line x1="500" y1="40" x2="500" y2="440" stroke="#d9dee7" stroke-width="2" stroke-dasharray="6 6"/>`;
    o += A.tx(58, 230, "Energy", "t12 mid", `transform="rotate(-90 58 230)"`) + A.tx(558, 230, "Energy", "t12 mid", `transform="rotate(-90 558 230)"`);
    return o;
  }
  function enzymeEaScene(t, R){
    const y1 = 320, y2 = 210, peakNo = 110, peakYes = 235;
    let o = A.tx(500, 42, "Enzymes lower the activation energy needed", "t20 mid");
    o += `<line x1="170" y1="70" x2="170" y2="380" stroke="#343b4a" stroke-width="2.5"/><line x1="170" y1="380" x2="860" y2="380" stroke="#343b4a" stroke-width="2.5"/>`;
    o += A.tx(90, 225, "Energy", "t12 mid", `transform="rotate(-90 90 225)"`);
    o += A.tx(515, 404, "Time (the reaction goes on) →", "t12 mid muted");
    const dNo = `M180,${y1} C340,${y1} 360,${peakNo} 515,${peakNo} C660,${peakNo} 690,${y2} 850,${y2}`;
    const dYes = `M180,${y1} C310,${y1} 335,${peakYes} 515,${peakYes} C670,${peakYes} 695,${y2} 850,${y2}`;
    o += `<path d="${dNo}" fill="none" stroke="#b83a34" stroke-width="3.5" stroke-dasharray="8 6"/>`;
    o += `<path d="${dYes}" fill="none" stroke="#1b7f4e" stroke-width="4.5"/>`;
    o += `<circle cx="180" cy="${y1}" r="7" fill="#343b4a"/>` + A.tx(184, y1 + 26, "Reactants", "t12", "");
    o += `<circle cx="850" cy="${y2}" r="7" fill="#343b4a"/>` + A.tx(850, y2 + 26, "Products", "t12 end");
    o += eaBracket(490, y1, peakNo, "#b83a34", "Eₐ without enzyme");
    o += eaBracket(590, y1, peakYes, "#1b7f4e", "Eₐ with enzyme");
    o += A.enzyme(700, 320, {sc:.8, label:"Enzyme"});
    o += A.arrow(660, 295, 545, 245, "#1b7f4e", 2.5);
    o += A.tx(500, 432, "Enzymes speed up reactions by lowering Eₐ.", "t14 mid muted");
    o += A.tx(500, 452, "They don't change the reactants, products, or the overall energy released or absorbed.", "t12 mid muted");
    return o;
  }
  function sitesScene(t, R){
    const EX = 430, EY = 250, ESC = 1.6;
    const act = enzTop(EX, EY, ESC), allo = enzAllo(EX, EY, ESC);
    let o = A.tx(500, 42, "Every enzyme has an active site; many also have an allosteric site", "t18 mid");
    o += A.enzyme(EX, EY, {sc:ESC, allo:true, label:"Enzyme"});
    o += A.tx(act.x, act.y - 90, "Active site", "t16 mid", `style="fill:#3f4cc0"`);
    o += A.tx(act.x, act.y - 70, "substrate binds & reacts here", "t11 mid muted");
    o += A.arrow(act.x, act.y - 55, act.x, act.y - 8, "#3f4cc0", 3);
    o += A.tx(allo.x + 190, allo.y - 10, "Allosteric site", "t16 mid", `style="fill:#9a6212"`);
    o += A.tx(allo.x + 190, allo.y + 10, "a regulator binds here", "t11 mid muted");
    o += A.arrow(allo.x + 175, allo.y, allo.x + 24, allo.y, "#9a6212", 3);
    o += A.tx(500, 414, "A molecule that fits the active site is the substrate.", "t14 mid muted");
    o += A.tx(500, 434, "A molecule that binds the allosteric site changes the enzyme's shape instead.", "t12 mid muted");
    return o;
  }
  const ENZI = {x:500, y:250, sc:1.7};
  const hitSite = p => {
    const act = enzTop(ENZI.x, ENZI.y, ENZI.sc), allo = enzAllo(ENZI.x, ENZI.y, ENZI.sc);
    if (Math.hypot(p.x - act.x, p.y - act.y) < 55) return "active";
    if (Math.hypot(p.x - allo.x, p.y - allo.y) < 46) return "allo";
    return null;
  };
  const INH_START = {x:220, y:400};
  function inhibitionScene(t, R, g, done){
    const st = g || {}, drag = st.drag && st.drag.moved ? st.drag : null;
    const mode = st.mode;
    const act = enzTop(ENZI.x, ENZI.y, ENZI.sc), allo = enzAllo(ENZI.x, ENZI.y, ENZI.sc);
    let o = A.tx(500, 24, "Drag the inhibitor onto the active site or the allosteric site", "t18 mid");
    const open = mode ? 0 : 1;
    o += A.enzyme(ENZI.x, ENZI.y, {sc:ENZI.sc, allo:true, open, label:"Enzyme"});
    if (!mode) o += A.tx(act.x, act.y - 56, "Substrate fits here", "t12 mid muted");
    let ix = INH_START.x, iy = INH_START.y;
    if (mode === "competitive"){ ix = act.x; iy = act.y; }
    else if (mode === "noncompetitive"){ ix = allo.x; iy = allo.y; }
    if (drag){ ix = drag.x; iy = drag.y; }
    o += `<g data-drag="inh" style="cursor:${mode ? "default" : "grab"}"><polygon points="${hexPoints(ix, iy, 24)}" fill="#d9443a" stroke="#7a1f1f" stroke-width="2.5"/>` + A.tx(ix, iy + 5, "I", "t14 mid", `style="fill:#fff"`) + `</g>`;
    o += A.tx(act.x, act.y - 78, "Active site", "t13 mid", `style="fill:#3f4cc0"`);
    o += A.tx(allo.x + 16, allo.y - 26, "Allosteric site", "t13 mid", `style="fill:#9a6212"`);
    if (mode === "competitive") o += `<rect x="260" y="380" width="480" height="66" rx="14" fill="#fbe8e7"/>` + A.tx(500, 405, "Competitive inhibition", "t16 mid", `style="fill:#b83a34"`) + A.tx(500, 430, "The inhibitor blocks the active site directly, competing with the substrate.", "t13 mid", `style="fill:#b83a34"`);
    else if (mode === "noncompetitive") o += `<rect x="230" y="380" width="540" height="66" rx="14" fill="#fff6d6"/>` + A.tx(500, 405, "Noncompetitive inhibition", "t16 mid", `style="fill:#9a6212"`) + A.tx(500, 430, "Binding the allosteric site changes the enzyme's shape, so the active site stops working.", "t13 mid", `style="fill:#9a6212"`);
    else o += A.tx(500, 430, "Try dropping it on each site to see both kinds of inhibition.", "t14 mid muted");
    return o;
  }
  /* Step: electrons flow carbon (glucose) -> NAD+ -> oxygen, on a loop from the moment the step opens */
  function glucoseScene(t, R, done){
    const T = 6.5, tt = t % T;
    const p1 = smooth(seg(tt, .6, 2.2)), p2 = smooth(seg(tt, 3.2, 4.8)), back = smooth(seg(tt, 6, 6.5));
    const full = p1 >= 1 && p2 < .02, water = smooth(seg(tt, 4.6, 5.2)) * (1 - back);
    const X = [170, 500, 830], Y = 250;
    const big = (x, y, k, body) => `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${body}</g>`;
    let o = "";
    o += A.glucoseRing(X[0], Y, {r:16}) + A.tx(X[0], Y + 68, "Carbon", "t16 mid") + A.tx(X[0], Y + 88, "(in glucose)", "t12 mid muted");
    o += big(X[1], Y, 1.7, A.carrier(X[1], Y, "NAD", full, {e:false})) + A.tx(X[1], Y + 68, "NAD⁺ / NADH", "t16 mid") + A.tx(X[1], Y + 88, "electron carrier", "t12 mid muted");
    o += A.op(1 - water, big(X[2], Y, 2.2, A.o2(X[2], Y))) + A.op(water, big(X[2], Y, 1.7, A.h2o(X[2] - 22, Y + 4) + A.h2o(X[2] + 22, Y - 4)));
    o += A.tx(X[2], Y + 68, "Oxygen", "t16 mid") + A.op(water, A.tx(X[2], Y + 88, "becomes water", "t12 mid muted"));
    o += A.arrow(X[0] + 80, Y, X[1] - 90, Y, "#c9cfdb", 2.5) + A.arrow(X[1] + 90, Y, X[2] - 70, Y, "#c9cfdb", 2.5);
    for (let k = 0; k < 2; k++){
      let x, y, show = 1;
      if (p1 < 1){ x = lerp(X[0] - 10 + k * 22, X[1] - 12 + k * 26, p1); y = Y - 60 - Math.sin(p1 * Math.PI) * 45; }
      else if (p2 > 0){ x = lerp(X[1] - 12 + k * 26, X[2] - 12 + k * 26, p2); y = Y - 50 - Math.sin(p2 * Math.PI) * 45 + (p2 * 10 - 10) * 0; }
      else { x = X[1] - 12 + k * 26; y = Y - 50; }
      if (p2 >= 1) show = 1 - smooth(seg(tt, 4.8, 5.4));
      o += A.op(show, A.eDot(x, y, 13));
    }
    const cap = tt < 3 ? "NAD⁺ picks up electrons from carbon and becomes NADH" : "NADH drops the electrons off at oxygen and becomes NAD⁺ again";
    o += A.tx(500, 124, cap, "t16 mid", `style="fill:#8a5a00"`);
    if (done){
      o += `<rect x="60" y="358" width="220" height="62" rx="14" fill="#e7e9fb"/>` + A.tx(170, 382, "Carbon is oxidized", "t16 mid", `style="fill:#2c3796"`) + A.tx(170, 406, "0 → +4 (lost e⁻)", "t14 mid", `style="fill:#2c3796"`);
      o += `<rect x="370" y="358" width="260" height="62" rx="14" fill="#e3f4ea"/>` + A.tx(500, 382, "NAD⁺ → NADH: reduced", "t14 mid", `style="fill:#1b7f4e"`) + A.tx(500, 406, "NADH → NAD⁺: oxidized", "t14 mid", `style="fill:#1b7f4e"`);
      o += `<rect x="720" y="358" width="220" height="62" rx="14" fill="#fbe8e7"/>` + A.tx(830, 382, "Oxygen is reduced", "t16 mid", `style="fill:#b83a34"`) + A.tx(830, 406, "0 → −2 (gained e⁻)", "t14 mid", `style="fill:#b83a34"`);
    } else o += A.tx(500, 392, "Watch the electrons, then sort the cards below: oxidized or reduced?", "t16 mid", `style="fill:#3f4cc0"`);
    o += A.tx(500, 446, "Hydrogen stays +1. Charge going UP = lost electrons = oxidized.", "t14 mid muted");
    return o;
  }
  /* Step 1 is hands-on right in the diagram: drag the electrons, then drag the labels onto the molecules */
  const RX = {don:230, acc:770, y:262, rx:135, ry:88};
  const hitMol = p => { for (const k of ["don", "acc"]){ const x = RX[k]; if (((p.x - x) / (RX.rx + 10)) ** 2 + ((p.y - RX.y) / (RX.ry + 10)) ** 2 <= 1) return k; } return null; };
  const CHIP = {Oxidized:[500, 262], Reduced:[500, 322]};
  function redoxScene(t, R, g, done){
    const st = g || {}, drag = st.drag && st.drag.moved ? st.drag : null;
    const moved = done || st.moved, tags = done ? {don:"Oxidized", acc:"Reduced"} : (st.tags || {});
    const pulse = .5 + .5 * Math.sin(t * 4);
    let o = A.tx(500, 40, `${R("redox") === "?" ? "?" : "Redox"}: one molecule loses electrons, the other gains them`, "t20 mid");
    o += `<defs><radialGradient id="rdA" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#8f99ea"/><stop offset="1" stop-color="#3f4cc0"/></radialGradient><radialGradient id="rdB" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#f09a90"/><stop offset="1" stop-color="#c7362c"/></radialGradient></defs>`;
    const mol = (k, fill, name, role) => {
      const x = RX[k], over = drag && hitMol(drag) === k;
      let m = `<ellipse cx="${x}" cy="${RX.y}" rx="${RX.rx}" ry="${RX.ry}" fill="url(#${fill})" stroke="${over ? C.gold : "#343b4a"}" stroke-width="${over ? 6 : 2}"/>`;
      m += `<ellipse cx="${x - 40}" cy="${RX.y - 48}" rx="46" ry="14" fill="#fff" opacity=".22"/>`;
      m += A.tx(x, RX.y - 10, name, "t20 mid", `style="fill:#fff"`) + A.tx(x, RX.y + 16, role, "t14 mid", `style="fill:#fff"`);
      if (tags[k]){ const ox = tags[k] === "Oxidized"; m += `<rect x="${x - 98}" y="${RX.y + 34}" width="196" height="34" rx="17" fill="#fff" stroke="${ox ? "#2c3796" : "#9b2c24"}" stroke-width="2.5"/>` + A.tx(x, RX.y + 57, ox ? "Oxidized: lost e⁻" : "Reduced: gained e⁻", "t16 mid", `style="fill:${ox ? "#2c3796" : "#9b2c24"}"`); }
      return m;
    };
    o += mol("don", "rdA", "Molecule A", "electron donor") + mol("acc", "rdB", "Molecule B", "electron acceptor");
    /* the electrons */
    let ex = moved ? RX.acc : RX.don, ey = RX.y - RX.ry + 6;
    if (drag && drag.kind === "e"){ ex = drag.x; ey = drag.y; }
    if (!moved) o += `<circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(34 + 6 * pulse)}" fill="none" stroke="${C.gold}" stroke-width="3" opacity="${f3(.35 + .5 * pulse)}"/>`;
    o += `<g data-drag="e" style="cursor:${moved ? "default" : "grab"}"><circle cx="${f1(ex)}" cy="${f1(ey)}" r="40" fill="#fff" opacity="0"/>${A.eDot(ex - 15, ey, 14)}${A.eDot(ex + 15, ey, 14)}</g>`;
    if (!moved){
      o += A.arrow(RX.don + 60, 112, RX.acc - 60, 112, "#a8760f", 3.5, "9 7");
      o += A.tx(500, 96, "Move the electrons!", "t20 mid", `style="fill:#8a5a00" opacity="${f3(.65 + .35 * pulse)}"`);
      o += A.tx(500, 140, "Drag them from the donor to the acceptor", "t14 mid muted");
    } else if (!tags.don || !tags.acc){
      o += A.tx(500, 96, "Now label the molecules!", "t20 mid", `style="fill:#8a5a00"`) + A.tx(500, 124, "Drag each label onto the molecule it describes", "t14 mid muted");
      ["Oxidized", "Reduced"].forEach(w => {
        if (tags.don === w || tags.acc === w) return;
        let [cx, cy] = CHIP[w];
        if (drag && drag.kind === w){ cx = drag.x; cy = drag.y; }
        const sel = st.pick === w;
        o += `<g data-drag="${w}" style="cursor:grab"><rect x="${f1(cx - 66)}" y="${f1(cy - 20)}" width="132" height="40" rx="20" fill="#fff" stroke="${sel ? C.gold : "#5b3fb0"}" stroke-width="${sel ? 5 : 2.5}"/>` + A.tx(cx, cy + 6, w, "t16 mid", `style="fill:#5b3fb0"`) + `</g>`;
      });
    } else {
      o += A.tx(500, 104, "They always happen together!", "t20 mid", `style="fill:#1b7f4e"`);
    }
    o += A.tx(500, 412, "OIL RIG: Oxidation Is Loss, Reduction Is Gain", "t20 mid", `style="fill:#5b3fb0"`);
    o += A.tx(500, 446, "LEO the lion says GER: Lose Electrons = Oxidation, Gain Electrons = Reduction", "t14 mid muted");
    return o;
  }
  /* Step: electron carriers. Interactive right on the diagram: drag the electron package onto the matching carrier */
  const CARR = {
    nad:{y:120, note:["Catabolism (breaking down)", "Made from niacin (B3)"]},
    fad:{y:250, note:["Catabolism (Krebs cycle)", "Made from riboflavin (B2)"]}
  };
  const hitCarrier = p => { for (const k of ["nad", "fad"]){ if (Math.hypot(p.x - 470, p.y - CARR[k].y) < 58) return k; } return null; };
  const CARR_TOK = {e1:[250, 410], e2:[640, 410]};
  function carrierScene(t, R, g, done){
    const st = g || {}, drag = st.drag && st.drag.moved ? st.drag : null;
    const loaded = {nad:done || (st.nad ? true : false), fad:done || (st.fad ? true : false)};
    let o = A.tx(500, 40, "Electron carriers: shuttles for high-energy electrons", "t20 mid");
    ["nad", "fad"].forEach(k => {
      const c = CARR[k], over = drag && hitCarrier(drag) === k, label = k === "nad" ? "NAD" : "FAD";
      o += A.carrier(170, c.y, label, false, {}) + A.arrow(230, c.y, 380, c.y, "#5a6376", 3);
      o += `<circle cx="470" cy="${c.y}" r="58" fill="none" stroke="${over ? C.gold : "transparent"}" stroke-width="4" stroke-dasharray="6 5"/>`;
      if (loaded[k]) o += A.carrier(470, c.y, label, true, {e:false});
      else o += `<rect x="${470 - 46}" y="${c.y - 14}" width="92" height="28" rx="14" fill="#fff" stroke="#c7cdf5" stroke-width="2" stroke-dasharray="5 4"/>` + A.tx(470, c.y + 5, k === "nad" ? "NAD⁺" : "FAD", "t14 mid", `style="fill:#aab0c6"`);
      o += A.tx(610, c.y - 4, c.note[0], "t14", "") + A.tx(610, c.y + 20, c.note[1], "t12", `style="fill:#5a6376"`);
    });
    /* NADP is shown already loaded, just for context (not part of this activity) */
    o += A.carrier(170, 330, "NADP", false, {}) + A.arrow(230, 330, 380, 330, "#5a6376", 3) + A.carrier(470, 330, "NADP", true, {e:false});
    o += A.tx(610, 326, "Anabolism (building up)", "t14", "") + A.tx(610, 350, "Made from B vitamins too", "t12", `style="fill:#5a6376"`);
    ["e1", "e2"].forEach(tk => {
      const key = tk === "e1" ? "nad" : "fad"; if (loaded[key]) return;
      let [cx, cy] = CARR_TOK[tk];
      if (drag && drag.kind === tk){ cx = drag.x; cy = drag.y; }
      const sel = st.pick === tk;
      o += `<g data-drag="${tk}" style="cursor:grab"><rect x="${f1(cx - 64)}" y="${f1(cy - 20)}" width="128" height="40" rx="20" fill="#fff6d6" stroke="${sel ? C.gold : "#c98a0e"}" stroke-width="${sel ? 5 : 2.5}"/>` + A.tx(cx, cy + 6, tk === "e1" ? "2 e⁻ + H⁺" : "2 e⁻ + 2 H⁺", "t14 mid", `style="fill:#8a5a00"`) + `</g>`;
    });
    if (!loaded.nad || !loaded.fad) o += A.tx(500, 452, "Drag each electron package onto the carrier it matches", "t14 mid muted");
    else o += A.tx(500, 452, "FAD grabs TWO electrons (and 2 H) to become FADH₂", "t14 mid muted");
    return o;
  }

  /* ================= Activities ================= */
  const GATES = {
    eg:Metab.sortGate({title:"Your turn: endergonic or exergonic?", done:"Sorted! Breaking down releases energy; building up absorbs it.",
      bins:[["end","Endergonic (absorbs energy)"],["ex","Exergonic (releases energy)"]],
      cards:[["a","Glucose → CO₂ + H₂O","ex","Breaking glucose down releases energy."],["b","Amino acids → protein","end","Building a protein takes energy."],["c","ATP → ADP + P","ex","Breaking off a phosphate releases energy."],["d","ADP + P → ATP","end","Making ATP stores energy, so it absorbs energy."],["e","Photosynthesis","end","Photosynthesis builds glucose using light energy."],["f","Catabolic reactions","ex","Catabolism = breaking down = releasing energy."]]}),
    enzymeFacts:Metab.sortGate({title:"Your turn: true or not true about enzymes?", done:"Enzymes speed reactions up by lowering Eₐ, without being consumed or changing the reaction's overall energy change.",
      bins:[["true","True about enzymes"],["false","NOT true about enzymes"]],
      cards:[["a","Speeds up the reaction","true","That's exactly what a catalyst does."],["b","Lowers the activation energy","true","Enzymes provide an easier path to the transition state."],["c","Gets used up in the reaction","false","Enzymes come out unchanged and can be reused again and again."],["d","Changes whether a reaction releases or absorbs energy overall","false","Enzymes only change the speed, not the overall energy change."]]}),
    sites:Metab.sortGate({title:"Your turn: active site or allosteric site?", done:"The active site is where the substrate binds and the reaction happens. The allosteric site is a separate regulatory spot.",
      bins:[["active","Active site"],["allo","Allosteric site"]],
      cards:[["a","Where the substrate binds and the reaction happens","active","This is the pocket shaped to fit the substrate."],["b","A separate spot where a regulator binds","allo","Allosteric means \"other site\" — away from the active site."],["c","Directly shapes the substrate into the transition state","active","The active site is doing the chemistry."],["d","Binding here can turn the enzyme on or off without touching the substrate","allo","It works by changing the enzyme's overall shape."]]}),
    inhibit:{title:"Your turn: try both kinds of inhibition", done:"You tried both! Competitive inhibitors block the active site; noncompetitive inhibitors bind elsewhere and change the enzyme's shape.",
      init:() => ({mode:null, seen:{competitive:false, noncompetitive:false}, drag:null}),
      html:() => `<div style="font-size:.95rem">Drag the red inhibitor (I) on the diagram onto the active site, then onto the allosteric site.</div>`,
      wire:(g, st, api) => {
        const svg = api.svg; svg.style.touchAction = "none";
        const toSVG = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
        function place(type){
          st.mode = type; st.seen[type] = true; st.pickInh = false; api.redraw();
          if (st.seen.competitive && st.seen.noncompetitive){ api.msg("Nice work. Competitive inhibitors block the active site; noncompetitive inhibitors bind the allosteric site and change the enzyme's shape.", "good"); setTimeout(api.pass, 1300); }
          else api.msg(type === "competitive" ? "Competitive inhibition: it blocks the active site directly. Now try the allosteric site." : "Noncompetitive inhibition: it changes the enzyme's shape from the allosteric site. Now try the active site.", "good");
        }
        svg.onpointerdown = e => {
          const d = e.target.closest && e.target.closest("[data-drag]");
          if (!d){ if (st.pickInh){ const hit = hitSite(toSVG(e)); if (hit === "active") place("competitive"); else if (hit === "allo") place("noncompetitive"); } return; }
          e.preventDefault(); const p = toSVG(e);
          st.drag = {x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
          try { svg.setPointerCapture(e.pointerId); } catch (err) {}
        };
        svg.onpointermove = e => { const d = st.drag; if (!d) return; const p = toSVG(e); d.x = p.x; d.y = p.y; if (Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true; };
        svg.onpointerup = svg.onpointercancel = e => {
          const d = st.drag; if (!d) return; st.drag = null;
          if (!d.moved){ st.pickInh = true; api.msg("Now tap the active site or the allosteric site.", ""); return; }
          const hit = hitSite(toSVG(e));
          if (hit === "active") place("competitive");
          else if (hit === "allo") place("noncompetitive");
          else api.msg("Drop the inhibitor right on the active site or the allosteric site.", "bad");
        };
        if (!g.querySelector("#gateMsg").textContent) api.msg("Drag the red inhibitor onto a site on the enzyme (or tap it, then tap a site).", "");
      }},
    redox:{title:"Your turn: work right on the diagram above", done:"The donor lost electrons (oxidized) and the acceptor gained them (reduced).",
      init:() => ({moved:false, tags:{}, drag:null, pick:null}),
      html:st => `<div style="font-size:.95rem">${!st.moved ? "<b>1.</b> Drag the electrons (e⁻) on the diagram from molecule A to molecule B. You can also just tap them." : "<b>2.</b> Drag the <b>Oxidized</b> and <b>Reduced</b> labels onto the molecules in the diagram. (Or tap a label, then tap a molecule.)"}</div>`,
      wire:(g, st, api) => {
        const svg = api.svg; svg.style.touchAction = "none";
        const toSVG = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
        function move(){ st.moved = true; api.redraw(); api.msg("The electrons moved from A to B! Now label each molecule on the diagram.", "good"); }
        function tag(t, z){ const want = t === "Oxidized" ? "don" : "acc"; if (z !== want){ api.msg(t === "Oxidized" ? "OIL: Oxidation Is Loss. Which molecule LOST electrons?" : "RIG: Reduction Is Gain. Which molecule GAINED electrons?", "bad"); return; } st.tags[z] = t; st.pick = null; api.redraw(); if (st.tags.don && st.tags.acc){ api.msg("OIL RIG! A lost electrons and B gained them. Oxidation and reduction always happen together.", "good"); setTimeout(api.pass, 1000); } else api.msg(`Yes! Molecule ${z === "don" ? "A" : "B"} is ${t.toLowerCase()}. Now the other label.`, "good"); }
        svg.onpointerdown = e => {
          const d = e.target.closest && e.target.closest("[data-drag]");
          if (!d){ if (st.pick && st.moved){ const m = hitMol(toSVG(e)); if (m) tag(st.pick, m); } return; }
          if (d.dataset.drag === "e" && st.moved) return;
          e.preventDefault(); const p = toSVG(e);
          st.drag = {kind:d.dataset.drag, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
          try { svg.setPointerCapture(e.pointerId); } catch (err) {}
        };
        svg.onpointermove = e => { const d = st.drag; if (!d) return; const p = toSVG(e); d.x = p.x; d.y = p.y; if (Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true; };
        svg.onpointerup = svg.onpointercancel = e => {
          const d = st.drag; if (!d) return; st.drag = null;
          const m = hitMol(toSVG(e));
          if (d.kind === "e"){
            if (!d.moved || m === "acc") move();
            else api.msg(m === "don" ? "Those electrons are already on the donor. Drop them on the acceptor, molecule B." : "Drop the electrons right onto molecule B, the acceptor.", "bad");
          } else if (!d.moved){ st.pick = d.kind; api.msg(`Now tap the molecule that was ${d.kind.toLowerCase()}.`, ""); }
          else if (m) tag(d.kind, m);
          else api.msg("Drop the label right onto a molecule.", "bad");
        };
        if (!g.querySelector("#gateMsg").textContent) api.msg("", "");
      }},
    glucose:Metab.sortGate({title:"Your turn: oxidized or reduced?", done:"Carbon is oxidized, oxygen is reduced, and NAD⁺/NADH shuttles the electrons between them.", tip:"Use the charges: going up = lost electrons. Drag each card.",
      bins:[["ox","Oxidized (lost e⁻)"],["red","Reduced (gained e⁻)"]],
      cards:[["c","Carbon: 0 → +4","ox","The charge went UP (more positive). Losing negative electrons does that."],["o","Oxygen: 0 → −2","red","The charge went DOWN (more negative). It gained electrons."],["n","NAD⁺ → NADH","red","NAD⁺ picks up electrons to become NADH. Gaining = reduction."],["d","NADH → NAD⁺","ox","NADH drops off its electrons at the end. Losing = oxidation."]]}),
    carriers:{title:"Your turn: load the electron carriers", done:"Loaded! NAD⁺ → NADH and FAD → FADH₂ now carry high-energy electrons.",
      init:() => ({nad:0, fad:0, drag:null, pick:null}),
      html:() => `<div style="font-size:.95rem">Drag each electron package on the diagram onto the carrier it matches. Look at the H's in NADH vs. FADH₂.</div>`,
      wire:(g, st, api) => {
        const svg = api.svg; svg.style.touchAction = "none";
        const toSVG = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
        function load(tk, z){
          const want = tk === "e1" ? "nad" : "fad";
          if (z !== want){ api.msg(z === "nad" ? "NAD⁺ only picks up ONE H⁺ (that's the other package)." : "FAD needs the package with TWO H⁺ to become FADH₂.", "bad"); return; }
          st[z] = 1; st.pick = null; api.redraw();
          if (st.nad && st.fad){ api.msg("Both carriers were reduced. They'll deliver these electrons to the electron transport chain.", "good"); setTimeout(api.pass, 1100); }
          else api.msg("Loaded! One more.", "good");
        }
        svg.onpointerdown = e => {
          const d = e.target.closest && e.target.closest("[data-drag]");
          if (!d){ if (st.pick){ const z = hitCarrier(toSVG(e)); if (z) load(st.pick, z); } return; }
          e.preventDefault(); const p = toSVG(e);
          st.drag = {kind:d.dataset.drag, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
          try { svg.setPointerCapture(e.pointerId); } catch (err) {}
        };
        svg.onpointermove = e => { const d = st.drag; if (!d) return; const p = toSVG(e); d.x = p.x; d.y = p.y; if (Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true; };
        svg.onpointerup = svg.onpointercancel = e => {
          const d = st.drag; if (!d) return; st.drag = null;
          if (!d.moved){ st.pick = d.kind; api.msg("Now tap the carrier it belongs on.", ""); return; }
          const z = hitCarrier(toSVG(e));
          if (z) load(d.kind, z); else api.msg("Drop the package right onto a carrier.", "bad");
        };
        if (!g.querySelector("#gateMsg").textContent) api.msg("Drag the electron packages onto the matching carriers.", "");
      }}
  };

  const P1 = "Enzymes and reactions", P2 = "Oxidation and reduction";
  const STEPS = [
    {part:P1, title:"Endergonic vs. exergonic", scene:(t, c) => egScene(t, c.R), live:true, gate:GATES.eg,
     text:`{{endergonic}} reactions absorb more energy than they release (endo = within), so the products have more energy than the reactants. {{exergonic}} reactions release more energy than they absorb (exo = out), so the products have less energy. Catabolic reactions are exergonic. Anabolic reactions are endergonic.`},
    {part:P1, title:"Activation energy", scene:(t, c) => eaScene(t, c.R),
     text:`Before reactants can become products, they must pass through a high-energy, unstable arrangement called the transition state. The extra energy needed to reach it is called {{activation}} (Eₐ) — marked on the graphs above as the climb from the reactants up to the peak. Every reaction needs some activation energy to get started, even one that releases energy overall (exergonic reactions still have to get over the hump first).`},
    {part:P1, title:"Enzymes lower activation energy", scene:(t, c) => enzymeEaScene(t, c.R), gate:GATES.enzymeFacts,
     text:`{{enzyme}} are biological catalysts: proteins that speed up reactions without being used up themselves. They work by lowering the activation energy needed, often by holding the substrate in a position that makes the transition state easier to reach. Lowering Eₐ doesn't change whether a reaction is endergonic or exergonic, and it doesn't change the reactants or products. It just makes the reaction happen faster.`},
    {part:P1, title:"Active site vs. allosteric site", scene:(t, c) => sitesScene(t, c.R), gate:GATES.sites,
     text:`Enzymes have an {{active}}, a pocket shaped to fit the substrate, where the reaction actually happens. Many enzymes also have an {{allosteric}}, a separate spot where a regulatory molecule can bind and change the enzyme's shape, turning the enzyme on or off.`},
    {part:P1, title:"Competitive vs. noncompetitive inhibition", scene:(t, c) => inhibitionScene(t, c.R, c.g, c.done), live:true, gate:GATES.inhibit,
     text:`Inhibitors block enzymes in two ways. {{competitive}} inhibitors resemble the substrate and bind the active site directly, competing with it for the same spot. {{noncompetitive}} inhibitors bind the allosteric site instead, changing the enzyme's shape so the active site no longer works, even though the inhibitor never touches it.`,
     after:`Competitive = blocks the active site. Noncompetitive = changes the enzyme's shape from elsewhere.`},
    {part:P2, title:"Oxidation and reduction", scene:(t, c) => redoxScene(t, c.R, c.g, c.done), live:true, gate:GATES.redox, more:"oil",
     text:`Cells get their energy from chemical reactions. In a reaction, two molecules meet and their atoms rearrange: covalent bonds (pairs of shared electrons) break, and new ones form. Often, electrons move from one molecule, the electron donor, to the other, the electron acceptor. {{oxidation}} is the LOSS of electrons, and it releases energy. {{reduction}} is the GAIN of electrons, and it requires energy input. The two always happen together, so these are called {{redox}} reactions. Remember OIL RIG: Oxidation Is Loss, Reduction Is Gain.`,
     after:`OIL RIG! Oxidation Is Loss, Reduction Is Gain.`},
    {part:P2, title:"Redox in cellular respiration", scene:(t, c) => glucoseScene(t, c.R, c.done), live:true, gate:GATES.glucose,
     stageHTML:`<a class="eqlink" href="oxidation-numbers.html"><span class="eq">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O</span><span class="hint">Tap to see how the charges are figured out (bonus)</span></a>`,
     text:`Cellular respiration is one big redox reaction: C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O. The carbon from glucose is {{oxidized}}: it loses electrons (and hydrogen). Oxygen is {{reduced}}: it gains electrons (and hydrogen) and becomes water. The electrons don't jump straight across. NAD⁺ picks them up (becoming NADH) and carries them to oxygen. Follow the charges: carbon goes from 0 to +4 (lost electrons), oxygen goes from 0 to −2 (gained electrons), and hydrogen stays +1.`},
    {part:P2, title:"Electron carriers", scene:(t, c) => carrierScene(t, c.R, c.g, c.done), live:true, gate:GATES.carriers, more:"vit",
     text:`Cells use electron carriers to shuttle high-energy electrons. {{nad}} accepts electrons and becomes NADH. Its main role is in catabolism, and it's made from niacin (a B vitamin). {{fad}} accepts TWO electrons and becomes FADH₂ (another B vitamin). {{nadp}} accepts electrons and becomes NADPH, and its main role is in anabolism.`,
     after:`Picking up electrons = the carrier is reduced.`}
  ];

  Metab.start({title:"Enzymes and Energy Production", page:"energy-chemistry.html", BL, MORE, STEPS,
    nextLabel:"Next up: step 1 of cellular respiration", next:[["Respiration: the big picture →","respiration-overview.html"],["Glycolysis →","glycolysis.html"],["All modules","index.html"]]});
})();
</script>
