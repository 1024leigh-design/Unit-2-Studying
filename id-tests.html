<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biochemical ID Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
<style>
  .labtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .labtab{border:2px solid var(--line);background:#fff;color:var(--muted);font:700 .85rem var(--font);padding:8px 14px;border-radius:12px;cursor:pointer}
  .labtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .labwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  .labhead{margin-bottom:4px}
  .labhead h2{margin:0 0 4px;font-size:1.25rem}
  .labq{color:var(--muted);font-size:.95rem;margin:0 0 16px}
  .labgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  @media (max-width:760px){.labgrid{grid-template-columns:1fr}}
  .labstage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:360px;background:#f7f8fb;border-radius:14px;padding:18px 10px}
  .labpanel h3{font-size:.9rem;font-weight:800;color:var(--ink);margin:0 0 8px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .orgrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .orgchip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:700;cursor:pointer;text-align:left}
  .orgchip i{font-weight:700}
  .orgchip.on{border-color:var(--accent);background:var(--accent-soft)}
  .stepbtns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .labnote{background:#fff8e6;border:1px solid #f0d99a;border-radius:10px;padding:8px 12px;font-size:.85rem;color:#8a5a00;margin:8px 0}
  .labsafety{background:#fbe8e7;border:1px solid #f0bcb8;border-radius:10px;padding:8px 12px;font-size:.83rem;color:#7a2e28;margin:8px 0}
  .result{border-radius:14px;padding:12px 16px;margin-top:10px;font-size:.95rem}
  .result.pos{background:var(--good-soft);border:2px solid #9fd3b5}
  .result.neg{background:var(--bad-soft);border:2px solid #eab3af}
  .result .tag{display:inline-block;font-weight:800;border-radius:999px;padding:2px 12px;font-size:.8rem;margin-bottom:6px}
  .result.pos .tag{background:var(--good);color:#fff}
  .result.neg .tag{background:var(--bad);color:#fff}
  .explain{font-size:.92rem;line-height:1.55;color:var(--ink)}
  .ctrltag{font-size:.72rem;font-weight:700;color:var(--muted);background:#eef1f5;border-radius:999px;padding:1px 8px;margin-left:6px}
  .labfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
  .why{background:#f3effd;border:1px solid #d9cdf5;border-radius:10px;padding:10px 14px;font-size:.9rem;color:#3d2a6b;margin-top:12px}
  .result{background:#f3f5f9;border:2px solid var(--line)}
  .result .tag{background:#5a6376;color:#fff}
  .bench{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px;margin:8px 0 10px}
  .bench svg{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
  .bench [data-item],.bench [data-org],.bench [data-bottle]{cursor:grab}
  .pulse{animation:benchpulse 1.1s ease-in-out infinite}
  @keyframes benchpulse{50%{opacity:.25}}
  .benchsteps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
  .bstep{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:#eef1f5;color:var(--muted)}
  .bstep.cur{background:var(--accent);color:#fff}
  .bstep.ok{background:var(--good-soft);color:var(--good)}
  .benchhint{background:var(--accent-soft);border-radius:12px;padding:9px 14px;font-size:.95rem;color:#2c3796;min-height:1.4em}
  .benchhint .muted{color:var(--muted);font-size:.88rem}
  .benchbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .benchbtns [hidden]{display:none}
  .sugrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
  .sugl{font-size:.85rem;font-weight:700;color:var(--muted);margin-right:4px}
  .sugchip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:700 .85rem var(--font);cursor:pointer;color:var(--ink)}
  .sugchip.on{border-color:#e0a020;background:#fff3d6}
  .quiz{margin-top:22px;border-top:2px dashed var(--line);padding-top:14px}
  .quiz h3{margin:0 0 10px;font-size:1.1rem;color:var(--more)}
  .qcard{background:#faf8ff;border:1px solid #e3dbf6;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .qq{margin:0 0 8px;font-weight:700}
  .qopts{display:flex;flex-direction:column;gap:6px}
  .qopt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font:400 .92rem var(--font);color:var(--ink);cursor:pointer}
  .qopt:hover:not(:disabled){border-color:var(--more)}
  .qopt.right{border-color:var(--good);background:var(--good-soft);font-weight:700}
  .qopt.wrong{border-color:#eab3af;background:var(--bad-soft);opacity:.75;cursor:default}
  .qcard.done .qopt:not(.right){opacity:.55}
  .qfb{margin-top:8px;font-size:.9rem;border-radius:10px;padding:7px 12px}
  .qfb.good{background:var(--good-soft);color:#14593a}
  .qfb.bad{background:var(--bad-soft);color:#7a2e28}
  .qscore{font-weight:700;color:var(--more)}
  .labhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  .quizhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
  .quizhead h3{margin:0}
  .tmodal{position:fixed;inset:0;background:rgba(20,24,36,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
  .tmodal[hidden]{display:none}
  .tcard{background:#fff;border-radius:22px;max-width:920px;width:100%;padding:22px 24px 18px;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:tpop .25s ease-out}
  @keyframes tpop{from{transform:translateY(14px);opacity:0}}
  .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
  .thead h2{margin:2px 0 0;font-size:1.35rem}
  .tkick{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#9a6212}
  .tclose{border:none;background:#eef1f5;border-radius:50%;width:38px;height:38px;font-size:1.4rem;cursor:pointer;color:var(--ink);flex:none}
  .tasks{background:linear-gradient(135deg,#fff4de,#fdeceb);border-radius:16px;padding:12px 16px;margin-bottom:12px}
  .tasks p{margin:4px 0 0;font-size:1.08rem;line-height:1.45}
  .tlabel{display:block;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .tsec{margin:14px 0}
  .tsec h3{font-size:.95rem;margin:0 0 8px;color:var(--accent)}
  .tsec p{margin:0;line-height:1.55;font-size:.95rem}
  .tflowwrap{background:#f7f8fb;border-radius:14px;padding:8px;overflow-x:auto}
  .tflow{display:block;width:100%;min-width:720px;height:auto}
  .teqs{display:flex;flex-direction:column;gap:6px}
  .teq{background:#f3effd;border-left:4px solid var(--more);border-radius:10px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
  .tq{font-weight:700;font-size:1rem;color:#2a1f4a;font-family:"Atkinson Hyperlegible",ui-monospace,monospace}
  .tn{font-size:.82rem;color:var(--muted);font-style:italic}
  .tgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.tgrid{grid-template-columns:1fr}.tcard{padding:16px}}
  .tind{display:block;width:100%;max-width:440px;height:auto}
  .tnoind{background:#f7f8fb;border-radius:12px;padding:10px 12px}
  .tio{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tio>div:not(.tarrow){flex:1;min-width:150px}
  .tarrow{font-size:1.6rem;color:var(--muted);font-weight:700}
  .tchip{display:inline-block;background:#eef1f5;border-radius:999px;padding:4px 11px;margin:3px 4px 0 0;font-size:.86rem;font-weight:700}
  .textra{margin-top:8px!important;background:#fff8e6;border-radius:10px;padding:8px 12px;color:#6b4a00}
  .treads{display:flex;flex-wrap:wrap;gap:12px}
  .tread{display:flex;flex-direction:column;align-items:center;background:#f7f8fb;border-radius:14px;padding:8px 10px;min-width:104px;text-align:center}
  .tread b{font-size:.9rem;margin-top:2px}
  .tread span{font-size:.8rem;color:var(--muted)}
  .tmini{width:84px;height:auto}
  .tlinks{display:flex;flex-wrap:wrap;gap:8px}
  .treadnote{margin-top:10px!important;background:#eef1fb;border-radius:10px;padding:8px 12px;font-size:.9rem;color:#2c3796}
  .tfoot{display:flex;justify-content:flex-end;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script>
(function(){
  /* ================= Test definitions ================= */
  const C_RED = "#d9443a", C_YEL = "#f2d23c", C_PINK = "#e0679e", C_COPPER = "#b98a52", C_BROTH = "#f3e6bd", C_PURPLE = "#4b2a8a";
  const SUGARS = ["glucose", "lactose", "sucrose", "fructose", "mannitol", "maltose"];
  const SUGAR_LABEL = {glucose:"Glucose", lactose:"Lactose", sucrose:"Sucrose", fructose:"Fructose", mannitol:"Mannitol", maltose:"Maltose"};
  const q = (q, opts, a, why) => ({q, opts, a, why});

  const TESTS = [
    {key:"durham", tab:"Durham sugar", title:"Durham Sugar Fermentation Test", medium:"broth", tools:["loop"], durham:true, incubate:true,
     base:{fill:C_RED}, sugars:true,
     question:"Can this bacterium ferment the sugar in the tube, and does it make gas?",
     setup:"Phenol red broth with one sugar (0.5–1%) and a small upside-down Durham tube inside to trap gas. Pick a sugar, then inoculate.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", sug:{glucose:"AG", lactose:"AG", sucrose:"-", fructose:"AG", mannitol:"AG", maltose:"AG"}, note:{sucrose:"Most lab strains of <i>E. coli</i> can't ferment sucrose (a few strains can)."}},
       {name:"Klebsiella pneumoniae", short:"K. pneumoniae", cap:"#8e5bd0", sug:{glucose:"AG", lactose:"AG", sucrose:"AG", fructose:"AG", mannitol:"AG", maltose:"AG"}},
       {name:"Shigella flexneri", short:"S. flexneri", cap:"#2f9e63", sug:{glucose:"A", lactose:"-", sucrose:"-", fructose:"A", mannitol:"A", maltose:"-"}},
       {name:"Staphylococcus aureus", short:"S. aureus", cap:"#e0a020", sug:{glucose:"A", lactose:"A", sucrose:"A", fructose:"A", mannitol:"A", maltose:"A"}},
       {name:"Alcaligenes faecalis", short:"A. faecalis", cap:"#5a6376", sug:{glucose:"-", lactose:"-", sucrose:"-", fructose:"-", mannitol:"-", maltose:"-"}, alk:true}
     ],
     outcome:(o, c) => {
       const r = o.sug[c.sugar], sugar = SUGAR_LABEL[c.sugar].toLowerCase(), extra = o.note && o.note[c.sugar] ? " " + o.note[c.sugar] : "";
       if (r === "AG") return {vis:{fill:C_YEL, gas:true, turbid:true}, cls:"pos", tag:"Acid + gas", text:`<b>Yellow broth and a bubble</b> in the Durham tube. <i>${o.short}</i> fermented ${sugar}: the acid it made dropped the pH so phenol red turned yellow, and the gas (CO₂ and H₂) it released rose into the little tube.`};
       if (r === "A") return {vis:{fill:C_YEL, gas:false, turbid:true}, cls:"pos", tag:"Acid, no gas", text:`<b>Yellow, but no bubble.</b> <i>${o.short}</i> fermented ${sugar} and made acid, but its fermentation pathway doesn't release gas. Color = acid; bubble = gas. They're two separate readouts.`};
       return {vis:{fill:o.alk ? "#e0457a" : C_RED, gas:false, turbid:true}, cls:"neg", tag:"No fermentation", text:`<b>Still red (or even pinker), no bubble.</b> <i>${o.short}</i> grew (the broth is cloudy) but didn't ferment ${sugar}, so no acid and no gas.${o.alk ? " The deeper pink means it broke down peptones instead, releasing ammonia, which raises the pH." : ""}${extra}`};
     },
     reagents:[],
     why:"Acid from fermentation turns phenol red yellow; gas from fermentation collects as a bubble in the Durham tube. Running the same organism in different sugars builds a fingerprint used to identify it.",
     link:["Review fermentation →", "fermentation.html"],
     quiz:[q("What does the Durham sugar test tell you?", ["Whether the organism ferments that sugar (acid) and makes gas", "Whether the organism has catalase", "Whether it can use citrate as its only carbon source", "Whether it is gram-negative"], 0, "It reads two things at once: acid from fermenting the sugar, and gas from the fermentation pathway."),
       q("What is the pH indicator?", ["Phenol red", "Methyl red", "Bromothymol blue", "Crystal violet"], 0, "Phenol red: red/pink at neutral or alkaline pH, yellow when acid builds up."),
       q("The broth turns yellow but the Durham tube has NO bubble. That means…", ["Acid was made, but no gas", "Gas was made, but no acid", "No fermentation at all", "The tube is contaminated"], 0, "Color = acid, bubble = gas. Yellow without a bubble means the sugar was fermented by a pathway that doesn't release gas."),
       q("What does the bubble in the Durham tube actually show?", ["Gas (CO₂ and H₂) released by fermentation", "Oxygen being used up", "The pH dropped", "The bacteria are motile"], 0, "Fermentation pathways like mixed-acid fermentation release CO₂ and H₂, which rises into the upside-down tube."),
       q("After incubation, what do you add before reading it?", ["Nothing: read it directly", "4 drops of methyl red", "Kovac's reagent", "Zinc dust"], 0, "The indicator is already in the broth and the Durham tube is already inside, so you just read the color and look for a bubble.")]},

    {key:"mr", tab:"Methyl Red", title:"Methyl Red (MR) Test", medium:"broth", tools:["loop"], incubate:true, base:{fill:C_BROTH},
     question:"Does this bacterium make lots of stable acid (mixed-acid fermentation)?",
     setup:"MR-VP broth (glucose broth). Incubate 48 hours, then add methyl red.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:true},
       {name:"Klebsiella pneumoniae", short:"K. pneumoniae", cap:"#8e5bd0", pos:false},
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", pos:false},
       {name:"Shigella flexneri", short:"S. flexneri", cap:"#2f9e63", pos:true},
       {name:"Proteus mirabilis", short:"P. mirabilis", cap:"#9a6212", pos:true}
     ],
     reagents:[{name:"Methyl red", drops:4, liquid:"#d9443a", bottle:"#7a2b1f"}],
     outcome:o => o.pos
       ? {vis:{fill:C_RED, turbid:true}, cls:"pos", tag:"MR positive", text:`<b>Red</b> right away. <i>${o.short}</i> uses mixed-acid fermentation, which piles up enough stable acid (lactic, acetic, succinic, formic) to push the pH below 4.4, where methyl red is red.`}
       : {vis:{fill:C_YEL, turbid:true}, cls:"neg", tag:"MR negative", text:`<b>Yellow.</b> <i>${o.short}</i> still fermented glucose, but through the butanediol pathway, which makes much less acid, so the pH stays above about 6. Check its VP test: it's probably positive.`},
     why:"MR and VP use the same broth and usually give opposite results: the mixed-acid pathway (MR+) and the butanediol pathway (VP+) both start at pyruvate.",
     quiz:[q("What does the MR test detect?", ["Lots of stable acid from mixed-acid fermentation", "Acetoin from the butanediol pathway", "Gas from fermentation", "Cytochrome c oxidase"], 0, "A positive means so much stable acid that the pH drops below 4.4."),
       q("What is the pH indicator?", ["Methyl red", "Phenol red", "Bromothymol blue", "Neutral red"], 0, "Methyl red is the indicator: red below pH 4.4, yellow above about 6.2."),
       q("After incubation, how do you finish the test?", ["Add about 4 drops of methyl red and read right away", "Add 18 drops of α-naphthol then KOH and wait", "Flood with iodine", "Add zinc dust"], 0, "Just a few drops of methyl red; the color shows up immediately."),
       q("A tube is yellow after adding methyl red. That organism most likely…", ["Fermented glucose with the butanediol pathway (less acid)", "Didn't grow", "Made lots of stable acid", "Is oxidase positive"], 0, "Yellow means the pH stayed above ~6: less acid, typical of the butanediol (VP+) pathway.")]},

    {key:"vp", tab:"Voges-Proskauer", title:"Voges-Proskauer (VP) Test", medium:"broth", tools:["loop"], incubate:true, base:{fill:C_BROTH},
     question:"Does this bacterium use the butanediol pathway (making acetoin)?",
     setup:"The same MR-VP broth, tested for acetoin instead of acid.",
     orgs:[
       {name:"Enterobacter aerogenes", short:"E. aerogenes", cap:"#c4532f", pos:true},
       {name:"Klebsiella pneumoniae", short:"K. pneumoniae", cap:"#8e5bd0", pos:true},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false},
       {name:"Shigella flexneri", short:"S. flexneri", cap:"#2f9e63", pos:false}
     ],
     reagents:[{name:"VP A: α-naphthol", drops:18, liquid:"#f1ead0", bottle:"#6b5a2f"}, {name:"VP B: KOH", drops:18, liquid:"#eef1f5", bottle:"#3b4250", wait:"Shake · wait 15–30 min"}],
     outcome:o => o.pos
       ? {vis:{fill:"#d0455d", turbid:true}, cls:"pos", tag:"VP positive", text:`<b>Pink-red</b> after shaking and waiting. <i>${o.short}</i> made acetoin through the butanediol pathway; the reagents react with acetoin (with oxygen from shaking) to form the red color.`}
       : {vis:{fill:C_COPPER, turbid:true}, cls:"neg", tag:"VP negative", text:`<b>Copper-brown</b> (no pink). <i>${o.short}</i> made no acetoin, so it isn't using the butanediol pathway. Its MR test is probably positive.`},
     why:"VP has no pH indicator: the color comes from a chemical reaction with acetoin. Waiting long enough matters, or you can get a false negative.",
     quiz:[q("What does the VP test detect?", ["Acetoin, made by the butanediol pathway", "Mixed acids", "Indole", "Hydrogen sulfide"], 0, "Acetoin is the clue that an organism uses the 2,3-butanediol pathway."),
       q("Is there a pH indicator in the VP test?", ["No: the color comes from acetoin reacting with the reagents", "Yes, phenol red", "Yes, methyl red", "Yes, bromothymol blue"], 0, "The pink-red is a chemical reaction product, not a pH change."),
       q("After incubation, how do you finish the test?", ["Add 18 drops of VP A (α-naphthol), then 18 drops of VP B (KOH), shake, and wait", "Add 4 drops of methyl red", "Add Kovac's reagent", "Read it directly"], 0, "Two reagents, A then B, then shake and give it time to develop."),
       q("Which other test is run in the same MR-VP broth?", ["Methyl red (MR)", "Indole", "Citrate", "Nitrate reduction"], 0, "MR and VP share one broth: split the culture into two tubes, add methyl red to one and the VP reagents to the other.")]},

    {key:"oxidase", tab:"Oxidase", title:"Oxidase Test", medium:"strip", tools:["loop"], incubate:false, base:{fill:"#fbfaf4"},
     question:"Does this bacterium have cytochrome c oxidase?",
     setup:"An oxidase test strip. Smear a little of the culture onto it, then add the oxidase reagent. No incubation: read it in 20–30 seconds.",
     orgs:[
       {name:"Pseudomonas aeruginosa", short:"P. aeruginosa", cap:"#2f9e63", pos:true},
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", pos:false},
       {name:"Klebsiella pneumoniae", short:"K. pneumoniae", cap:"#8e5bd0", pos:false}
     ],
     reagents:[{name:"Oxidase reagent", drops:1, liquid:"#f4f0e0", bottle:"#4a5263"}],
     outcome:o => o.pos
       ? {vis:{spot:C_PURPLE}, cls:"pos", tag:"Oxidase positive", text:`The smear turns <b>dark purple</b> within seconds. <i>${o.short}</i> has cytochrome c oxidase (Complex IV of the ETC), which oxidizes the reagent into a purple compound.`}
       : {vis:{spot:"#efe7cf"}, cls:"neg", tag:"Oxidase negative", text:`<b>No color change</b> in 30 seconds. <i>${o.short}</i> doesn't use cytochrome c oxidase to hand electrons to oxygen.`},
     why:"This is the exact enzyme from the electron transport chain: cytochrome c oxidase, Complex IV, the one that hands electrons to O₂.",
     link:["Review Complex IV in the ETC →", "etc.html"],
     quiz:[q("What does the oxidase test detect?", ["Cytochrome c oxidase (ETC Complex IV)", "Catalase", "Fermentation of glucose", "Nitrate reductase"], 0, "The reagent is oxidized by cytochrome c oxidase."),
       q("Is the purple color from a pH indicator?", ["No: the reagent itself turns purple when it's oxidized", "Yes, phenol red", "Yes, methyl red", "Yes, neutral red"], 0, "It's a redox reaction, not a pH change."),
       q("How long do you incubate before adding the reagent?", ["No incubation: smear, add reagent, read in 20–30 seconds", "24–48 hours", "1 week", "Overnight at 4°C"], 0, "It's a rapid test; colors that show up much later don't count."),
       q("Why is the oxidase test useful for <i>E. coli</i> vs. <i>Pseudomonas</i>?", ["<i>Pseudomonas</i> is oxidase positive; <i>E. coli</i> is negative", "Both are positive", "Both are negative", "It tells you which one ferments lactose"], 0, "Enterics like <i>E. coli</i> are oxidase negative, which quickly separates them from <i>Pseudomonas</i>.")]},

    {key:"nitrate", tab:"Nitrate Reduction", title:"Nitrate Reduction Test", medium:"broth", tools:["loop"], incubate:true, base:{fill:"#f3ecd2"},
     question:"Can this bacterium use nitrate as its final electron acceptor?",
     setup:"Nitrate broth. After incubation, add Nitrate A and Nitrate B. If nothing happens, add zinc dust.",
     orgs:[
       {name:"Escherichia coli", short:"E. coli", cap:"#3f7bd1", res:"nitrite"},
       {name:"Pseudomonas aeruginosa", short:"P. aeruginosa", cap:"#2f9e63", res:"gas"},
       {name:"Micrococcus luteus", short:"M. luteus", cap:"#e0a020", res:"none"}
     ],
     reagents:[{name:"Nitrate A", drops:3, liquid:"#f4f0e0", bottle:"#5a6376"}, {name:"Nitrate B", drops:3, liquid:"#f4f0e0", bottle:"#3b4250"}],
     zinc:true,
     outcome:(o, c) => {
       if (o.res === "nitrite") return {vis:{fill:C_RED, turbid:true}, cls:"pos", tag:"Positive (nitrite)", text:`<b>Red</b> right after A + B. <i>${o.short}</i> reduced nitrate (NO₃⁻) to nitrite (NO₂⁻), and the reagents turn nitrite red. It can run anaerobic respiration with nitrate as the final electron acceptor. No zinc needed.`};
       if (!c.zinc) return {vis:{fill:"#f3ecd2", turbid:true}, cls:"", tag:"No color yet…", text:`No color after A + B. That's ambiguous: either the nitrate was never touched, or it was reduced all the way past nitrite. Add zinc dust to find out.`, needZinc:true};
       if (o.res === "gas") return {vis:{fill:"#f3ecd2", turbid:true}, cls:"pos", tag:"Positive (reduced past nitrite)", text:`Zinc changes <b>nothing</b>. Zinc would have turned any leftover nitrate red, so there's none left: <i>${o.short}</i> reduced it all the way to N₂ gas (denitrification). That's a positive.`};
       return {vis:{fill:C_RED, turbid:true}, cls:"neg", tag:"Confirmed negative", text:`Zinc turns it <b>red</b>. Zinc reduced the leftover nitrate to nitrite, so the nitrate was still there: <i>${o.short}</i> never used it. Negative.`};
     },
     safety:"Nitrate reagent B is a carcinogen in real labs: gloves, always. Here you can see the chemistry without the hazard.",
     why:"No color after A + B is the tricky case. Zinc settles it: red after zinc = negative (nitrate still there); still no color = positive (reduced past nitrite).",
     link:["Review anaerobic respiration →", "fermentation.html"],
     quiz:[q("What does the nitrate test ask?", ["Can the organism use nitrate as a final electron acceptor (nitrate reductase)?", "Can it ferment lactose?", "Does it make indole?", "Does it have catalase?"], 0, "Nitrate stands in for O₂ in anaerobic respiration."),
       q("What do Nitrate A and B detect?", ["Nitrite (NO₂⁻): it turns red", "Nitrate (NO₃⁻)", "Acid", "Ammonia"], 0, "A + B react with nitrite to make the red color."),
       q("After incubation, how do you finish the test?", ["Add 3 drops each of Nitrate A and B; if no color, add zinc dust", "Add 4 drops of methyl red", "Flood with iodine", "Read it directly"], 0, "A + B first; zinc only when there's no color."),
       q("No color after A + B, and it turns red after zinc. The result is…", ["Negative: the nitrate was never reduced", "Positive: reduced to nitrite", "Positive: reduced to N₂ gas", "The test failed"], 0, "Zinc reduced the leftover nitrate itself, so the bacteria never touched it.")]},

  const MNAME = {durham:s => `Phenol red ${s} broth`, mr:() => "MR-VP broth", vp:() => "MR-VP broth", oxidase:() => "Oxidase test strip", nitrate:() => "Nitrate broth",
    macconkey:() => "MacConkey agar", emb:() => "EMB agar", msa:() => "Mannitol salt agar", citrate:() => "Simmons citrate slant", catalase:() => "Nutrient agar slant",
    starch:() => "Starch agar plate", indole:() => "Tryptone broth", h2s:() => "Kligler's iron agar deep"};
  const HOURS = {h2s:"18–24 hours", mr:"48 hours", vp:"48 hours"};
  const CULTURE = "#efe3c0";
  const f1 = n => Math.round(n * 10) / 10;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  const seg = (k, a, b) => clamp((k - a) / (b - a), 0, 1);
  const rnd = k => { const v = Math.sin(k * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  const txt = (x, y, s, o) => { o = o || {}; return `<text x="${f1(x)}" y="${f1(y)}" font-size="${o.fs || 13}" font-weight="${o.w || 700}" fill="${o.col || "#343b4a"}" text-anchor="${o.a || "middle"}"${o.it ? ` font-style="italic"` : ""}${o.cls ? ` class="${o.cls}"` : ""}>${s}</text>`; };

  let active = TESTS[0].key, S = null, anim = null, drag = null, msgOverride = "", sugar = "glucose";
  const $ = id => document.getElementById(id);
  const T = () => TESTS.find(x => x.key === active);

  /* ---------------- layout (wide bench, or a taller one for phones) ---------------- */
  let L = null;
  function layout(){
    const narrow = ($("bench") ? $("bench").clientWidth : innerWidth) < 640, t = T(), n = t.orgs.length;
    if (!narrow){
      L = {narrow, W:900, H:510, fs:1, stagger:false,
        rack:i => ({x:54 + i * 96, y:44}), rackLabelDy:150,
        loop:{x:110, y:418}, needle:{x:110, y:452}, trayY:396,
        med:{x:560, top:118, h:280}, plate:{x:560, y:268, r:132},
        bottle:j => ({x:828, y:110 + j * 150}), zinc:{x:828, y:420}, dropper:{x:715, y:452}};
    } else {
      const dx = Math.min(112, 520 / Math.max(n - 1, 1));
      L = {narrow, W:600, H:820, fs:1.3, stagger:n > 3,
        rack:i => ({x:300 - (n - 1) * dx / 2 + i * dx, y:36}), rackLabelDy:152,
        loop:{x:110, y:690}, needle:{x:110, y:735}, trayY:660,
        med:{x:300, top:260, h:300}, plate:{x:300, y:420, r:150},
        bottle:j => ({x:395 + j * 105, y:700}), zinc:{x:555, y:700}, dropper:{x:430, y:785}};
    }
  }

  /* ---------------- run state ---------------- */
  function reset(){ S = {loaded:null, inoc:false, inocTool:null, streak:1, incubated:false, rIdx:0, filled:null, zinc:false, done:false, overlay:null}; anim = null; drag = null; msgOverride = ""; }
  const needsIncubate = () => T().incubate;
  const reagentPhase = () => S.inoc && (S.incubated || !needsIncubate()) && S.rIdx < T().reagents.length;
  const ctx = () => ({sugar, zinc:S.zinc});
  const outcome = () => S.loaded ? T().outcome(T().orgs[S.loaded.org], ctx()) : null;
  const needZinc = () => S.done && T().zinc && !S.zinc && outcome() && outcome().needZinc;
  const orgName = () => S.loaded ? T().orgs[S.loaded.org].short : "";

  /* ---------------- drawing: glassware ---------------- */
  function tubePath(cx, top, w, h, inset){
    const l = cx - w / 2 + inset, r = cx + w / 2 - inset, rr = (r - l) / 2, b = top + h - inset;
    return `M${f1(l)},${f1(top)} L${f1(l)},${f1(b - rr)} A${f1(rr)},${f1(rr)} 0 0 0 ${f1(r)},${f1(b - rr)} L${f1(r)},${f1(top)} Z`;
  }
  function glass(cx, top, w, h){
    return `<path d="${tubePath(cx, top, w, h, 0).replace(/ Z$/, "")}" fill="none" stroke="#8b93a3" stroke-width="3.5" stroke-linejoin="round"/>` +
      `<line x1="${f1(cx - w / 2 + 9)}" y1="${f1(top + 14)}" x2="${f1(cx - w / 2 + 9)}" y2="${f1(top + h - w / 2 - 4)}" stroke="#fff" stroke-width="3" opacity=".7" stroke-linecap="round"/>` +
      `<rect x="${f1(cx - w / 2 - 4)}" y="${f1(top - 4)}" width="${w + 8}" height="7" rx="3" fill="#d6dbe4"/>`;
  }

  /* organism source tube in the rack */

  /* the test medium */

  function drawMedium(vis, opts){

  /* ---------------- drawing: tools, bottles, dropper ---------------- */

  /* ---------------- the full bench ---------------- */

      ind:"phenol",
      used:["sulfur amino acids / thiosulfate", "iron salts"], made:["H₂S → black iron sulfide"],
      why:"H₂S is a colorless gas, so the agar is packed with <b>iron salts</b>. H₂S reacts with the iron to form <b>black iron sulfide</b>, which spreads out from the stab line. Phenol red also turns the deep <b>yellow</b> if sugar was fermented, but the <b>black</b> is what you're reading.",
      reads:[{k:"deep", fill:"#f2d23c", black:true, tag:"H₂S +", lab:"black"}, {k:"deep", fill:"#f2d23c", tag:"H₂S −", lab:"yellow only"}],
      lecture:["ferment", "krebs"],
      extra:"Reducing thiosulfate for energy is another kind of anaerobic respiration — sulfur standing in for oxygen."}
  };

  /* ---------- theory graphics ---------- */
  const ahead = (x, y, ang) => { const h = 8; return `<path d="M${f1(x)},${f1(y)} L${f1(x - h * Math.cos(ang - .42))},${f1(y - h * Math.sin(ang - .42))} L${f1(x - h * Math.cos(ang + .42))},${f1(y - h * Math.sin(ang + .42))} Z" fill="#8a93a3"/>`; };
  const tNodeW = n => Math.max(n.t.length, (n.sub || "").length * .82) * 7.6 + 28;
  const tArrW = l => Math.max(70, (l || "").length * 6.3 + 24);
  function tPill(cx, cy, w, n){
    let o = `<rect x="${f1(cx - w / 2)}" y="${f1(cy - 19)}" width="${f1(w)}" height="38" rx="19" fill="${n.c}" opacity=".14"/><rect x="${f1(cx - w / 2)}" y="${f1(cy - 19)}" width="${f1(w)}" height="38" rx="19" fill="none" stroke="${n.c}" stroke-width="2"/>`;
    o += `<text x="${f1(cx)}" y="${f1(cy + 5)}" font-size="13.5" font-weight="700" fill="${shade(n.c, -.25)}" text-anchor="middle">${n.t}</text>`;
    if (n.sub) o += `<text x="${f1(cx)}" y="${f1(cy + 34)}" font-size="11" fill="#5a6376" text-anchor="middle">${n.sub}</text>`;
    return o;
  }
  function flowSVG(rows){
    const forkW = f => 70 + Math.max(...f.fork.map(b => tNodeW(b.n)));
    const itemW = it => typeof it === "string" ? tArrW(it) : it.fork ? forkW(it) : tNodeW(it);
    const rowH = r => r.items.some(it => it.fork) ? 150 : 92;
    const widths = rows.map(r => r.items.reduce((w, it) => w + itemW(it), 0));
    const W = Math.max(840, ...widths) + 20;
    let ys = [], acc = 0; rows.forEach(r => { ys.push(acc); acc += rowH(r); });
    const H = acc + 8;
    let s = `<svg viewBox="0 0 ${f1(W)} ${H}" class="tflow" role="img" aria-label="Pathway diagram">`;
    rows.forEach((r, ri) => {
      const y = ys[ri] + rowH(r) / 2 + 8; let x = 10;
      if (r.label) s += `<text x="10" y="${f1(ys[ri] + 18)}" font-size="12" font-weight="700" fill="#5a6376">${r.label}</text>`;
      r.items.forEach(it => {
        if (typeof it === "string"){
          const w = tArrW(it);
          s += `<line x1="${f1(x + 6)}" y1="${y}" x2="${f1(x + w - 12)}" y2="${y}" stroke="#8a93a3" stroke-width="2.5"/>${ahead(x + w - 6, y, 0)}`;
          if (it) s += `<text x="${f1(x + w / 2)}" y="${f1(y - 8)}" font-size="11" font-weight="700" fill="${ENZC}" text-anchor="middle" font-style="italic">${it}</text>`;
          x += w;
        } else if (it.fork){
          const aLen = 66, dy = 38, nw = Math.max(...it.fork.map(b => tNodeW(b.n)));
          it.fork.forEach((b, bi) => {
            const ny = y + (bi ? dy : -dy), nx = x + aLen + nw / 2, ex = x + aLen, ang = Math.atan2(ny - y, aLen);
            s += `<line x1="${f1(x + 4)}" y1="${f1(y)}" x2="${f1(ex - 4)}" y2="${f1(ny)}" stroke="#8a93a3" stroke-width="2.5"/>${ahead(ex, ny, ang)}`;
            if (b.a) s += `<text x="${f1(x + aLen / 2)}" y="${f1((y + ny) / 2 + (bi ? 13 : -6))}" font-size="10.5" font-weight="700" fill="${ENZC}" text-anchor="middle" font-style="italic">${b.a}</text>`;
            s += tPill(nx, ny, nw, b.n);
          });
          x += aLen + nw;
        } else { const w = tNodeW(it); s += tPill(x + w / 2, y, w, it); x += w; }
      });
    });
    return s + `</svg>`;
  }
  function indSVG(key){
    const I = IND[key], [lo, hi] = I.range, W = 420, x0 = 20, x1 = W - 20, X = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
    let s = `<svg viewBox="0 0 ${W} 112" class="tind" role="img" aria-label="${I.name} color scale"><defs><linearGradient id="ig_${key}">`;
    s += I.stops.map(([v, c]) => `<stop offset="${f1((v - lo) / (hi - lo) * 100)}%" stop-color="${c}"/>`).join("") + `</linearGradient></defs>`;
    s += `<rect x="${x0}" y="22" width="${x1 - x0}" height="30" rx="15" fill="url(#ig_${key})" stroke="#d9dee7"/>`;
    I.zones.forEach(([a, b, lab]) => { if (lab) s += `<text x="${f1((X(a) + X(b)) / 2)}" y="14" font-size="11" font-weight="700" fill="#343b4a" text-anchor="middle">${lab}</text>`; });
    I.marks.forEach(([v, lab]) => { s += `<line x1="${f1(X(v))}" y1="18" x2="${f1(X(v))}" y2="58" stroke="#343b4a" stroke-width="1.5" stroke-dasharray="3 3"/><text x="${f1(X(v))}" y="72" font-size="11" font-weight="700" fill="#343b4a" text-anchor="middle">${lab}</text>`; });
    if (I.axis === "pH"){ for (let v = Math.ceil(lo); v <= hi; v++) s += `<text x="${f1(X(v))}" y="90" font-size="10" fill="#8b93a3" text-anchor="middle">${v}</text>`;
      if (lo <= 7 && hi >= 7) s += `<path d="M${f1(X(7))},56 l-5,8 h10 Z" fill="#5a6376"/>`; }
    s += `<text x="${W / 2}" y="106" font-size="11" fill="#5a6376" text-anchor="middle">${I.axis === "pH" ? "pH (7 = neutral)" : I.axis}</text>`;
    return s + `</svg>`;
  }
  function miniSVG(o){
    let s = `<svg viewBox="0 0 90 104" class="tmini">`;
    if (o.k === "plate"){
      s += `<circle cx="45" cy="50" r="42" fill="#f2f5f9" stroke="#b9c2cf" stroke-width="2"/><circle cx="45" cy="50" r="37" fill="${o.iodine ? "#2b2340" : o.agar}"/>`;
      const pts = [[22, 34], [34, 30], [46, 33], [58, 30], [68, 36], [60, 48], [48, 50], [36, 48], [24, 52], [30, 64], [44, 66], [58, 64]];
      if (o.clear) s += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${o.agar}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`;
      if (o.halo) s += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="${o.halo}" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".6" filter="url(#tsoft)"/>`;
      if (o.col) pts.forEach(([x, y]) => { s += `<circle cx="${x}" cy="${y}" r="4.2" fill="${o.col}" stroke="${shade(o.col, -.25)}" stroke-width="1"/>` + (o.sheen ? `<path d="M${x - 3},${y} a3,3 0 0 1 4,-3" fill="none" stroke="#63e08f" stroke-width="1.6"/>` : ""); });
    } else if (o.k === "strip"){
      s += `<rect x="6" y="22" width="78" height="56" rx="6" fill="#fbfaf2" stroke="#d9cfa6" stroke-width="2"/><circle cx="45" cy="50" r="18" fill="${o.spot}"/>`;
    } else {
      const cx = 45, top = 6, w = 32, h = 92, l = cx - w / 2, r = cx + w / 2, b = top + h, inner = `M${l + 2},${top} L${l + 2},${b - 16} A14,14 0 0 0 ${r - 2},${b - 16} L${r - 2},${top} Z`;
      const cid = "tc" + Math.random().toString(36).slice(2, 7);
      s += `<clipPath id="${cid}"><path d="${inner}"/></clipPath><g clip-path="url(#${cid})">`;
      if (o.k === "slant") s += `<path d="M${l},${top + 34} L${r},${top + 62} L${r},${b} L${l},${b} Z" fill="${o.fill}"/>`;
      else s += `<rect x="${l}" y="${top + (o.k === "deep" ? 26 : 24)}" width="${w}" height="${h}" fill="${o.fill}"/>`;
      if (o.ring) s += `<rect x="${l}" y="${top + 18}" width="${w}" height="9" fill="${o.ring}"/>`;
      if (o.durham){ s += `<path d="M${cx - 6},${b - 6} L${cx - 6},${b - 50} A6,6 0 0 1 ${cx + 6},${b - 50} L${cx + 6},${b - 6}" fill="${o.fill}" stroke="#6d7686" stroke-width="1.6"/>`; if (o.gas) s += `<rect x="${cx - 4.5}" y="${b - 55}" width="9" height="16" rx="4" fill="#fbfcfe"/>`; }
      if (o.black) s += `<path d="M${cx - 1},${top + 34} C${cx - 4},${top + 52} ${l},${b - 34} ${l},${b - 30} L${l},${b} L${r},${b} L${r},${b - 36} C${r - 2},${b - 40} ${cx + 4},${top + 52} ${cx + 1},${top + 34} Z" fill="#231e1b" filter="url(#tsoft2)"/>`;
      if (o.bubbles) s += [[l + 6, top + 36], [l + 13, top + 40], [l + 20, top + 46], [l + 9, top + 46], [l + 25, top + 52], [l + 16, top + 52]].map(([x, y], i2) => `<circle cx="${x}" cy="${y}" r="${2.5 + (i2 % 3)}" fill="#fff" fill-opacity=".6" stroke="#6fa8cc" stroke-width="1.1"/>`).join("");
      s += `</g><path d="M${l},${top} L${l},${b - w / 2} A${w / 2},${w / 2} 0 0 0 ${r},${b - w / 2} L${r},${top}" fill="none" stroke="#8b93a3" stroke-width="2.4"/>`;
    }
    return s + `</svg>`;
  }
  /* nitrate: a branching decision tree */
  function nitrateTreeSVG(){
    const W = 660, tube = (cx, cy, fill) => { const w = 22, h = 54, l = cx - w / 2, r = cx + w / 2, top = cy - h / 2, b = cy + h / 2;
      return `<path d="M${l},${top} L${l},${b - 11} A11,11 0 0 0 ${r},${b - 11} L${r},${top} Z" fill="${fill}" stroke="#8b93a3" stroke-width="2"/><rect x="${l - 2}" y="${top - 3}" width="${w + 4}" height="5" rx="2" fill="#cdd3dd"/>`; };
    const arrow = (x1, y1, x2, y2) => { const ang = Math.atan2(y2 - y1, x2 - x1); return `<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2 - 7 * Math.cos(ang))}" y2="${f1(y2 - 7 * Math.sin(ang))}" stroke="#8a93a3" stroke-width="2.5"/>${ahead(x2, y2, ang)}`; };
    const tag = (cx, y, txt, col) => `<text x="${f1(cx)}" y="${f1(y)}" font-size="12.5" font-weight="800" fill="${col}" text-anchor="middle">${txt}</text>`;
    const note = (cx, y, txt) => `<text x="${f1(cx)}" y="${f1(y)}" font-size="11" fill="#5a6376" text-anchor="middle">${txt}</text>`;
    let s = `<svg viewBox="0 0 ${W} 400" class="tflow" style="min-width:600px" role="img" aria-label="Nitrate decision tree">`;
    s += tube(300, 44, "#efe3c0") + note(300, 80, "grew in nitrate broth");
    s += `<text x="300" y="104" font-size="12" font-weight="700" fill="#343b4a" text-anchor="middle">① add Nitrate A + B</text>`;
    s += arrow(255, 118, 165, 150) + arrow(345, 118, 435, 150);
    s += `<text x="195" y="138" font-size="11" font-weight="700" fill="#b83a34" text-anchor="middle">RED</text>`;
    s += `<text x="410" y="138" font-size="11" font-weight="700" fill="#5a6376" text-anchor="middle">no color</text>`;
    /* left: red = positive */
    s += tube(150, 182, "#d9443a") + tag(150, 228, "POSITIVE", "#1b7f4e") + note(150, 246, "nitrite is present");
    /* right: clear → add zinc */
    s += tube(450, 182, "#f3ecd2");
    s += `<text x="450" y="230" font-size="12" font-weight="700" fill="#343b4a" text-anchor="middle">② add zinc dust</text>`;
    s += arrow(410, 244, 345, 282) + arrow(490, 244, 560, 282);
    s += `<text x="368" y="266" font-size="11" font-weight="700" fill="#b83a34" text-anchor="middle">turns RED</text>`;
    s += `<text x="548" y="266" font-size="11" font-weight="700" fill="#5a6376" text-anchor="middle">stays clear</text>`;
    s += tube(330, 314, "#d9443a") + tag(330, 360, "NEGATIVE", "#b83a34") + note(330, 378, "nitrate never reduced");
    s += tube(560, 314, "#f3ecd2") + tag(560, 360, "POSITIVE", "#1b7f4e") + note(560, 378, "reduced to N₂ gas");
    return s + `</svg>`;
  }
  function theoryHTML(t){
    const th = THEORY[t.key]; if (!th) return "";
    const chips = arr => arr.map(x => `<span class="tchip">${x}</span>`).join("");
    const readsBlock = th.readsTree
      ? `<div class="tflowwrap">${nitrateTreeSVG()}</div>`
      : `<div class="treads">${th.reads.map(r => `<div class="tread">${miniSVG(r)}<b>${r.tag}</b><span>${r.lab}</span></div>`).join("")}</div>`;
    return `<div class="thead"><div><div class="tkick">Understand the test</div><h2 id="tTitle">${t.title}</h2></div><button class="tclose" id="tClose" aria-label="Close">×</button></div>
      <div class="tasks"><span class="tlabel">The question it answers</span><p>${th.asks}</p></div>
      <div class="tsec"><h3>What's happening inside (and outside) the cell</h3><div class="tflowwrap">${flowSVG(th.flow)}</div></div>
      <div class="tsec"><h3>The key reactions</h3><div class="teqs">${th.eq.map(([e, n]) => `<div class="teq"><span class="tq">${e}</span>${n ? `<span class="tn">${n}</span>` : ""}</div>`).join("")}</div></div>
      <div class="tgrid">
        <div class="tsec"><h3>${th.ind ? `${IND[th.ind].axis === "pH" ? "pH indicator" : "Indicator dyes"}: ${IND[th.ind].name}` : "Indicator"}</h3>${th.ind ? indSVG(th.ind) : `<p class="tnoind">${th.noInd}</p>`}</div>
        <div class="tsec"><h3>What's measured</h3><div class="tio"><div><span class="tlabel">The bacteria use</span>${chips(th.used)}</div><div class="tarrow">→</div><div><span class="tlabel">You detect</span>${chips(th.made)}</div></div></div>
      </div>
      <div class="tsec"><h3>Why it changes</h3><p>${th.why}</p>${th.extra ? `<p class="textra">💡 ${th.extra}</p>` : ""}</div>
      <div class="tsec"><h3>How to read it</h3>${readsBlock}${th.readNote ? `<p class="treadnote">📝 ${th.readNote}</p>` : ""}</div>
      <div class="tsec"><h3>Where this connects to lecture</h3><div class="tlinks">${th.lecture.map(k => `<a class="btn secondary sm" href="${LECT[k][1]}">${LECT[k][0]} →</a>`).join("")}</div></div>
      <div class="tfoot"><button class="btn primary" id="tBack">Back to the bench</button></div>`;
  }
  function openTheory(){
    const t = T(), m = $("tModal");
    m.querySelector(".tcard").innerHTML = theoryHTML(t);
    m.hidden = false; document.body.style.overflow = "hidden";
    m.querySelector(".tcard").scrollTop = 0;
    const close = () => { m.hidden = true; document.body.style.overflow = ""; const b = $("theoryBtn"); if (b) b.focus({preventScroll:true}); };
    $("tClose").onclick = close; $("tBack").onclick = close;
    m.onclick = e => { if (e.target === m) close(); };
    m.onkeydown = e => { if (e.key === "Escape") close(); };
    $("tClose").focus();
  }
  (function(){
    const m = document.createElement("div");
    m.className = "tmodal"; m.id = "tModal"; m.hidden = true;
    m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-labelledby", "tTitle");
    m.innerHTML = `<svg width="0" height="0" style="position:absolute"><defs><filter id="tsoft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter><filter id="tsoft2" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter></defs></svg><div class="tcard"></div>`;
    document.body.appendChild(m);
  })();
})();
</script>
<script src="studypath.js"></script>
