<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Krebs Cycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script src="games.js"></script>
<script src="pathway.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, lerp, clamp, smooth, seg, C} = A;
  const ease = smooth, GREEN = "#1b7f4e", RED = "#b83a34", GOLD = "#9a6212", BLUE = "#3f4cc0";
  const lbl = (x, y, s, fill, size, anchor) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${size || 13}" font-weight="700" fill="${fill || "#5a6376"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  const tok = (x, y1, y2) => [[x, y1], [x, y2]];
  const CARDX = 640;

  function token(kind, x, y){
    if (kind === "NAD") return A.carrier(x, y, "NAD", false, {e:false});
    if (kind === "NADH") return A.carrier(x, y, "NAD", true, {e:false});
    if (kind === "FAD") return A.carrier(x, y, "FAD", false, {e:false});
    if (kind === "FADH2") return A.carrier(x, y, "FAD", true, {e:false});
    if (kind === "ADP") return A.atp(x - 2, y + 6, 2, {sc:.75});
    if (kind === "ATP") return A.atp(x - 12, y + 6, 3, {sc:.75});
    if (kind === "H2O") return A.h2o(x, y) + lbl(x, y + 20, "H₂O in", "#5a6376", 10);
    return "";
  }

  /* ================= Blanks & Learn More, shared by both views ================= */
  const BL = {
    matrix:{show:"mitochondrial matrix", ans:["mitochondrialmatrix","matrix"], fuzzy:true},
    acetylcoa:{show:"acetyl-CoA", ans:["acetylcoa","acetylcoenzymea"], fuzzy:true},
    twicekrebs:{show:"twice", ans:["twice","two","2"], fuzzy:true},
    feedback:{show:"feedback inhibition", ans:["feedbackinhibition","feedback"], fuzzy:true},
    ratelimiting2:{show:"rate-limiting", ans:["ratelimiting","rate-limiting","pacesetting"], fuzzy:true},
    substrate2:{show:"substrate-level", ans:["substratelevel","substrate","substratelevelphosphorylation"], fuzzy:true},
    oaa:{show:"oxaloacetate", ans:["oxaloacetate","oaa"], fuzzy:true},
    nadh3:{show:"3", ans:["3","three"]},
    twicekrebs2:{show:"twice", ans:["twice","two","2"], fuzzy:true},
    betaox:{show:"beta-oxidation", ans:["betaoxidation","beta"], fuzzy:true},
    ketones:{show:"acetyl-CoA", ans:["acetylcoa","acetylcoenzymea"], fuzzy:true}
  };
  const MORE = {
    b5:{title:"Vitamin B5 and coenzyme A", html:`<p>Coenzyme A (CoA) is built from pantothenic acid, vitamin B5. It acts like a molecular handle, carrying 2-carbon (and other) fragments between enzymes — you'll see it attached and removed again and again through this pathway.</p>`},
    citratebranch:{title:"Citrate's second career: making fat", html:`<p>When energy is abundant, citrate builds up faster than the cycle can use it. It leaks out of the mitochondrion into the cytoplasm, where it's broken back down into acetyl-CoA — the starting material for building fatty acids. It's a concrete link between "too much fuel" and fat storage.</p><p>Citrate is also a feedback inhibitor of PFK-1 back in glycolysis — one molecule, two separate brakes on two separate pathways.</p>`},
    ratelimit:{title:"The rate-limiting step — and α-ketoglutarate as a supplement", html:`<p><b>Throttling the cycle.</b> Isocitrate dehydrogenase is the cycle's rate-limiting enzyme. It is turned <b>on</b> by ADP and calcium ions (both signal "we need energy now") and turned <b>off</b> by ATP and by its own product, NADH. A pathway's own output slowing it down like this is <b>feedback inhibition</b>, and it shows up again and again in metabolism.</p><p><b>α-Ketoglutarate (α-KG) as a supplement.</b> α-KG is sold in capsules marketed for muscle recovery, exercise performance, and even "longevity" or anti-aging. The logic people cite is real biochemistry: α-KG is a hub that feeds the Krebs cycle for energy, carries nitrogen between amino acids (α-KG ⇄ glutamate), and is used by enzymes that remodel DNA and collagen. In practice, though, your mitochondria make and use α-KG constantly on their own, the evidence that swallowing extra meaningfully boosts healthy people is thin, and most of it gets broken down before it ever reaches your cells. It's a good example of a molecule that is genuinely important inside the cell but not obviously useful as a pill.</p>`},
    cofactors:{title:"Five vitamins, one enzyme complex", html:`<p>The α-ketoglutarate dehydrogenase complex is a giant assembly of three enzymes working in a bucket-brigade line. To pull off its reaction — chopping a carbon off as CO₂ and loading electrons onto NAD⁺ while bolting the leftover onto coenzyme A — it needs <b>five</b> vitamin-derived helpers at once:</p><ul><li><b>Thiamine pyrophosphate (B1)</b> — grabs and holds the carbon being removed.</li><li><b>Lipoic acid</b> — the swinging arm that passes the 2-carbon piece down the line.</li><li><b>FAD (B2)</b> and <b>NAD⁺ (B3)</b> — the electron carriers that leave loaded as FADH₂ and NADH.</li><li><b>Coenzyme A (B5)</b> — the handle the final product is attached to (succinyl-CoA).</li></ul><p>The link-reaction enzyme, <b>pyruvate dehydrogenase</b>, is this complex's near-identical cousin and uses the exact same five helpers. That's why a shortage of a single B vitamin — classic example: thiamine (B1) deficiency, or beriberi — can stall <i>both</i> of these key steps and starve the whole cell of energy, hitting nerves and the heart hardest.</p>`},
    complex2:{title:"One enzyme, two pathways", html:`<p>Succinate dehydrogenase is the only Krebs cycle enzyme built directly into the inner mitochondrial membrane instead of floating free in the matrix. That's not a coincidence — it IS Complex II of the electron transport chain, handing FADH₂'s electrons straight into the chain with no middleman.</p>`},
    oaabranch:{title:"The Krebs cycle as a protein hub", html:`<p>The cycle is not just an energy loop — it is also the cell's main junction between <b>carbohydrate, fat, and protein</b> metabolism. Several intermediates swap directly with amino acids by trading an amino group (−NH₂) back and forth:</p><ul><li><b>α-Ketoglutarate ⇄ glutamate</b> — the busiest of these; glutamate is the cell's central nitrogen carrier.</li><li><b>Oxaloacetate ⇄ aspartate</b> — feeds protein and nucleotide building.</li><li><b>Pyruvate ⇄ alanine</b> — back at the top of the pathway.</li></ul><p>Run one way, amino acids from digested protein lose their nitrogen and drop <i>into</i> the cycle to be burned for energy (handy when you eat more protein than you need, or during starvation). Run the other way, the cell pulls intermediates <i>out</i> of the cycle to build the amino acids it needs. Because the cycle is constantly being drained for building blocks, it also has to be topped back up — reactions that refill it (like making oxaloacetate from pyruvate) are called <b>anaplerotic</b>, "filling-up," reactions.</p>`},
    gtp:{title:"GTP and ATP: two names, one energy currency", html:`<p>This step is often written as "makes ATP," but in your cells the enzyme (succinyl-CoA synthetase) actually makes <b>GTP</b> first — guanosine triphosphate. GTP is the exact same kind of molecule as ATP, just built on the base <b>guanine</b> instead of <b>adenine</b>. It carries the same high-energy phosphate bonds and the same amount of usable energy.</p><p>The cell doesn't care which one it holds, because an enzyme called nucleoside-diphosphate kinase swaps a phosphate between them in one quick step: <b>GTP + ADP → GDP + ATP</b>. So the GTP made here is immediately converted into ATP you can spend anywhere. (Plants and many bacteria skip the middle step and make ATP directly.)</p><p>Either way the bookkeeping is the same: <b>1 ATP per turn</b> of the cycle, made by substrate-level phosphorylation — the only ATP the Krebs cycle makes without the electron transport chain.</p>`},
    ketonebodies:{title:"Fat, ketones, and the keto diet", html:`<p><b>Beta-oxidation</b> chops a fatty acid into 2-carbon pieces, and each one becomes acetyl-CoA, the same molecule that pyruvate makes. One 16-carbon fatty acid yields 8 acetyl-CoA, which is why fat stores so much energy.</p><p><b>Ketone bodies</b> are an overflow valve. When oxaloacetate runs low (during fasting or a very low-carb diet) and acetyl-CoA keeps pouring in from fat breakdown, the liver turns the extra acetyl-CoA into ketone bodies instead of sending it into the cycle. The brain, heart and muscles can turn ketones back into acetyl-CoA and burn them.</p><p><b>The keto diet</b> uses exactly this switch. By eating very little carbohydrate, glycolysis supplies less pyruvate (and less oxaloacetate), so the body leans on fat and makes ketones. That state is called <i>ketosis</i>, and it's what ketone breath and urine test strips detect. Uncontrolled, very high ketone levels (as in untreated type 1 diabetes) make the blood too acidic: diabetic ketoacidosis.</p>`}
  };

  /* ================= Board layout: a circular cycle ================= */
  const CX = 305, YC = 600, RAD = 200;
  const NODES = [
    {basic:"Citrate", adv:"Citrate"},
    {basic:"C₆H₈O₇", adv:"Isocitrate"},
    {basic:"C₅H₆O₅", adv:"α-Ketoglutarate"},
    {basic:"C₄–S-CoA", adv:"Succinyl-CoA"},
    {basic:"C₄H₆O₄", adv:"Succinate"},
    {basic:"C₄H₄O₄", adv:"Fumarate"},
    {basic:"C₄H₆O₅", adv:"Malate"},
    {basic:"Oxaloacetate", adv:"Oxaloacetate"}
  ];
  const ENZ = ["Citrate synthase", "Aconitase", "Isocitrate dehydrogenase", "α-KG dehydrogenase", "Succinyl-CoA synthetase", "Succinate dehydrogenase", "Fumarase", "Malate dehydrogenase"];
  const rad = d => d * Math.PI / 180;
  const nodeAng = i => -90 + i * 45;
  const polar = (deg, r) => [CX + r * Math.cos(rad(deg)), YC + r * Math.sin(rad(deg))];
  const NP = NODES.map((_, i) => polar(nodeAng(i), RAD));
  /* an arrow that follows the ring from one intermediate to the next, stopping short of each pill */
  const gapAt = i => 7 + 10 * Math.abs(Math.sin(rad(nodeAng(i))));
  const arcArrow = (i0, i1, o) => {
    const a0 = nodeAng(i0) + gapAt(i0), a1 = nodeAng(i0) + 45 - gapAt(i1);
    const [x0, y0] = polar(a0, RAD), [x1, y1] = polar(a1, RAD), t = rad(a1), h = 10;
    const dx = -Math.sin(t), dy = Math.cos(t), ax = Math.atan2(dy, dx);
    return A.op(o === undefined ? 1 : o, `<path d="M${f1(x0)},${f1(y0)} A${RAD},${RAD} 0 0 1 ${f1(x1)},${f1(y1)}" fill="none" stroke="#8a93a3" stroke-width="3.5"/><path d="M${f1(x1 + dx * 3)},${f1(y1 + dy * 3)} L${f1(x1 - h * Math.cos(ax - .45))},${f1(y1 - h * Math.sin(ax - .45))} L${f1(x1 - h * Math.cos(ax + .45))},${f1(y1 - h * Math.sin(ax + .45))} Z" fill="#8a93a3"/>`);
  };
  /* where a token starts (or finishes) its trip, just outside the ring, along a node's own radial line */
  const radialPt = (i, r) => polar(nodeAng(i), r);
  const tokStart = i => radialPt(i, RAD + 105);

  /* ---- accurate little skeletal molecules (carbon = gray, oxygen = red, sulfur = yellow) ---- */
  const MOLS = {
    pyr:{n:3, coo:[2], ket:[1]}, acetyl:{n:2, ket:[1], s:1},
    cit:{n:5, coo:[0, 4], branch:2, ohIn:2}, iso:{n:5, coo:[0, 4], branch:2, oh:[3]},
    akg:{n:5, coo:[0, 4], ket:[3]}, scoa:{n:4, coo:[0], ket:[3], s:3},
    suc:{n:4, coo:[0, 3]}, fum:{n:4, coo:[0, 3], dbl:1}, mal:{n:4, coo:[0, 3], oh:[1]}, oaa:{n:4, coo:[0, 3], ket:[1]}
  };
  const NODEMOL = ["cit", "iso", "akg", "scoa", "suc", "fum", "mal", "oaa"];
  function mol(key, x, y, sc, op){
    const m = MOLS[key], n = m.n, C0 = Array.from({length:n}, (_, i) => [i * 24 - (n - 1) * 12, i % 2 ? -9 : 9]);
    const out = i => i % 2 ? -1 : 1, bonds = [], atoms = [];
    const bond = (a, b, dbl) => bonds.push([a, b, dbl]);
    const O = (p, from, dbl) => { atoms.push([p[0], p[1], "O"]); bond(from, p, dbl); };
    for (let i = 0; i < n - 1; i++) bond(C0[i], C0[i + 1], m.dbl === i);
    (m.coo || []).forEach(i => { const [cx, cy] = C0[i], s = out(i), side = i === 0 ? -1 : 1; O([cx + side * 6, cy + s * 17], C0[i], true); O([cx + side * 19, cy - s * 3], C0[i]); });
    (m.ket || []).forEach(i => { const [cx, cy] = C0[i]; O([cx, cy + out(i) * 17], C0[i], true); });
    (m.oh || []).forEach(i => { const [cx, cy] = C0[i]; O([cx, cy + out(i) * 17], C0[i]); });
    if (m.ohIn !== undefined){ const [cx, cy] = C0[m.ohIn]; O([cx, cy - out(m.ohIn) * 16], C0[m.ohIn]); }
    if (m.branch !== undefined){ const [cx, cy] = C0[m.branch], s = out(m.branch), b = [cx, cy + s * 20]; atoms.push([b[0], b[1], "C"]); bond(C0[m.branch], b); O([b[0] - 13, b[1] + s * 11], b, true); O([b[0] + 13, b[1] + s * 11], b); }
    let sTag = "";
    if (m.s !== undefined){ const [cx, cy] = C0[m.s], sp = [cx + 19, cy + 5]; atoms.push([sp[0], sp[1], "S"]); bond(C0[m.s], sp); sTag = `<rect x="${f1(sp[0] + 8)}" y="${f1(sp[1] - 8)}" width="30" height="16" rx="4" fill="#fde7d3" stroke="#c4532f" stroke-width="1.2"/><text x="${f1(sp[0] + 23)}" y="${f1(sp[1] + 4)}" font-size="9" font-weight="700" fill="#8a2621" text-anchor="middle">CoA</text>`; }
    C0.forEach(p => atoms.push([p[0], p[1], "C"]));
    let o = bonds.map(([a, b, d]) => { if (!d) return `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="#8a93a3" stroke-width="2.6"/>`;
      const L = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, nx = -(b[1] - a[1]) / L * 2.2, ny = (b[0] - a[0]) / L * 2.2;
      return [1, -1].map(k => `<line x1="${f1(a[0] + k * nx)}" y1="${f1(a[1] + k * ny)}" x2="${f1(b[0] + k * nx)}" y2="${f1(b[1] + k * ny)}" stroke="#8a93a3" stroke-width="2"/>`).join(""); }).join("");
    o += atoms.map(([ax, ay, el]) => el === "C" ? `<circle cx="${f1(ax)}" cy="${f1(ay)}" r="6.5" fill="#4a5263"/>` : el === "O" ? `<circle cx="${f1(ax)}" cy="${f1(ay)}" r="5.5" fill="#d9443a"/>` : `<circle cx="${f1(ax)}" cy="${f1(ay)}" r="6.5" fill="#d8c13a" stroke="#8a7a10" stroke-width="1"/>`).join("") + sTag;
    return A.op(op === undefined ? 1 : op, `<g transform="translate(${f1(x)},${f1(y)}) scale(${sc})">${o}</g>`);
  }

  /* ---- what goes in and comes out at each step, drawn OUTSIDE the ring ---- */
  const COL = {"NAD⁺":"#2c6fd0", "NADH":"#1b7f4e", "FAD":"#b07a10", "FADH₂":"#8a5a00", "ADP + Pᵢ":"#6b4bb8", "ATP":"#5b3fb0", "CO₂":RED, "H₂O":"#2f7fbf", "acetyl-CoA":"#9a6212", "CoA":"#9a6212", "CoA-SH":"#9a6212"};
  const anchorFor = deg => { const c = Math.cos(rad(deg)); return c > .3 ? "start" : c < -.3 ? "end" : "middle"; };
  const rich = (x, y, parts, anchor) => `<text x="${f1(x)}" y="${f1(y)}" font-size="13" font-weight="700" text-anchor="${anchor}">${parts.map(q => `<tspan fill="${COL[q] || "#5a6376"}">${q}</tspan>`).join(`<tspan fill="#5a6376"> + </tspan>`)}</text>`;
  function exch(i0, ins, outs, o){
    const am = nodeAng(i0) + 22.5, a1 = am - 11, a2 = am + 11;
    const [xi, yi] = polar(a1, RAD + 36), [xc, yc] = polar(am, RAD - 14), [xo, yo] = polar(a2, RAD + 36);
    const t = Math.atan2(yo - (yc + yo) / 2, xo - (xc + xo) / 2), h = 9;
    let s = `<path d="M${f1(xi)},${f1(yi)} Q${f1(xc)},${f1(yc)} ${f1(xo)},${f1(yo)}" fill="none" stroke="#5a6376" stroke-width="2.2"/><path d="M${f1(xo)},${f1(yo)} L${f1(xo - h * Math.cos(t - .45))},${f1(yo - h * Math.sin(t - .45))} L${f1(xo - h * Math.cos(t + .45))},${f1(yo - h * Math.sin(t + .45))} Z" fill="#5a6376"/>`;
    const [lx, ly] = polar(a1 - 2, RAD + 52), [mx, my] = polar(a2 + 2, RAD + 52);
    s += rich(lx, ly + 5, ins, anchorFor(a1 - 2)) + rich(mx, my + 5, outs, anchorFor(a2 + 2));
    return A.op(o, s);
  }
  function inArrow(i0, lab, o){
    const am = nodeAng(i0) + 22.5, [x0, y0] = polar(am, RAD + 46), [x1, y1] = polar(am, RAD + 8), [lx, ly] = polar(am, RAD + 62);
    return A.op(o, A.arrow(x0, y0, x1, y1, COL[lab] || "#5a6376", 2.5) + lbl(lx, ly + 5, lab, COL[lab] || "#343b4a", 13, anchorFor(am)));
  }
  /* per step: [arc start node, draw(o)] — arc i0 runs from node i0 to node i0+1 */
  const EXCH = {
    0:o => exch(7, ["H₂O"], ["CoA"], o),
    2:o => exch(1, ["NAD⁺"], ["NADH", "CO₂"], o),
    3:o => exch(2, ["NAD⁺", "CoA"], ["NADH", "CO₂"], o),
    4:o => exch(3, ["ADP + Pᵢ"], ["ATP", "CoA"], o),
    5:o => exch(4, ["FAD"], ["FADH₂"], o),
    6:o => inArrow(5, "H₂O", o),
    7:o => exch(6, ["NAD⁺"], ["NADH"], o)
  };

  function buildVariant(ADV){
    const Y = {pyr:110, acetyl:250};
    Y.tally = ADV ? 1090 : 1000; Y.x2 = Y.tally + 150; Y.go = Y.x2 + 150;
    const H = Y.go + 150;
    /* one card position per cycle step, in a column beside the board */
    const CARDY = [380, 450, 520, 590, 660, 730, 800, 870, Y.tally, Y.x2];
    const molIn = i => polar(nodeAng(i), RAD - 74);
    const molRot = i => { let r = nodeAng(i) + 90; while (r > 90) r -= 180; while (r < -90) r += 180; return r; };

    function draw(c){
      const {prog, idx, R} = c;
      const p = i => prog(i), e = i => ease(p(i));
      let o = "";
      o += `<circle cx="${CX}" cy="${YC}" r="${RAD + 26}" fill="#fbf6ee"/><circle cx="${CX}" cy="${YC}" r="${RAD}" fill="none" stroke="#ece4d6" stroke-width="2"/>`;
      o += lbl(CX, 40, `The ${R("matrix") === "?" ? "?" : "mitochondrial matrix"} (bacteria: the cytoplasm)`, "#5a6376", 13);

      /* step 0: pyruvate arrives */
      const g0 = e(0);
      o += mol("pyr", CX, Y.pyr, 1, g0) + A.op(g0, lbl(CX + 74, Y.pyr - 2, "Pyruvate (3C)", "#343b4a", 13, "start") + lbl(CX + 74, Y.pyr + 14, "from glycolysis", "#5a6376", 11, "start"));
      if (ADV) o += A.op(g0, `<rect x="16" y="${Y.pyr - 24}" width="150" height="46" rx="12" fill="#eef0fd" stroke="#6b4bb8" stroke-width="1.5"/>` + lbl(91, Y.pyr - 4, "Amino acids", "#5b3fb0", 13) + lbl(91, Y.pyr + 13, "(e.g. alanine) − NH₂", "#5b3fb0", 10) + A.arrow(168, Y.pyr, CX - 52, Y.pyr, "#6b4bb8", 2.5));

      /* step 1: the link reaction */
      const p1 = p(1), fly = ease(seg(p1, 0, .4)), grow = ease(seg(p1, .4, .75)), dep = ease(seg(p1, .75, 1));
      if (idx >= 1 && p1 > 0){
        o += A.op(1 - grow, token("NAD", lerp(560, CX + 70, fly), Y.pyr));
        o += A.op(grow, A.arrow(CX, Y.pyr + 40, CX, Y.acetyl - 30, "#8a93a3", 3));
        o += A.op(ease(seg(p1, .3, .7)), `<path d="M${CX + 46},${Y.pyr + 52} Q${CX - 6},${Y.pyr + 74} ${CX + 46},${Y.pyr + 96}" fill="none" stroke="#5a6376" stroke-width="2.2"/>` + A.arrow(CX + 34, Y.pyr + 92, CX + 48, Y.pyr + 97, "#5a6376", 2.2) + rich(CX + 52, Y.pyr + 56, ["NAD⁺", "CoA"], "start") + rich(CX + 52, Y.pyr + 101, ["NADH", "CO₂"], "start"));
        o += mol("acetyl", CX - 10, Y.acetyl, 1, grow) + A.op(grow, lbl(CX, Y.acetyl + 34, "Acetyl-CoA (2C)", "#343b4a", 13));
        if (ADV){
          o += A.op(grow, lbl(CX - 10, Y.pyr + 78, "pyruvate dehydrogenase", "#6b4bb8", 11, "end"));
          o += A.op(grow, `<rect x="16" y="${Y.acetyl - 26}" width="150" height="48" rx="12" fill="#fff6e0" stroke="#c98a0e" stroke-width="1.5"/>` + lbl(91, Y.acetyl - 6, "Fatty acids", "#8a5a00", 13) + lbl(91, Y.acetyl + 12, "β-oxidation (2C at a time)", "#8a5a00", 9.5) + A.arrow(168, Y.acetyl, CX - 66, Y.acetyl, "#c98a0e", 2.5));
          o += A.op(grow, `<rect x="464" y="${Y.acetyl - 26}" width="150" height="48" rx="12" fill="#fff" stroke="#c98a0e" stroke-width="1.5" stroke-dasharray="5 4"/>` + lbl(539, Y.acetyl - 6, "Ketone bodies", "#8a5a00", 13) + lbl(539, Y.acetyl + 12, "when OAA runs low", "#8a5a00", 10) + A.arrow(CX + 62, Y.acetyl, 460, Y.acetyl, "#c98a0e", 2.5, "5 4"));
        }
      }

      /* steps 2-9: the eight reactions around the cycle */
      const cyc = (nodeI, stepI, kind, prodKind) => {
        const pi = p(stepI);
        if (idx < stepI) return;
        const prevI = (nodeI + 7) % 8;
        const grow2 = ease(seg(pi, .3, .7)), dep2 = ease(seg(pi, .72, 1));
        o += arcArrow(prevI, nodeI, grow2 > .03 ? 1 : .3);
        const [nx, ny] = NP[nodeI];
        if (kind && pi > 0){
          const drift = ease(seg(pi, 0, .45)), [sx, sy] = tokStart(nodeI);
          o += A.op(1 - grow2, token(kind, lerp(sx, nx, drift), lerp(sy, ny, drift)));
        }
        if (prodKind && dep2 > 0 && dep2 < 1){ const [tx, ty] = tokStart(nodeI); o += A.op(1 - dep2, token(prodKind, lerp(nx, tx, dep2), lerp(ny, ty, dep2))); }
        if (EXCH[nodeI]) o += EXCH[nodeI](dep2 > 0 ? dep2 : (kind ? 0 : grow2));
        const [mx, my] = molIn(nodeI);
        o += `<g transform="rotate(${f1(molRot(nodeI))} ${f1(mx)} ${f1(my)})">${mol(NODEMOL[nodeI], mx, my, .6, grow2)}</g>`;
        o += A.op(grow2, A.pill(nx, ny, ADV ? NODES[nodeI].adv : NODES[nodeI].basic, nodeI === 0 || nodeI === 7 ? GOLD : BLUE, 1, 12));
        if (ADV){ const [bx, by] = polar(nodeAng(prevI) + 22.5, RAD); o += A.op(grow2, `<circle cx="${f1(bx)}" cy="${f1(by)}" r="10" fill="#6b4bb8" stroke="#fff" stroke-width="2"/>` + lbl(bx, by + 4, nodeI === 0 ? 1 : nodeI + 1, "#fff", 11)); }
      };
      /* acetyl-CoA drops into the top of the cycle */
      if (idx >= 2 && p(2) > 0){ const [lx, ly] = polar(nodeAng(7) + 22.5, RAD + 10); o += A.op(ease(seg(p(2), 0, .4)), A.arrow(CX - 30, Y.acetyl + 46, lx + 6, ly - 8, "#9a6212", 2.5, "6 5") + lbl(CX + 34, Y.acetyl + 96, "acetyl-CoA joins", "#9a6212", 11, "start")); }
      cyc(0, 2, null, null);
      cyc(1, 3, null, null);
      cyc(2, 4, "NAD", "NADH");
      cyc(3, 5, "NAD", "NADH");
      cyc(4, 6, "ADP", "ATP");
      cyc(5, 7, "FAD", "FADH2");
      cyc(6, 8, "H2O", null);
      cyc(7, 9, "NAD", "NADH");

      /* the middle: what one turn does, once the loop is closed */
      if (idx >= 9 && p(9) > .6){
        const q = ease(seg(p(9), .6, 1));
        o += A.op(q, lbl(CX, YC - 12, ADV ? "Citric acid cycle" : "Krebs cycle", "#343b4a", 17) + lbl(CX, YC + 10, "2 C in (acetyl) → 2 CO₂ out", RED, 12));
      }
      /* advanced: amino-acid side doors and the enzyme key */
      if (ADV){
        /* α-KG's amino-acid side door, drawn as a chip so it reads as a label and never collides with the ring */
        if (idx >= 4 && p(4) > .7){ const [ax, ay] = NP[2], cx = ax + 36, cy = ay + 40;
          o += A.op(ease(seg(p(4), .7, 1)), `<line x1="${f1(ax + 14)}" y1="${f1(ay + 14)}" x2="${f1(cx - 40)}" y2="${f1(cy - 9)}" stroke="#6b4bb8" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="${f1(cx - 48)}" y="${f1(cy - 15)}" width="96" height="26" rx="13" fill="#f2eefc" stroke="#6b4bb8" stroke-width="1.5"/>` + lbl(cx, cy + 3, "⇄ glutamate", "#5b3fb0", 12)); }
        if (idx >= 9 && p(9) > .7){
          const q = ease(seg(p(9), .7, 1)), [ox, oy] = NP[7];
          o += A.op(q, `<rect x="8" y="${f1(oy - 104)}" width="104" height="46" rx="12" fill="#eef0fd" stroke="#6b4bb8" stroke-width="1.5"/>` + lbl(60, oy - 84, "Aspartate", "#5b3fb0", 13) + lbl(60, oy - 67, "→ proteins", "#5b3fb0", 11) + A.arrow(ox - 34, oy - 14, 84, oy - 56, "#6b4bb8", 2.5));
        }
        const ky = YC + RAD + 110;
        if (idx >= 9 && p(9) > .5){
          const q = ease(seg(p(9), .5, 1));
          o += A.op(q, `<rect x="20" y="${ky - 26}" width="590" height="${ENZ.length / 2 * 26 + 30}" rx="14" fill="#f6f2fd" stroke="#d8ccf2"/>` + lbl(36, ky - 6, "Enzymes (numbered on the ring)", "#5b3fb0", 12, "start"));
          ENZ.forEach((n, i) => { const x = 36 + (i % 2) * 290, y = ky + 18 + Math.floor(i / 2) * 26; o += A.op(q, `<circle cx="${x + 9}" cy="${y - 4}" r="9" fill="#6b4bb8"/>` + lbl(x + 9, y, i + 1, "#fff", 10) + lbl(x + 26, y, n, "#343b4a", 12, "start")); });
        }
      }

      /* net tally for one turn */
      const p10 = p(10);
      if (idx >= 10 && p10 > 0){
        const r = k => ease(seg(p10, k * .2, k * .2 + .3)), by = Y.tally;
        o += `<rect x="${CX - 280}" y="${by - 40}" width="560" height="${f1(lerp(40, 130, ease(seg(p10, 0, .2))))}" rx="18" fill="#fff" stroke="${GREEN}" stroke-width="2.5"/>`;
        o += A.op(r(0), lbl(CX - 250, by, "One turn of the cycle makes:", "#343b4a", 14, "start"));
        o += A.op(r(1), lbl(CX - 250, by + 30, "3 NADH · 1 FADH₂ · 1 ATP · 2 CO₂", GREEN, 16, "start"));
        o += A.op(r(2), lbl(CX - 250, by + 58, "(plus 1 NADH + 1 CO₂ from the link reaction)", "#5a6376", 12, "start"));
      }
      const p11 = p(11);
      if (idx >= 11 && p11 > 0){
        const r = ease(seg(p11, .1, .6));
        o += A.op(r, `<rect x="${CX - 280}" y="${Y.x2 - 40}" width="560" height="120" rx="18" fill="#fff" stroke="${GOLD}" stroke-width="2.5"/>`);
        o += A.op(r, lbl(CX - 250, Y.x2 - 10, "2 pyruvate per glucose → the cycle runs twice:", "#343b4a", 14, "start"));
        o += A.op(r, lbl(CX - 250, Y.x2 + 20, "8 NADH · 2 FADH₂ · 2 ATP · 6 CO₂ total", GOLD, 16, "start"));
        o += A.op(r, lbl(CX - 250, Y.x2 + 48, "(link reaction + two turns of the cycle, per glucose)", "#5a6376", 12, "start"));
      }
      /* where next */
      const p12 = p(12);
      if (idx >= 12 && p12 > 0){
        const a = ease(seg(p12, 0, .6));
        o += A.op(a, A.carrier(CX - 200, Y.go, "NAD", true) + A.carrier(CX - 90, Y.go, "FAD", true));
        o += A.op(a, A.arrow(CX - 20, Y.go, CX + 60, Y.go, "#3f4cc0", 3));
        o += A.op(a, lbl(CX + 70, Y.go + 5, "Electron transport chain →", "#2c3796", 14, "start"));
      }
      return o;
    }

    const STEPS = [
      {focusY:Y.pyr, animMs:900,
       pop:{y:Y.pyr, x:CARDX, title:"Pyruvate's next stop",
         text:`Pyruvate crosses into the {{matrix}} of the mitochondrion (in bacteria, it just stays in the cytoplasm). One more oxidation, and it's ready to join the Krebs cycle.${ADV ? ` Protein can feed in here too: after an amino acid like alanine has its amino group (−NH₂) removed, what's left is pyruvate (see the arrow on the left).` : ""}`}},
      {focusY:Y.acetyl, animMs:2200, tally:{nadh:1, co2:1},
       action:{type:"drag", token:"NAD", count:1, from:[[600, Y.pyr]], targets:[[CX, Y.pyr]], label:"Drag NAD⁺ onto pyruvate — this is the link reaction."},
       pop:{y:Y.acetyl, x:CARDX, title:"The link reaction: oxidative decarboxylation", more:ADV ? "ketonebodies" : "b5",
         text:`This step is called <b>oxidative decarboxylation</b> — two things at once. "Decarboxylation" means one carbon is removed as CO₂ (you can see it fly off above). "Oxidative" means electrons are stripped off and handed to NAD⁺ → NADH. The leftover 2-carbon piece attaches to coenzyme A, forming {{acetylcoa}} — the molecule that actually enters the cycle. Two pyruvate per glucose, so this happens {{twicekrebs}}.${ADV ? ` <b>Fat enters right here too.</b> Fatty acids are chopped into 2-carbon pieces by {{betaox}}, and each piece becomes the same {{ketones}} that pyruvate just made. When there's more acetyl-CoA than oxaloacetate to take it, the liver turns the extra into ketone bodies (the dashed arrow).` : ""}`}},
      {focusY:NP[0][1], animMs:1700,
       action:{type:"click", at:[CX, Y.acetyl + 70], button:"Combine with oxaloacetate", label:"Click to start the cycle: join acetyl-CoA with oxaloacetate."},
       pop:{y:CARDY[0], x:CARDX, title:"Citrate synthase: the cycle begins", more:"citratebranch",
         text:`A 2-carbon acetyl-CoA joins the 4-carbon oxaloacetate to make 6-carbon citrate — no energy change, just a merger that kicks things off. <b>Citrate is citric acid</b> — literally the sour compound in lemons, limes, and citrus sodas. When a food label says "citric acid," that molecule is your cells' starting material for this cycle. When ATP is plentiful, citrate builds up and signals glycolysis to slow down — the cycle acting as its own brake. This is a {{feedback}} control point.<br><br><a class="btn secondary sm" href="id-tests.html#citrate">🧪 Try the Citrate Utilization test →</a>`}},
      {focusY:NP[1][1], animMs:1500,
       action:{type:"click", at:[(NP[0][0] + NP[1][0]) / 2, (NP[0][1] + NP[1][1]) / 2 - 16], button:"Rearrange", label:"Click to reposition citrate."},
       pop:{y:CARDY[1], x:CARDX, title:"Aconitase: repositioning, not spending",
         text:`Still 6 carbons, same formula — just moved so the next enzyme can grab hold. Same idea as the reshuffle steps back in glycolysis.`}},
      {focusY:NP[2][1], animMs:2000, tally:{nadh:1, co2:1},
       action:{type:"drag", token:"NAD", count:1, from:[tokStart(2)], targets:[NP[2]], label:"Drag NAD⁺ onto isocitrate."},
       pop:{y:CARDY[2], x:CARDX, title:"Decarboxylation #1 — the rate-limiting step", more:"ratelimit",
         text:`<b>Decarboxylation:</b> isocitrate (6C) loses one carbon as CO₂, dropping to 5 carbons (α-ketoglutarate). That CO₂ is exhaled when you breathe out. At the same time, NAD⁺ picks up electrons → NADH. This is the cycle's {{ratelimiting2}} step, meaning everything before it backs up when it slows. It speeds up when ADP is high (need energy) and slows when ATP or NADH is high (already have energy).${ADV ? ` <b>α-Ketoglutarate is also a doorway for protein.</b> It swaps back and forth with the amino acid glutamate (α-KG ⇄ glutamate), so amino acids from digested protein can be turned into α-KG and burned for energy here — and, run in reverse, the cycle can pull off α-KG to build glutamate and other amino acids. See the Learn More for α-KG as a supplement.` : ""}`}},
      {focusY:NP[3][1], animMs:2000, tally:{nadh:1, co2:1},
       action:{type:"drag", token:"NAD", count:1, from:[tokStart(3)], targets:[NP[3]], label:"Drag NAD⁺ onto α-ketoglutarate."},
       pop:{y:CARDY[3], x:CARDX, title:"Decarboxylation #2 — five vitamins, one enzyme", more:"cofactors",
         text:`<b>Second decarboxylation:</b> α-KG (5C) loses another carbon as CO₂, dropping to 4 carbons (succinyl-CoA). At this point, <b>both carbons from the original acetyl-CoA are gone as CO₂</b> — the rest of the cycle is just harvesting the electrons left behind. This enzyme complex needs FIVE vitamin-derived helpers: thiamine (B1), riboflavin (B2), niacin (B3), pantothenic acid (B5), and lipoic acid — a clear reason why B-vitamin deficiencies stall energy metabolism.`}},
      {focusY:NP[4][1], animMs:2000, tally:{made:1},
       action:{type:"drag", token:"ADP", count:1, from:[tokStart(4)], targets:[NP[4]], label:"Drag ADP onto succinyl-CoA."},
       pop:{y:CARDY[4], x:CARDX, title:"The cycle's only direct payoff", more:"gtp",
         text:`A phosphate moves straight from the substrate to a nucleotide, making ATP — {{substrate2}} phosphorylation, the same direct hand-off you saw in glycolysis. It's the only step in the whole cycle that makes a usable fuel molecule directly; every other step just loads electron carriers for later. (In your cells this step actually makes GTP first — see the Learn More.)`}},
      {focusY:NP[5][1], animMs:2000, tally:{fadh2:1},
       action:{type:"drag", token:"FAD", count:1, from:[tokStart(5)], targets:[NP[5]], label:"Drag FAD onto succinate."},
       pop:{y:CARDY[5], x:CARDX, title:"A cycle enzyme that's also part of the ETC", more:"complex2",
         text:`FAD, not NAD⁺, collects these electrons and becomes FADH₂ — a slightly smaller energy drop, so FADH₂ delivers its electrons later in the chain than NADH does. This enzyme is built right into the inner mitochondrial membrane, and it's also Complex II of the electron transport chain.`}},
      {focusY:NP[6][1], animMs:1900,
       action:{type:"drag", token:"H2O", count:1, from:[radialPt(6, RAD + 75)], targets:[[(NP[5][0] + NP[6][0]) / 2, (NP[5][1] + NP[6][1]) / 2]], label:"Drag H₂O onto fumarate."},
       pop:{y:CARDY[6], x:CARDX, title:"Water in — fumarate → malate",
         text:`Water is added across fumarate's double bond, converting it to malate. The oxygen atoms from water become part of malate's -OH group. No energy change — just repositioning atoms so the final oxidation can happen. Drag the water molecule labeled "H₂O in" onto the reaction.`}},
      {focusY:NP[7][1], animMs:2000, tally:{nadh:1},
       action:{type:"drag", token:"NAD", count:1, from:[tokStart(7)], targets:[NP[7]], label:"Drag NAD⁺ onto malate."},
       pop:{y:CARDY[7], x:CARDX, title:"Back where it started", more:"oaabranch",
         text:`{{oaa}} is regenerated — the cycle is a cycle because this last step rebuilds exactly what step one consumed. One more NADH is made along the way. <b>Malate is malic acid</b> — the compound that gives green apples and sour candy their tart flavor. If you ate an apple today, your cells are actively breaking this molecule down right here. Oxaloacetate can also become the amino acid aspartate, linking this energy pathway to building proteins.`}},
      {focusY:Y.tally, animMs:2000,
       action:{type:"click", at:[CX, Y.tally - 70], button:"Add it up", label:"Tally one turn of the cycle."},
       pop:{y:CARDY[8], x:CARDX, title:"One acetyl-CoA, one turn",
         text:`One turn makes {{nadh3}} NADH, 1 FADH₂, and 1 ATP directly, while releasing 2 CO₂ (decarboxylation). The ATP payoff is small — but the loaded NADH and FADH₂ carriers are the real point. They carry electrons to the ETC, where most of the cell's ATP is finally made.`}},
      {focusY:Y.x2, animMs:1800,
       action:{type:"click", at:[CX, Y.x2 - 70], button:"Multiply by 2", label:"Remember: 2 pyruvate per glucose."},
       pop:{y:CARDY[9], x:CARDX, title:"Remember: twice per glucose",
         text:`Every glucose makes 2 pyruvate, so the link reaction and the cycle both run {{twicekrebs2}}. Combine the link reaction with two turns of the cycle and one glucose yields 8 NADH, 2 FADH₂, 2 ATP, and 6 CO₂.`}}
    ];
    STEPS.push({focusY:Y.go - 40, animMs:1600,
       action:{type:"click", at:[CX, Y.go - 60], button:"Where do the electrons go?", label:"Follow the electron carriers."},
       pop:{y:Y.go, x:CARDX, title:"Krebs cycle summarized",
         text:`<b>Big idea: decarboxylation.</b> The Krebs cycle's main job is finishing what glycolysis started — stripping all remaining carbons off glucose as CO₂ (decarboxylation), and loading those electrons onto NADH and FADH₂ carriers. The ATP made here is a small bonus; the electron carriers are the real output. They carry high-energy electrons to the ETC next, which uses them to make the vast majority of the cell's ATP.<br><br><i>"The Krebs cycle = decarboxylation + electron carrier loading."</i>`}});

    return {title:`The Krebs Cycle: ${ADV ? "The Full Pathway" : "The Basics"}`, page:"krebs.html", H, narrowW:680, BL, MORE, steps:STEPS, draw, token,
      intro:`Pyruvate arrives at the top; the cycle runs as a loop. Act on each step and the cycle fills in, with every molecule drawn atom by atom and everything that goes in or comes out (NAD⁺ → NADH, CO₂, H₂O, ATP) shown outside the ring.`,
      tally:[["co2", "CO₂ released", RED], ["nadh", "NADH", "#2f9e63"], ["fadh2", "FADH₂", "#c98a0e"], ["made", "ATP made", GREEN]],
      endTitle:"You built the Krebs cycle!", endText:"Per glucose: 8 NADH, 2 FADH₂, 2 ATP, 6 CO₂ (link reaction + two turns of the cycle). Tap any numbered marker to review a step.",
      next:[["Electron transport chain →", "etc.html"], ["All modules", "index.html"]], hideRestart:true};
  }

  const VARIANTS = [{key:"basic", label:"The Basics"}, {key:"advanced", label:"The Full Pathway"}];
  function render(variant, mode){
    const cfg = buildVariant(variant === "advanced");
    cfg.variant = variant; cfg.variants = VARIANTS; cfg.mode = mode;
    cfg.onVariant = v => {
      const m = window.__pw ? window.__pw.mode : "learn";
      try { localStorage.setItem("bio112-krebs-variant", v); } catch (e) {}
      render(v, m);
    };
    Pathway.start(cfg);
  }
  let startVariant = "basic";
  try { startVariant = localStorage.getItem("bio112-krebs-variant") || "basic"; } catch (e) {}
  render(startVariant);
})();
</script>
<script src="studypath.js"></script>
