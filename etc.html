<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Transport Chain & ATP Synthase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script src="games.js"></script>
<script src="pathway.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, lerp, clamp, smooth, seg, C} = A;
  const ease = smooth, GREEN = "#1b7f4e", RED = "#b83a34", BLUE = "#3f4cc0";
  const lbl = (x, y, s, fill, size, anchor) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${size || 13}" font-weight="700" fill="${fill || "#5a6376"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  const down = (x, y1, y2, o) => A.op(o === undefined ? 1 : o, A.arrow(x, y1, x, y2, "#8a93a3", 3));
  const tok = (x, y1, y2) => [[x, y1], [x, y2]];

  function token(kind, x, y){
    if (kind === "NADH") return A.carrier(x, y, "NAD", true);
    if (kind === "FADH2") return A.carrier(x, y, "FAD", true);
    if (kind === "epair") return A.eDot(x - 9, y, 9) + A.eDot(x + 9, y, 9);
    if (kind === "H") return A.hion(x, y, 12);
    return "";
  }

  /* ================= Blanks & Learn More, shared by both variants ================= */
  const BL = {
    innermembrane:{show:"inner mitochondrial membrane", ans:["innermitochondrialmembrane","innermembrane"], fuzzy:true},
    oxidized:{show:"oxidized", ans:["oxidized","oxidation"], fuzzy:true},
    reduced:{show:"reduced", ans:["reduced","reduction"], fuzzy:true},
    nadplus2:{show:"NAD⁺", ans:["nad","nadplus"]},
    chemiosmosis:{show:"chemiosmosis", ans:["chemiosmosis"], fuzzy:true},
    gradient:{show:"concentration gradient", ans:["concentrationgradient","gradient","electrochemicalgradient"], fuzzy:true},
    iron:{show:"iron", ans:["iron","fe"]},
    atpsynthase:{show:"ATP synthase", ans:["atpsynthase","atpsynthetase"], fuzzy:true}
  };
  const MORE = {
    whyfewer:{title:"Why FADH₂ is worth less than NADH", html:`<p>Complex I sits at a big energy drop — NADH's electrons have a lot of potential energy to give up, enough to pump protons right away. FADH₂'s electrons enter at Complex II, already partway down the energy hill, so they never trigger Complex I's pump. That's the whole reason textbooks count roughly 2.5 ATP per NADH but only about 1.5 ATP per FADH₂ (often rounded to 3 and 2).</p>`},
    cytc:{title:"Cytochrome c's second job", html:`<p>Cytochrome c doesn't just ferry electrons — when a cell is damaged beyond repair, it can be released from the mitochondrion into the rest of the cell, where it helps trigger apoptosis (programmed cell death). One small protein, two very different jobs.</p>`},
    motor:{title:"A real rotary motor", html:`<p>ATP synthase is an actual mechanical motor: protons flowing through it spin a rotor at thousands of RPM, and that spinning physically squeezes ADP and phosphate together. Peter Mitchell won the 1978 Nobel Prize in Chemistry for figuring out this chemiosmotic mechanism — at the time, a wildly controversial idea.</p>`},
    poisons:{title:"How some poisons work", html:`<p>Cyanide and carbon monoxide both work by jamming Complex IV shut, so electrons can't be handed off to the final acceptor. The whole chain backs up almost instantly, protons stop being pumped, and ATP production collapses — which is why they're so fast-acting and dangerous.</p>`},
    altacceptors:{title:"Other final electron acceptors", html:`<p>Different microbes use different final acceptors depending on what's available: nitrate (denitrifying bacteria, forming nitrite or N₂ gas), sulfate (forming the rotten-egg smell of hydrogen sulfide), and even iron or fumarate. Whichever one is used, the same basic chain and the same ATP synthase are doing the work.</p>`},
    coq10:{title:"That supplement aisle name", html:`<p>Ubiquinone is also called coenzyme Q10 — yes, the same CoQ10 sold as a supplement. Your cells already make their own; the supplement's real-world benefit is much less dramatic than the marketing suggests.</p>`}
  };

  /* ================= Shared board layout ================= */
  const H = 1760, CX = 500;
  const MX1 = 90, MX2 = 960, MY = 560, MH = 110;
  const CPX = {c1:170, c2:340, q:460, c3:580, cyt:680, c4:800, atp:920};
  const Y = {top:120, redox:280, gradLbl:395, atpsyn:1050, tally:1300, grand:1470, go:1650};
  const CARDY = {c1:445, c2:520, q3:595, cytiv:670, final:745, gradient:820};

  function membraneDiagram(o){
    let s = `<rect x="0" y="${MY - MH / 2 - 130}" width="1000" height="${MH + 260}" fill="#eef1f5"/>`;
    s += lbl(CX, MY - MH / 2 - 100, "Intermembrane space (bacteria: outside the plasma membrane)", "#5a6376", 12);
    s += A.membrane(MX1, MX2, MY, MH);
    s += lbl(CX, MY + MH / 2 + 40, "Matrix (bacteria: cytoplasm)", "#5a6376", 12);
    return s;
  }

  function makeDraw(FINAL){
   return function draw(c){
    const {prog, idx} = c;
    const p = i => prog(i), e = i => ease(p(i));
    let o = "";
    o += membraneDiagram();

    /* step 0: NADH and FADH2 arrive from the matrix */
    const g0 = e(0);
    o += A.op(g0, A.carrier(CPX.c1 - 10, Y.top, "NAD", true) + A.carrier(CPX.c2 + 10, Y.top, "FAD", true));
    o += A.op(g0, lbl(CX, Y.top + 40, "From glycolysis and the Krebs cycle", "#343b4a", 13));

    /* step 2: Complex I */
    const p2 = p(2);
    if (idx >= 2 && p2 > 0){
      const drift = ease(seg(p2, 0, .5)), merge = ease(seg(p2, .5, .8)), pump = ease(seg(p2, .8, 1));
      o += A.op(1 - merge, token("NADH", CPX.c1, lerp(Y.top + 30, MY, drift)));
      o += A.op(merge, A.enzyme(CPX.c1, MY, {label:"I", sc:.85}));
      o += A.op(merge * (1 - pump * .3), lbl(CPX.c1, MY - 90, "NADH → NAD⁺", GREEN, 12));
      o += A.op(pump, `<circle cx="${CPX.c1}" cy="${MY - 130}" r="16" fill="#dbe7fb" stroke="${C.H}" stroke-width="2"/><text x="${CPX.c1}" y="${MY - 125}" font-size="12" font-weight="700" fill="#1f4a9c" text-anchor="middle">H⁺×4</text>`);
    }
    /* step 3: Complex II */
    const p3 = p(3);
    if (idx >= 3 && p3 > 0){
      const drift = ease(seg(p3, 0, .5)), merge = ease(seg(p3, .5, .8));
      o += A.op(1 - merge, token("FADH2", CPX.c2, lerp(Y.top + 30, MY, drift)));
      o += A.op(merge, A.enzyme(CPX.c2, MY, {label:"II", sc:.7}));
      o += A.op(merge, lbl(CPX.c2, MY - 90, "FADH₂ → FAD", RED, 12));
    }
    /* Q, always visible once either I or II has run */
    if (idx >= 2 && (p(2) > .5 || p(3) > .5)) o += `<circle cx="${CPX.q}" cy="${MY}" r="20" fill="#f6e7c4" stroke="#c9a15a" stroke-width="2"/>` + lbl(CPX.q, MY + 4, "Q", "#6b4b1f", 13);
    /* step 4: electrons move, Q -> Complex III */
    const p4 = p(4);
    if (idx >= 4 && p4 > 0){
      const drift = ease(seg(p4, 0, .55)), merge = ease(seg(p4, .55, .85)), pump = ease(seg(p4, .85, 1));
      o += A.op(1 - merge, token("epair", lerp(CPX.q + 20, CPX.c3 - 30, drift), MY));
      o += A.op(merge, A.enzyme(CPX.c3, MY, {label:"III", sc:.85}));
      o += A.op(pump, `<circle cx="${CPX.c3}" cy="${MY - 130}" r="16" fill="#dbe7fb" stroke="${C.H}" stroke-width="2"/><text x="${CPX.c3}" y="${MY - 125}" font-size="12" font-weight="700" fill="#1f4a9c" text-anchor="middle">H⁺×4</text>`);
    }
    if (idx >= 4 && p(4) > .5) o += `<circle cx="${CPX.cyt}" cy="${MY - 65}" r="16" fill="#fbe8e7" stroke="${RED}" stroke-width="2"/>` + lbl(CPX.cyt, MY - 61, "cyt c", "#7a2e28", 10);
    /* step 5: cytochrome c -> Complex IV */
    const p5 = p(5);
    if (idx >= 5 && p5 > 0){
      const drift = ease(seg(p5, 0, .55)), merge = ease(seg(p5, .55, .85)), pump = ease(seg(p5, .85, 1));
      o += A.op(1 - merge, token("epair", lerp(CPX.cyt, CPX.c4 - 30, drift), MY - lerp(65, 0, drift)));
      o += A.op(merge, A.enzyme(CPX.c4, MY, {label:"IV", sc:.85}));
      o += A.op(pump, `<circle cx="${CPX.c4}" cy="${MY - 130}" r="16" fill="#dbe7fb" stroke="${C.H}" stroke-width="2"/><text x="${CPX.c4}" y="${MY - 125}" font-size="12" font-weight="700" fill="#1f4a9c" text-anchor="middle">H⁺×2</text>`);
    }
    /* ATP synthase always visible once the chain has started */
    if (idx >= 2) o += A.op(ease(seg(p(2), 0, .3)), `<g transform="translate(${CPX.atp},${MY})"><rect x="-18" y="-55" width="36" height="110" rx="14" fill="#e7e9fb" stroke="${BLUE}" stroke-width="2.5"/><circle cx="0" cy="-55" r="22" fill="#c9d0f5" stroke="${BLUE}" stroke-width="2.5"/></g>` + lbl(CPX.atp, MY + 90, "ATP synthase", BLUE, 12));

    /* step 6: final electron acceptor (aerobic O2 -> H2O, or anaerobic alternative) */
    const p6 = p(6);
    if (idx >= 6 && p6 > 0){
      const a = ease(seg(p6, 0, .6));
      o += A.op(a, FINAL.icon(CPX.c4 + 70, MY + 50));
      o += A.op(a, lbl(CPX.c4 + 70, MY + 80, FINAL.arrowLabel, FINAL.color, 12));
    }

    /* step 7: the proton gradient */
    const p7 = p(7);
    if (idx >= 7 && p7 > 0){
      const a = ease(seg(p7, 0, .6));
      o += A.op(a, `<rect x="${MX1}" y="${MY - MH / 2 - 90}" width="${MX2 - MX1}" height="70" rx="14" fill="rgba(63,76,192,.08)"/>`);
      const hs = [CPX.c1, CPX.c3, CPX.c4, 250, 630, 850];
      hs.forEach((x, i) => o += A.op(a, A.hion(x, MY - MH / 2 - 60 - (i % 2) * 20, 13)));
      o += A.op(a, lbl(CX, Y.gradLbl, "High H⁺ concentration outside the membrane →", BLUE, 13));
    }
    /* step 8: ATP synthase close-up + drag H+ through */
    const p8 = p(8);
    if (idx >= 8){
      const zx = CX, zy = Y.atpsyn;
      o += `<rect x="${zx - 260}" y="${zy - 160}" width="520" height="320" rx="20" fill="#fff" stroke="${BLUE}" stroke-width="2"/>`;
      o += lbl(zx, zy - 130, "ATP synthase close-up", BLUE, 14);
      o += lbl(zx, zy - 130 + 220, "Matrix side (low H⁺)", "#5a6376", 12);
      o += lbl(zx, zy - 130 - 20, "Intermembrane space (high H⁺)", "#5a6376", 12);
      o += `<g transform="translate(${zx},${zy})"><rect x="-30" y="-70" width="60" height="140" rx="18" fill="#e7e9fb" stroke="${BLUE}" stroke-width="3"/><circle cx="0" cy="-70" r="30" fill="#c9d0f5" stroke="${BLUE}" stroke-width="3"/></g>`;
    }

    /* step 9: tally this one pass */
    const p9 = p(9);
    if (idx >= 9 && p9 > 0){
      const r = ease(seg(p9, .1, .6));
      o += A.op(r, `<rect x="${CX - 260}" y="${Y.tally - 40}" width="520" height="90" rx="18" fill="#fff" stroke="${GREEN}" stroke-width="2.5"/>`);
      o += A.op(r, lbl(CX, Y.tally - 6, "This one NADH + FADH₂ pass:", "#343b4a", 14));
      o += A.op(r, lbl(CX, Y.tally + 26, "10 H⁺ pumped · 4 ATP made", GREEN, 16));
    }
    /* step 10: the whole-glucose grand total */
    const p10 = p(10);
    if (idx >= 10 && p10 > 0){
      const r = ease(seg(p10, .1, .6));
      o += A.op(r, `<rect x="${CX - 260}" y="${Y.grand - 46}" width="520" height="140" rx="18" fill="#fff" stroke="${FINAL.color}" stroke-width="2.5"/>`);
      o += A.op(r, lbl(CX, Y.grand - 14, "Glycolysis: 2 ATP  ·  Krebs cycle: 2 ATP", "#343b4a", 14));
      o += A.op(r, lbl(CX, Y.grand + 16, "Electron transport chain: ~30–34 ATP", "#343b4a", 14));
      o += A.op(r, lbl(CX, Y.grand + 52, FINAL.key === "anaerobic" ? "Total: usually a bit less than aerobic" : "Total: up to ~34–38 ATP per glucose", FINAL.color, 15));
    }
    /* step 11: where next */
    const p11 = p(11);
    if (idx >= 11 && p11 > 0){
      const r = ease(seg(p11, 0, .6));
      o += A.op(r, `<circle cx="${CX}" cy="${Y.go}" r="34" fill="#fbe8e7" stroke="${RED}" stroke-width="2.5"/>` + lbl(CX, Y.go + 6, "?", RED, 22));
      o += A.op(r, lbl(CX, Y.go + 56, "No final acceptor at all → fermentation", RED, 13));
    }

    return o;
   };
  }

  /* ================= Two variants: Aerobic and Anaerobic ================= */
  const AEROBIC = {
    key:"aerobic", label:"Aerobic (uses O₂)",
    finalTitle:"Oxygen: the final electron acceptor",
    finalText:`At the very end of the chain, {{acceptor}} grabs the spent electrons and picks up H⁺ to form {{product}}. Without something waiting to accept those electrons, the whole chain backs up and stops — that's the entire reason cells need oxygen.`,
    acceptorBL:{show:"oxygen (O₂)", ans:["oxygen","o2"], fuzzy:true},
    productBL:{show:"water (H₂O)", ans:["water","h2o"], fuzzy:true},
    icon:(x, y) => A.o2(x, y) + A.arrow(x - 40, y, x - 10, y, "#3f4cc0", 2),
    arrowLabel:"O₂ + 4H⁺ + 4e⁻ → 2 H₂O",
    color:BLUE,
    introExtra:``
  };
  const ANAEROBIC = {
    key:"anaerobic", label:"Anaerobic (no O₂)",
    finalTitle:"A different final electron acceptor",
    finalText:`Some cells have no oxygen available, so a different molecule waits at the end of the chain instead — here, {{acceptor}}, which becomes {{product}}. The chain, the proton gradient, and ATP synthase all work exactly the same way; only the very last handoff changes.`,
    acceptorBL:{show:"nitrate (NO₃⁻)", ans:["nitrate","no3"], fuzzy:true},
    productBL:{show:"nitrite (NO₂⁻)", ans:["nitrite","no2"], fuzzy:true},
    icon:(x, y) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="14" fill="#8e5bd0"/><text x="${f1(x)}" y="${f1(y + 4)}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">NO₃⁻</text>`,
    arrowLabel:"NO₃⁻ + 2H⁺ + 2e⁻ → NO₂⁻ + H₂O",
    color:"#8e5bd0",
    introExtra:`<p><b>This is anaerobic respiration</b>: it uses the same electron transport chain, the same Krebs cycle, and the same ATP synthase as aerobic respiration — the only difference is which molecule waits at the very end of the chain to accept electrons. No oxygen required, though the energy payoff is usually a bit smaller, since most alternative acceptors don't pull electrons down as strong an energy drop as oxygen does.</p>`
  };

  function buildVariant(FINAL){
    const STEPS = [
      {focusY:Y.top, animMs:900,
       pop:{y:Y.top, x:700, title:FINAL.key === "anaerobic" ? "Anaerobic respiration" : "The electron transport chain",
         text: FINAL.key === "anaerobic"
           ? `${FINAL.introExtra}<p>NADH and FADH₂ arrive from glycolysis and the Krebs cycle, ready to hand off their electrons in the {{innermembrane}} (bacteria: the plasma membrane).</p>`
           : `NADH and FADH₂ arrive from glycolysis and the Krebs cycle, carrying electrons collected all through respiration. They deliver those electrons here, in the {{innermembrane}} (bacteria: the plasma membrane).`}},
      {focusY:Y.redox, animMs:1600,
       action:{type:"click", at:[CX, Y.redox], button:"See the electrons move!", label:"Click to watch an electron transfer."},
       pop:{y:Y.redox, x:700, title:"A quick refresher: redox",
         text:`Every handoff in this chain is a redox reaction. The molecule that gives up electrons is {{oxidized}}; the one that accepts them is {{reduced}}. NADH and FADH₂ are about to be oxidized, one handoff at a time, all the way down this chain.`}},
      {focusY:MY, animMs:1900, tally:{h:4},
       action:{type:"drag", token:"NADH", count:1, from:[[CPX.c1, Y.top]], targets:[[CPX.c1, MY]], label:"Drag NADH to Complex I."},
       pop:{y:CARDY.c1, x:700, title:"Complex I: the first big drop", more:"whyfewer",
         text:`NADH is oxidized back to {{nadplus2}} — which recycles right back to glycolysis and the Krebs cycle — while Complex I is reduced as it accepts those electrons. The energy released pumps H⁺ across the membrane. Complex I (and III and IV) are studded with {{iron}}-sulfur clusters, another reason dietary iron matters for energy metabolism.`}},
      {focusY:MY, animMs:1900, tally:{h:0},
       action:{type:"drag", token:"FADH2", count:1, from:[[CPX.c2, Y.top]], targets:[[CPX.c2, MY]], label:"Drag FADH₂ to Complex II."},
       pop:{y:CARDY.c2, x:700, title:"Complex II: a smaller drop", more:"whyfewer",
         text:`FADH₂'s electrons enter here at a lower energy point than NADH's did, so Complex II hands them into the chain without pumping any H⁺ at all. That's the mechanical reason each FADH₂ ends up worth less ATP than each NADH.`}},
      {focusY:MY - 60, animMs:1800, tally:{h:4},
       action:{type:"drag", token:"epair", count:1, from:[[CPX.q, MY]], targets:[[CPX.c3, MY]], label:"Drag the electron pair from Q to Complex III."},
       pop:{y:CARDY.q3, x:700, title:"Moving electrons: Q to Complex III",
         text:`Ubiquinone (Q) is a small, mobile carrier that shuttles electrons from Complexes I and II over to Complex III — you just moved them yourself. Complex III passes the electrons on and pumps more H⁺ across the membrane.`}},
      {focusY:MY - 60, animMs:1800, tally:{h:2},
       action:{type:"drag", token:"epair", count:1, from:[[CPX.cyt, MY - 65]], targets:[[CPX.c4, MY]], label:"Drag the electron from cytochrome c to Complex IV."},
       pop:{y:CARDY.cytiv, x:700, title:"Moving electrons: cytochrome c to Complex IV", more:"cytc",
         text:`Cytochrome c is another mobile carrier, ferrying one electron at a time along the outer face of the membrane to Complex IV — the last stop before the electrons are handed off for good.`}},
      {focusY:MY + 60, animMs:1600,
       action:{type:"click", at:[CPX.c4 + 70, MY + 50], button:`Combine with ${FINAL.acceptorBL.show}`, label:`Click to complete the handoff to ${FINAL.acceptorBL.show}.`},
       pop:{y:CARDY.final, x:700, title:FINAL.finalTitle, more:FINAL.key === "aerobic" ? "poisons" : "altacceptors",
         text:FINAL.finalText}},
      {focusY:CARDY.gradient, animMs:1900,
       action:{type:"click", at:[CX, CARDY.gradient - 60], button:"See the gradient", label:"Click to see the H⁺ that's built up."},
       pop:{y:CARDY.gradient, x:700, title:"Chemiosmosis: storing the energy",
         text:`Every proton pumped across the membrane adds to a {{gradient}} — more H⁺ (and more positive charge) outside than in. That gradient is potential energy, like water held behind a dam, and it's the real product of everything the chain has done so far.`}},
      {focusY:Y.atpsyn, animMs:2200, tally:{made:4},
       action:{type:"drag", token:"H", count:4, from:tok(CX - 180, Y.atpsyn - 260, Y.atpsyn - 200).concat(tok(CX - 60, Y.atpsyn - 260, Y.atpsyn - 200)), targets:[[CX - 45, Y.atpsyn], [CX - 15, Y.atpsyn], [CX + 15, Y.atpsyn], [CX + 45, Y.atpsyn]], r:40, label:"Drag each H⁺ through ATP synthase."},
       pop:{y:Y.atpsyn + 100, x:700, title:"ATP synthase: the payoff", more:"motor",
         text:`As H⁺ flows back down its gradient, back into the matrix, it spins {{atpsynthase}} like a tiny turbine. Each full turn presses ADP and phosphate together to make ATP — this whole process is called {{chemiosmosis}}.`}},
      {focusY:Y.tally, animMs:1800,
       action:{type:"click", at:[CX, Y.tally - 60], button:"Add it up", label:"Tally this pass through the chain."},
       pop:{y:Y.tally, x:700, title:"One NADH and one FADH₂, tallied",
         text:`Multiply this by every NADH and FADH₂ made across glycolysis and the Krebs cycle, and the electron transport chain accounts for roughly 30–34 of a cell's ATP per glucose — by far the largest share.`}},
      {focusY:Y.grand, animMs:2000,
       action:{type:"click", at:[CX, Y.grand - 60], button:"See the whole picture", label:"See the full glucose total."},
       pop:{y:Y.grand, x:700, title:"The whole point of respiration",
         text:`Glycolysis: 2 ATP. Krebs cycle: 2 ATP. Electron transport chain and ATP synthase: the rest — up to roughly 34–38 ATP total per glucose${FINAL.key === "anaerobic" ? ", usually a bit less here since the final acceptor isn't oxygen" : ""}. Nearly everything upstream exists to load electron carriers for this last stage.`}},
      {focusY:Y.go, animMs:1500,
       action:{type:"click", at:[CX, Y.go - 40], button:"What if there's no acceptor at all?", label:"See what happens without any final acceptor."},
       pop:{y:Y.go, x:700, title:"Electron transport chain summarized",
         text:`<i>"NADH and FADH₂ deliver electrons to a chain of protein complexes, which pump H⁺ across the membrane. That H⁺ gradient drives ATP synthase, making most of the cell's ATP."</i> But what happens when there's no acceptor — not even an alternative one — waiting at the end?`}}
    ];
    return {title:`Electron Transport Chain: ${FINAL.label}`, page:"etc.html", H, BL:{...BL, acceptor:FINAL.acceptorBL, product:FINAL.productBL}, MORE, steps:STEPS,
      draw:makeDraw(FINAL), token,
      intro:`The chain sits in the membrane, laid out left to right. Move NADH, FADH₂ and electrons down the chain, then move H⁺ back through ATP synthase to make ATP.`,
      tally:[["h", "H⁺ pumped", BLUE], ["made", "ATP made", GREEN]],
      endTitle:"You built the electron transport chain!", endText:"The chain moved electrons, pumped H⁺, and used that gradient to make ATP — most of the cell's energy payoff. Tap any marker to review a step.",
      next:[["Fermentation & Anaerobic Respiration →", "fermentation.html"], ["Try it in the lab: " + (FINAL.key === "anaerobic" ? "the nitrate reduction test →" : "the oxidase test →"), "id-tests.html#" + (FINAL.key === "anaerobic" ? "nitrate" : "oxidase")], ["Big picture: respiration overview", "respiration-overview.html"], ["All modules", "index.html"]]};
  }

  const VARIANTS = [{key:"aerobic", label:"Aerobic (O₂)"}, {key:"anaerobic", label:"Anaerobic (alt. acceptor)"}];
  function render(variant, mode){
    const cfg = buildVariant(variant === "anaerobic" ? ANAEROBIC : AEROBIC);
    cfg.variant = variant; cfg.variants = VARIANTS; cfg.mode = mode;
    cfg.onVariant = v => {
      const m = window.__pw ? window.__pw.mode : "learn";
      try { localStorage.setItem("bio112-etc-variant", v); } catch (e) {}
      render(v, m);
    };
    Pathway.start(cfg);
  }
  let startVariant = "aerobic";
  try { startVariant = localStorage.getItem("bio112-etc-variant") || "aerobic"; } catch (e) {}
  render(startVariant);
})();
</script>
<script src="studypath.js"></script>
</body>
</html>
