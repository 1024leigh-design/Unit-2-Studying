<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electron Transport Chain & ATP Synthase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script src="games.js"></script>
<script src="pathway.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, lerp, clamp, smooth, seg, C} = A;
  const ease = smooth, GREEN = "#1b7f4e", RED = "#b83a34", BLUE = "#3f4cc0", AMBER = "#a8760f", WATER = "#2f7fbf", VIOLET = "#8e5bd0";
  const lbl = (x, y, s, fill, size, anchor) => `<text x="${f1(x)}" y="${f1(y)}" font-size="${size || 13}" font-weight="700" fill="${fill || "#5a6376"}" text-anchor="${anchor || "middle"}">${s}</text>`;
  /* shared molecule art (metab.js), so H⁺, O₂ and nitrate look the same on every page */
  const hion = (x, y, r) => A.hion(x, y, r || 13);
  const epair = (x, y) => A.eDot(x - 10, y, 9) + A.eDot(x + 10, y, 9);
  const o2tok = (x, y) => A.o2(x, y, 13);
  const no3tok = (x, y) => A.no3(x, y);
  const no2tok = (x, y) => A.no2(x, y);
  const h2otok = (x, y) => A.h2o(x, y - 2);

  function token(kind, x, y){
    if (kind === "NADH") return A.carrier(x, y, "NAD", true);
    if (kind === "FADH2") return A.carrier(x, y, "FAD", true);
    if (kind === "epair") return epair(x, y);
    if (kind === "H") return hion(x, y, 15);
    if (kind === "O2") return o2tok(x, y);
    if (kind === "NO3") return no3tok(x, y);
    return "";
  }

  /* ================= Blanks & Learn More, shared by both variants ================= */
  const BL = {
    innermembrane:{show:"inner mitochondrial membrane", ans:["innermitochondrialmembrane","innermembrane"], fuzzy:true},
    oxidized:{show:"oxidized", ans:["oxidized","oxidation"], fuzzy:true},
    reduced:{show:"reduced", ans:["reduced","reduction"], fuzzy:true},
    nadplus2:{show:"NAD⁺", ans:["nad","nadplus"]},
    chemiosmosis:{show:"chemiosmosis", ans:["chemiosmosis"], fuzzy:true},
    gradient:{show:"concentration gradient", ans:["concentrationgradient","gradient","electrochemicalgradient"], fuzzy:true},
    atpsynthase:{show:"ATP synthase", ans:["atpsynthase","atpsynthetase"], fuzzy:true}
  };
  const MORE = {
    whyfewer:{title:"Why FADH₂ is worth less than NADH", html:`<p>Complex I sits at a big energy drop: NADH's electrons have a lot of potential energy to give up, enough to pump protons right away. FADH₂'s electrons enter at Complex II, already partway down the energy hill, so they never trigger Complex I's pump. That's the whole reason textbooks count roughly 2.5 ATP per NADH but only about 1.5 ATP per FADH₂ (often rounded to 3 and 2).</p>`},
    cytc:{title:"Cytochrome c's second job", html:`<p>Cytochrome c doesn't just ferry electrons. When a cell is damaged beyond repair, it can be released from the mitochondrion into the rest of the cell, where it helps trigger apoptosis (programmed cell death). One small protein, two very different jobs.</p>`},
    motor:{title:"A real rotary motor", html:`<p>ATP synthase is an actual mechanical motor: protons flowing through it spin a rotor at thousands of RPM, and that spinning physically squeezes ADP and phosphate together. Peter Mitchell won the 1978 Nobel Prize in Chemistry for figuring out this chemiosmotic mechanism. At the time, it was a wildly controversial idea.</p>`},
    poisons:{title:"How some poisons work", html:`<p>Cyanide and carbon monoxide both work by jamming Complex IV shut, so electrons can't be handed off to the final acceptor. The whole chain backs up almost instantly, protons stop being pumped, and ATP production collapses, which is why they're so fast-acting and dangerous.</p>`},
    altacceptors:{title:"Other final electron acceptors", html:`<p>Different microbes use different final acceptors depending on what's available: nitrate (denitrifying bacteria, forming nitrite or N₂ gas), sulfate (forming the rotten-egg smell of hydrogen sulfide), and even iron or fumarate. Whichever one is used, the same basic chain and the same ATP synthase are doing the work.</p>`},
    iron:{title:"Iron makes the chain work", html:`<p>The proteins in the chain pass electrons along using <b>iron</b>: iron-sulfur clusters and heme groups, the same kind of iron that colors your blood red. Each iron atom can take an electron and hand it on (a redox reaction).</p><p>That's one more reason dietary iron matters: without enough of it, this chain, and the ATP it makes, slows down.</p>`},
    coq10:{title:"That supplement aisle name", html:`<p>Ubiquinone is also called coenzyme Q10, yes, the same CoQ10 sold as a supplement. Your cells already make their own; the supplement's real-world benefit is much less dramatic than the marketing suggests.</p>`}
  };

  /* ================= Board layout =================
     The membrane runs left to right. The whole chain fits in the left 640 units, so the explanation
     cards (x = 650) sit in their own column and never cover the pathway. */
  const H = 1800, CARDX = 650;
  const MY = 420, MH = 110, MT = MY - MH / 2, MB = MY + MH / 2;
  const IMS_TOP = 36, MATRIX_BOT = 762;
  const POS = {c1:88, c2:186, q:252, c3:332, cyt:412, c4:476, atp:578};
  const NADHP = [96, 548], FADP = [196, 548];
  const CYT_Y = 290;
  const Y = {tally:1360, grand:1520, go:1700};
  const CARDY = [220, 275, 330, 390, 450, 510, 570, 630, 1000, 1110, Y.tally, Y.grand, Y.go];
  const PANEL = {x:20, y:770, w:600, h:440};
  const COL = {c1:["#7c8be8", "#3e4aa8"], c2:["#eab04d", "#a8760f"], c3:["#5fbd9c", "#1f7f66"], c4:["#e78a80", "#a8372f"]};
  const CP = [{k:"c1", x:POS.c1, w:96, h:150, lab:"I"}, {k:"c2", x:POS.c2, w:56, h:128, lab:"II"}, {k:"c3", x:POS.c3, w:76, h:140, lab:"III"}, {k:"c4", x:POS.c4, w:64, h:128, lab:"IV"}];
  const STEP_OF = {c1:2, c2:3, c3:4, c4:5};

  /* where each pumped H+ comes to rest in the intermembrane space (16 in all: 4 + 8 + 4) */
  const SLOT = {
    c1:j => [POS.c1 - 42 + j * 28, MT - 30],
    c3:j => [POS.c3 - 45 + (j % 4) * 30, MT - 40 - Math.floor(j / 4) * 28],
    c4:j => [POS.c4 - 42 + j * 28, MT - 40]
  };
  const MATRIX_H = [[236, 566], [304, 612], [372, 562]];
  const DOWN = (x, y1, y2) => A.arrow(x, y1, x, y2, "#8a93a3", 3);

  /* ---- ATP synthase close-up geometry ---- */
  const RX = 290, RR = 40, RING_T = 907, RING_B = 1023;
  const HEAD = {x:RX, y:1122};
  const POOL = [];
  for (let i = 0; i < 8; i++) POOL.push([58 + i * 36, i % 2 ? 884 : 850]);
  [412, 468, 522, 574].forEach(x => POOL.push([x, 867]));
  const DRAGS = [[440, 850], [495, 884], [550, 850], [596, 884]];
  const MOUTH = [381, 884];
  const IONPATH = [MOUTH, [381, 950], [340, 968], [330, 986], [346, 1004], [349, 1032], [349, 1088]];
  function onPath(pts, u){
    const L = []; let tot = 0;
    for (let i = 0; i < pts.length - 1; i++){ const d = Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]); L.push(d); tot += d; }
    let s = clamp(u, 0, 1) * tot;
    for (let i = 0; i < L.length; i++){ if (s <= L[i] || i === L.length - 1){ const k = L[i] ? clamp(s / L[i], 0, 1) : 0; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; } s -= L[i]; }
    return pts[pts.length - 1];
  }

  /* ---- shapes ---- */
  /* each complex is a union of rounded blocks: outline pass, then fill pass, so the blocks read as one protein */
  const SHAPE = {
    c1:x => [[x - 48, MY - 54, 96, 100, 20], [x + 2, MY + 20, 46, 88, 20]],
    c2:x => [[x - 24, MY - 30, 48, 62, 14], [x - 30, MY + 12, 60, 62, 24]],
    c3:x => [[x - 38, MY - 62, 76, 128, 22], [x - 32, MY - 82, 28, 44, 12], [x + 4, MY - 82, 28, 44, 12]],
    c4:x => [[x - 32, MY - 56, 64, 112, 20], [x - 24, MY - 76, 48, 40, 14]]
  };
  function complex(k, x, w, h, lab, glow){
    const [fill, edge] = COL[k], parts = SHAPE[k](x);
    let s = "";
    if (glow > 0) parts.forEach(q => s += `<rect x="${f1(q[0] - 9)}" y="${f1(q[1] - 9)}" width="${q[2] + 18}" height="${q[3] + 18}" rx="${q[4] + 8}" fill="#f2b134" opacity="${f1(.4 * glow)}"/>`);
    parts.forEach(q => s += `<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="${q[4]}" fill="${edge}" stroke="${edge}" stroke-width="6"/>`);
    parts.forEach(q => s += `<rect x="${q[0]}" y="${q[1]}" width="${q[2]}" height="${q[3]}" rx="${q[4]}" fill="${fill}"/>`);
    const m = parts[0];
    s += `<rect x="${f1(m[0] + 8)}" y="${f1(m[1] + 8)}" width="${f1(m[2] * .32)}" height="${f1(m[3] * .3)}" rx="9" fill="#fff" opacity=".22"/>`;
    s += `<text x="${f1(x)}" y="${f1(MY + 8)}" font-size="${lab.length > 2 ? 22 : 26}" font-weight="800" fill="#fff" text-anchor="middle">${lab}</text>`;
    return s;
  }
  /* the F1 head seen from the side: six subunits like orange segments (alpha pale, beta gold).
     The stalk turns inside it, and the beta subunit that is squeezing ADP + Pi together glows. */
  function f1Head(cx, cy, rx, ry, active, squeeze){
    const seg = [];
    for (let k = 0; k < 6; k++){ const ph = (-75 + k * 30) * Math.PI / 180; seg.push({k, x:cx + rx * .86 * Math.sin(ph), w:rx * .3 * (.45 + .55 * Math.cos(ph)), d:Math.cos(ph)}); }
    let s = `<ellipse cx="${f1(cx)}" cy="${f1(cy)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="#f6d28a" stroke="#c98a0e" stroke-width="2.5"/>`;
    seg.sort((a, b) => a.d - b.d).forEach(g => {
      const beta = g.k % 2 === 1, on = beta && g.k === active, sq = on ? 1 - .14 * squeeze : 1;
      s += `<ellipse cx="${f1(g.x)}" cy="${f1(cy)}" rx="${f1(g.w * sq)}" ry="${f1(ry * .92)}" fill="${on && squeeze > .1 ? "#f0a030" : beta ? "#f2c060" : "#fbe6b8"}" stroke="#c98a0e" stroke-width="1.8"/>`;
    });
    return s;
  }
  function mobile(x, y, lab, r, fill, edge, tcol, size){
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${edge}" stroke-width="2.5"/>` + lbl(x, y + 4.5, lab, tcol, size);
  }
  /* ATP synthase as it sits in the membrane on the main board */
  function atpMain(x, glow){
    let s = "";
    if (glow > 0) s += `<rect x="${x - 40}" y="${MT - 22}" width="80" height="${MB - MT + 124}" rx="30" fill="#f2b134" opacity="${f1(.4 * glow)}"/>`;
    s += `<rect x="${x + 22}" y="${MB - 4}" width="9" height="62" rx="4" fill="#9aa7ee" stroke="${BLUE}" stroke-width="1.5"/>`;
    s += `<rect x="${x - 26}" y="${MT - 10}" width="52" height="${MB - MT + 20}" rx="14" fill="#c9d0f5" stroke="${BLUE}" stroke-width="3"/>`;
    [-14, 0, 14].forEach(dx => s += `<rect x="${x + dx - 4}" y="${MT + 2}" width="8" height="${MB - MT - 4}" rx="4" fill="#8e9bf0" opacity=".7"/>`);
    s += `<rect x="${x - 4}" y="${MB + 8}" width="8" height="30" fill="#2b3a9e"/>`;
    s += f1Head(x, MB + 56, 40, 26, -1, 0);
    return s;
  }
  function eq(x, y, parts, o){
    const n = parts.reduce((a, q) => a + q[0].length, 0), w = n * 9.4 + 40;
    return A.op(o, `<rect x="${f1(x - w / 2)}" y="${y - 28}" width="${f1(w)}" height="56" rx="18" fill="#fff" stroke="#8a93a3" stroke-width="2"/>` +
      `<text x="${x}" y="${y + 6}" font-size="18" font-weight="800" text-anchor="middle">${parts.map(q => `<tspan fill="${q[1]}">${q[0]}</tspan>`).join("")}</text>`);
  }

  /* ---- the zoomed-in ATP synthase (c-ring rotor, a-subunit channel, spinning stalk, F1 head) ---- */
  function cring(th){
    const items = [];
    for (let i = 0; i < 8; i++){ const a = (th + i * 45) * Math.PI / 180; items.push({i, d:Math.cos(a), x:RX + RR * Math.sin(a)}); }
    items.sort((p, q) => p.d - q.d);
    let s = `<rect x="${RX - RR - 5}" y="${RING_T - 3}" width="${2 * RR + 10}" height="${RING_B - RING_T + 6}" rx="18" fill="#e7eafc" stroke="${BLUE}" stroke-width="2"/>`;
    items.forEach(it => {
      if (it.d < -.4) return;
      const w = 6 + 15 * Math.max(0, it.d), fill = it.i === 0 ? "#2b3a9e" : it.d > .3 ? "#6e7fe0" : "#a4b0f0";
      s += `<rect x="${f1(it.x - w / 2)}" y="${RING_T}" width="${f1(w)}" height="${RING_B - RING_T}" rx="7" fill="${fill}" stroke="#3f4cc0" stroke-width="1.6"/>`;
    });
    return s;
  }
  function closeUp(c, S, BASIC){
    const {t, idx, phase, prog} = c;
    const fade = clamp((t - S.t8) / .6, 0, 1);
    let o = "";
    const px = PANEL.x, py = PANEL.y;
    o += `<rect x="${px}" y="${py}" width="${PANEL.w}" height="${PANEL.h}" rx="20" fill="#fff" stroke="${BLUE}" stroke-width="2.5"/>`;
    o += lbl(px + PANEL.w / 2, py + 26, "Zoom in: ATP synthase", BLUE, 16);
    o += `<rect x="${px + 2}" y="${py + 38}" width="${PANEL.w - 4}" height="109" fill="#e8eefb"/>`;
    o += lbl(px + 16, py + 62, "Intermembrane space: lots of H⁺", "#5a6376", 13, "start");
    o += A.membrane(px + 2, px + PANEL.w - 2, 965, 100);
    o += `<rect x="${px + 2}" y="1015" width="${PANEL.w - 4}" height="170" fill="#fbf6ee"/>`;
    o += lbl(px + 16, 1176, "Matrix: few H⁺", "#5a6376", 13, "start");
    /* the stator: a-subunit with its two half-channels, and the b arm that holds F1 still */
    o += `<path d="M396,1025 L396,1088 Q396,1112 352,1114" fill="none" stroke="#9aa7ee" stroke-width="11" stroke-linecap="round"/>`;
    o += `<rect x="336" y="905" width="70" height="120" rx="12" fill="#c9d0f5" stroke="${BLUE}" stroke-width="2.5"/>`;
    o += `<path d="M381,905 L381,950 L338,968" fill="none" stroke="#eaf1ff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>`;
    o += `<path d="M338,984 L349,1002 L349,1025" fill="none" stroke="#eaf1ff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>`;
    /* F1 head: three lobes, the left one is where ADP + Pi get squeezed into ATP */
    const ang = S.angle, cyc = Math.min(3, Math.floor(ang / 120 - 1e-9)), fr = clamp((ang - cyc * 120) / 120, 0, 1);
    const squeeze = clamp(1 - Math.abs(fr - .5) / .22, 0, 1);
    o += f1Head(HEAD.x, HEAD.y - 6, 82, 50, [1, 3, 5][cyc % 3], squeeze);
    /* the spinning stalk, drawn as a twisting rod so you can see it turn */
    const off = 7 * Math.sin(ang * Math.PI / 180), off2 = 7 * Math.sin((ang + 90) * Math.PI / 180);
    o += `<path d="M${RX},${RING_B - 4} L${f1(RX + off)},${RING_B + 26} L${f1(RX - off2)},${RING_B + 54} L${f1(RX + off)},${RING_B + 84} L${RX},${HEAD.y - 4}" fill="none" stroke="#2b3a9e" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>`;
    o += cring(ang);
    /* ADP + Pi in, ATP out */
    const adpX = lerp(70, 160, ease(seg(fr, 0, .4))), atpX = lerp(162, 70, ease(seg(fr, .66, 1)));
    if (fr < .66) o += `<rect x="${f1(adpX - 46)}" y="${HEAD.y - 1}" width="92" height="26" rx="13" fill="#fff" stroke="${VIOLET}" stroke-width="2.5"/>` + lbl(adpX, HEAD.y + 17, "ADP + Pᵢ", "#5b3fb0", 13);
    if (fr > .5 && ang > 60) o += A.pill(atpX, HEAD.y + 12, "ATP", VIOLET, ease(seg(fr, .5, .66)), 14);
    /* labels */
    if (BASIC){
      /* two parts: the rotor that H+ spins, and the head that builds ATP */
      o += `<path d="M196,930 L180,930 L180,1080 L196,1080" fill="none" stroke="#3f4cc0" stroke-width="2.5"/>` + `<path d="M${RX - RR - 6},955 L196,955 M${RX - 4},1058 L196,1058" stroke="#3f4cc0" stroke-width="2" stroke-dasharray="4 3"/>`;
      o += A.pill(108, 1005, "Rotor: H⁺ spins it", "#3f4cc0", 1, 13);
      o += A.pill(498, 1135, "Head: builds ATP", "#c98a0e", 1, 13) + `<path d="M${HEAD.x + 84},1130 L${HEAD.x + 132},1133" stroke="#c98a0e" stroke-width="2" stroke-dasharray="4 3"/>`;
    } else {
      o += A.pill(128, 955, "c-ring: the rotor", "#3f4cc0", 1, 13) + `<path d="M${RX - RR - 6},955 L190,955" stroke="#3f4cc0" stroke-width="2" stroke-dasharray="4 3"/>`;
      o += A.pill(128, 1058, "γ stalk: spins", "#2b3a9e", 1, 13) + `<path d="M${RX - 4},1058 L190,1058" stroke="#2b3a9e" stroke-width="2" stroke-dasharray="4 3"/>`;
      o += A.pill(505, 965, "a: stator + H⁺ channel", "#3f4cc0", 1, 13) + `<path d="M406,965 L428,965" stroke="#3f4cc0" stroke-width="2" stroke-dasharray="4 3"/>`;
      o += A.pill(502, 1060, "b: stator arm", "#6b78d6", 1, 13) + `<path d="M401,1060 L424,1060" stroke="#6b78d6" stroke-width="2" stroke-dasharray="4 3"/>`;
      o += A.pill(498, 1135, "F₁ head: makes ATP", "#c98a0e", 1, 13) + `<path d="M${HEAD.x + 84},1130 L${HEAD.x + 116},1133" stroke="#c98a0e" stroke-width="2" stroke-dasharray="4 3"/>`;
    }
    o += lbl(px + PANEL.w - 16, 1199, `ATP made here: <tspan fill="${GREEN}">${S.made}</tspan>`, "#343b4a", 14, "end");
    o += lbl(px + 16, 1199, "Rotor spin ↻", "#5a6376", 13, "start");
    return A.op(fade, o);
  }

  function makeDraw(FINAL, MAP){
   const S = {t8:0, ion8:[], angle:0, made:0}, BASIC = !!MAP;
   return function draw(c){
    const {phase, t} = c;
    /* MAP[step] = the full-pathway stages that step plays, with the share of its animation each gets.
       Without a MAP every step is one stage. */
    let idx = c.idx, prog = c.prog;
    if (MAP){
      const cur = MAP[c.idx], P = c.prog(c.idx);
      const where = {}; MAP.forEach((g, si) => { let a = 0; g.forEach(([st, w]) => { where[st] = [si, a, w]; a += w; }); });
      prog = st => { const q = where[st]; if (!q) return c.idx > MAP.findIndex(g => g.some(x => x[0] > st)) ? 1 : 0; if (q[0] < c.idx) return 1; if (q[0] > c.idx) return 0; return clamp((P - q[1]) / q[2], 0, 1); };
      idx = cur[0][0]; cur.forEach(([st]) => { if (prog(st) > 0) idx = st; });
    }
    if (idx < 8){ S.t8 = 0; S.ion8.length = 0; }
    const p = i => prog(i), e = i => ease(p(i));
    let o = "";

    /* ---------- how much of the pumped gradient has flowed back (for fading the pool) ---------- */
    let flowed = 0;
    if (BASIC && idx === 9) flowed = 16 * e(9);
    else if (idx === 8) flowed = phase === "act" ? c.placed : Math.min(4, S.ion8.filter(s => t - s > .8).length);
    else if (idx === 9) flowed = 4 + 12 * e(9);
    else if (idx > 9) flowed = 16;
    const ionA = k => clamp(k + 1 - flowed, 0, 1);

    /* ---------- bands and membrane ---------- */
    o += `<rect x="0" y="${IMS_TOP}" width="1000" height="${MT - IMS_TOP}" fill="#e8eefb"/>`;
    o += `<rect x="0" y="${MB}" width="1000" height="${MATRIX_BOT - MB}" fill="#fbf6ee"/>`;
    o += A.membrane(0, 1000, MY, MH);
    o += lbl(20, IMS_TOP + 30, "Intermembrane space (bacteria: outside the plasma membrane)", "#5a6376", 13, "start");
    o += lbl(20, MATRIX_BOT - 12, "Matrix (bacteria: cytoplasm)", "#5a6376", 13, "start");

    /* ---------- the zoom beam to the close-up, drawn behind everything ---------- */
    if (idx >= 8) o += `<path d="M${POS.atp - 40},${MB + 40} L${PANEL.x + 540},${PANEL.y} M${POS.atp + 40},${MB + 40} L${PANEL.x + PANEL.w - 6},${PANEL.y}" stroke="${BLUE}" stroke-width="2.5" stroke-dasharray="7 6" fill="none" opacity=".6"/><ellipse cx="${POS.atp}" cy="${MY + 50}" rx="46" ry="108" fill="none" stroke="${BLUE}" stroke-width="2.5" stroke-dasharray="7 6"/>`;

    /* ---------- every enzyme is already in the membrane ---------- */
    const pulse = k => { const i = STEP_OF[k]; if (idx !== i || phase !== "anim") return 0; const u = p(i); return u > .12 && u < .95 ? .55 + .45 * Math.sin(t * 7) : 0; };
    CP.forEach(q => o += complex(q.k, q.x, q.w, q.h, q.lab, pulse(q.k)));
    o += mobile(POS.q, MY, "Q", 20, "#f6e7c4", "#c9a15a", "#6b4b1f", 15);
    o += mobile(POS.cyt, CYT_Y, "cyt c", 22, "#fbe8e7", RED, "#7a2e28", 11);
    o += `<path d="M${POS.cyt},${CYT_Y + 22} L${POS.cyt},${MT - 4}" stroke="${RED}" stroke-width="2" stroke-dasharray="3 3"/>`;
    o += atpMain(POS.atp, idx === 8 || idx === 9 ? .5 + .5 * Math.sin(t * 4) : 0);
    o += lbl(POS.atp, MT - 66, "ATP", BLUE, 13) + lbl(POS.atp, MT - 50, "synthase", BLUE, 13);
    MATRIX_H.forEach(([x, y]) => o += hion(x + 2 * Math.sin(t * 1.7 + x), y + 3 * Math.cos(t * 1.3 + y), 13));
    o += lbl(300, MB + 164, "(a few H⁺ here)", "#8a93a3", 12);

    /* ---------- step 0: NADH and FADH2 are waiting in the matrix, right beside Complexes I and II ---------- */
    const g0 = e(0);
    /* during the drag the engine draws the carrier itself, so the resting copy is hidden */
    const nadhHere = idx < 2, fadhHere = idx < 3;
    if (nadhHere) o += A.op(g0, A.carrier(NADHP[0], NADHP[1], "NAD", true));
    if (fadhHere) o += A.op(g0, A.carrier(FADP[0], FADP[1], "FAD", true));
    o += A.op(g0, lbl(150, MB + 116, "From glycolysis and the Krebs cycle", "#343b4a", 13));

    /* ---------- step 1: a quick redox demo ---------- */
    const p1 = p(1);
    if (idx === 1 && p1 > 0){
      const u = ease(seg(p1, .15, .7)), done = u > .96;
      o += `<rect x="40" y="170" width="560" height="120" rx="18" fill="#fff" stroke="#8a93a3" stroke-width="2"/>`;
      o += A.carrier(130, 215, "NAD", u < .5);
      o += `<rect x="410" y="199" width="130" height="32" rx="16" fill="#fff" stroke="#8a93a3" stroke-width="2.5"/>` + lbl(475, 220, "next carrier", "#5a6376", 13);
      o += A.arrow(200, 215, 400, 215, "#8a93a3", 3);
      if (u > 0 && u < 1) o += A.eDot(lerp(180, 430, u), 215 - 16 * Math.sin(u * Math.PI), 10);
      if (done) o += A.eDot(535, 200, 9);
      o += lbl(130, 262, "OXIDIZED: lost e⁻", RED, 14) + lbl(475, 262, done ? "REDUCED: gained e⁻" : "", GREEN, 14);
    }

    /* ---------- helpers for the pump animations ---------- */
    const pump = (key, n, pp, k0) => {
      let s = "";
      for (let j = 0; j < n; j++){
        const st = j / n * .5, u = ease(seg(pp, st, st + .5));
        if (u <= 0) continue;
        const [sx, sy] = SLOT[key](j), bob = u >= 1 ? 2.2 * Math.sin(t * 2.4 + k0 + j) : 0;
        s += A.op(Math.min(1, u * 6) * ionA(k0 + j), hion(sx, lerp(MB + 34, sy, u) + bob, 13));
      }
      return s;
    };
    const arrowsUp = (x, pp) => pp > 0 && pp < 1 ? A.op(Math.sin(pp * Math.PI), `<path d="M${x - 8},${MT - 8} l8,-14 l8,14 M${x - 8},${MT + 14} l8,-14 l8,14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`) : "";

    /* ---------- step 2: NADH gives its electrons to Complex I ---------- */
    const p2 = p(2);
    if (idx >= 2 && p2 > 0){
      const a = ease(seg(p2, 0, .3)), b = ease(seg(p2, .3, .85)), hop = ease(seg(p2, .35, .75));
      if (p2 < .3) o += A.carrier(lerp(NADHP[0], POS.c1, a), lerp(NADHP[1], MB + 16, a), "NAD", true);
      else o += A.carrier(lerp(POS.c1, 66, b), lerp(MB + 16, 626, b), "NAD", false);
      if (hop < 1) o += epair(lerp(POS.c1 + 20, POS.q - 6, hop), MY - 30 - 14 * Math.sin(hop * Math.PI));
      o += arrowsUp(POS.c1, seg(p2, .35, 1));
      o += pump("c1", 4, seg(p2, .35, 1), 0);
      o += A.op(b, lbl(66, 654, "recycled", GREEN, 12));
    }
    /* the pair waiting at Q (top spot) until it is moved on in step 4 */
    if ((idx === 2 && p2 > .75) || idx === 3) o += epair(POS.q - 6, MY - 28);

    /* ---------- step 3: FADH2 gives its electrons to Complex II ---------- */
    const p3 = p(3);
    if (idx >= 3 && p3 > 0){
      const a = ease(seg(p3, 0, .3)), b = ease(seg(p3, .3, .85)), hop = ease(seg(p3, .35, .75));
      if (p3 < .3) o += A.carrier(lerp(FADP[0], POS.c2, a), lerp(FADP[1], MB + 16, a), "FAD", true);
      else o += A.carrier(lerp(POS.c2, 196, b), lerp(MB + 16, 626, b), "FAD", false);
      if (hop < 1) o += epair(lerp(POS.c2 + 10, POS.q + 4, hop), MY + 28 + 10 * Math.sin(hop * Math.PI));
      o += A.op(b, lbl(196, 654, "recycled", GREEN, 12));
      o += A.op(ease(seg(p3, .5, 1)), lbl(POS.c2, MB + 22, "no H⁺ pumped", RED, 12));
    }
    if ((idx === 3 && p3 > .75)) o += epair(POS.q + 6, MY + 28);

    /* ---------- step 4: Q hands both electron pairs to Complex III ---------- */
    const p4 = p(4);
    if (idx >= 4 && p4 > 0){
      const absorb = ease(seg(p4, 0, .35)), mv = BASIC ? ease(seg(p4, 0, .28)) : 1;
      o += A.op(1 - (BASIC ? ease(seg(p4, .28, .38)) : absorb), epair(lerp(POS.q - 6, POS.c3 - 22, mv), MY - 28) + epair(lerp(POS.q + 6, POS.c3 + 18, mv), MY + 28));
      o += arrowsUp(POS.c3, seg(p4, .25, .85));
      o += pump("c3", 8, seg(p4, .25, .9), 4);
      const rise = ease(seg(p4, .72, 1));
      if (rise > 0 && idx === 4) o += epair(lerp(POS.c3 - 10, POS.cyt - 28, rise), lerp(MT, CYT_Y - 38, rise)) + epair(lerp(POS.c3 + 10, POS.cyt + 28, rise), lerp(MT, CYT_Y - 38, rise));
    }

    /* ---------- step 5: cytochrome c hands both pairs to Complex IV ---------- */
    const p5 = p(5);
    if (idx >= 5 && p5 > 0){
      const absorb = ease(seg(p5, 0, .35)), mv = BASIC ? ease(seg(p5, 0, .28)) : 1;
      o += A.op(1 - (BASIC ? ease(seg(p5, .28, .38)) : absorb), epair(lerp(POS.cyt - 28, POS.c4 - 18, mv), lerp(CYT_Y - 38, MY - 28, mv)) + epair(lerp(POS.cyt + 28, POS.c4 + 16, mv), lerp(CYT_Y - 38, MY + 28, mv)));
      o += arrowsUp(POS.c4, seg(p5, .3, .9));
      o += pump("c4", 4, seg(p5, .3, .95), 12);
    }

    if (BASIC && idx === 5 && p(5) <= 0) o += epair(POS.cyt - 28, CYT_Y - 38) + epair(POS.cyt + 28, CYT_Y - 38);
    if (BASIC && idx === 5 && phase !== "act") FINAL.targets.forEach(q => o += FINAL.tok(q[0], q[1]));
    /* ---------- step 6: O2 (or an alternative) takes the electrons and H+ and becomes water ---------- */
    const p6 = p(6);
    if (idx >= 6 && p6 > 0){
      const tg = FINAL.targets, n = tg.length;
      const accOp = 1 - ease(seg(p6, .66, .74));
      tg.forEach(q => o += A.op(accOp, FINAL.tok(q[0], q[1])));
      for (let j = 0; j < 4; j++){
        const d = tg[j % n], s0 = .04 + j * .07, u = ease(seg(p6, s0, s0 + .28));
        if (u <= 0 || u >= 1) continue;
        o += A.eDot(lerp(POS.c4 + (j % 2 ? 14 : -14), d[0] + (j % 2 ? 9 : -9), u), lerp(MY - 30 + (j > 1 ? 18 : 0), d[1] - 6, u), 8);
      }
      const hx = [412, 452, 500, 540];
      for (let j = 0; j < 4; j++){
        const d = tg[j % n], s0 = .3 + j * .07, u = ease(seg(p6, s0, s0 + .3));
        if (u <= 0 || u >= 1) continue;
        o += hion(lerp(hx[j], d[0] + (j % 2 ? 10 : -10), u), lerp(578, d[1] + 8, u), 12);
      }
      const fl = clamp(1 - Math.abs(p6 - .7) / .08, 0, 1);
      if (fl > 0) tg.forEach(q => o += `<circle cx="${q[0]}" cy="${q[1]}" r="${f1(14 + 34 * fl)}" fill="#f2b134" opacity="${f1(.5 * (1 - fl) + .25)}"/>`);
      const r = ease(seg(p6, .72, 1));
      FINAL.rest.forEach((q, j) => {
        const from = tg[Math.floor(j / (FINAL.rest.length / n))];
        const x = lerp(from[0], q[1], r), y = lerp(from[1], q[2], r);
        o += A.op(r, (q[0] === "h2o" ? h2otok(x, y) : no2tok(x, y)) + (r > .9 ? lbl(x, q[2] + 26, q[0] === "h2o" ? "H₂O" : "NO₂⁻", q[0] === "h2o" ? WATER : "#6b4bb8", 12) : ""));
      });
      o += eq(420, 690, FINAL.eq, ease(seg(p6, .55, .85)));
    }

    /* ---------- step 7: the gradient ---------- */
    const p7 = p(7);
    if (idx >= 7 && p7 > 0){
      const a = ease(seg(p7, 0, .6));
      o += A.op(a, `<rect x="0" y="${IMS_TOP}" width="1000" height="${MT - IMS_TOP}" fill="rgba(63,76,192,.10)"/>`);
      o += A.op(a, lbl(320, IMS_TOP + 56, "HIGH H⁺ concentration, more + charge", BLUE, 14));
      o += A.op(a, lbl(310, MATRIX_BOT - 32, "LOW H⁺ concentration, more − charge", "#5a6376", 14));
    }

    /* ---------- steps 8 and 9: ATP synthase close-up ---------- */
    if (idx >= 8){
      if (!S.t8) S.t8 = t;
      /* each H+ that is dropped in gets its own timed trip through the channel (staggered) */
      if (idx === 8 && phase === "act" && c.placed === 0) S.ion8.length = 0;
      if (idx === 8) while (S.ion8.length < c.placed) S.ion8.push(Math.max(t, (S.ion8[S.ion8.length - 1] || 0) + .4));
      const TRIP = 1.5, rot = (u0, u1) => ease(seg(u0, .35, .65));
      let ang = 0, trips = [];
      if (idx === 8 || idx > 8){
        for (let k = 0; k < 4; k++){ const u = idx > 8 ? 1 : (S.ion8[k] === undefined ? 0 : clamp((t - S.ion8[k]) / TRIP, 0, 1)); ang += 30 * rot(u); if (u > 0 && u < 1) trips.push([MOUTH, u]); }
      }
      let rest = [];
      if (BASIC){
        ang = 0; trips = [];
        const pp = idx > 9 ? 1 : p(9), all = POOL.concat(DRAGS);
        for (let k = 0; k < 16; k++){ const s0 = k / 16 * .8, u = clamp((pp - s0) / .2, 0, 1); ang += 30 * rot(u); if (u > 0 && u < 1) rest.push([all[k], u]); }
      } else if (idx >= 9){
        const pp = idx > 9 ? 1 : p(9);
        for (let k = 0; k < 12; k++){ const s0 = k / 12 * .78, u = clamp((pp - s0) / .22, 0, 1); ang += 30 * rot(u); if (u > 0 && u < 1) rest.push([POOL[k], u]); else if (u === 0 && idx === 9 && phase !== "act") rest.push([POOL[k], 0]); }
      }
      S.angle = ang;
      S.made = Math.min(4, Math.floor((ang + 30) / 120));
      o += closeUp(c, S, BASIC);
      /* pool: lots of H+ above the channel, thinning out as they flow through */
      const fade = clamp((t - S.t8) / .6, 0, 1);
      (BASIC ? POOL.concat(DRAGS) : POOL).forEach((q, k) => {
        const gone = BASIC ? (idx < 9 ? 0 : idx > 9 ? 1 : clamp((p(9) - k / 16 * .8) / .1, 0, 1)) : idx < 9 ? 0 : idx > 9 ? 1 : clamp((p(9) - k / 12 * .78) / .08, 0, 1);
        if (gone >= 1) return;
        o += A.op(fade * (1 - gone), hion(q[0] + 2 * Math.sin(t * 2 + k), q[1] + 3 * Math.cos(t * 1.7 + k * 2), 13));
      });
      trips.forEach(([, u]) => { const q = onPath(IONPATH, u); o += hion(q[0], q[1], 14); });
      rest.forEach(([start, u]) => { if (u <= 0) return; const full = [start].concat(IONPATH), q = onPath(full, u); o += hion(q[0], q[1], 13); });
    }

    /* ---------- step 10: tally this one pass ---------- */
    const p10 = p(10);
    if (!BASIC && idx >= 10 && p10 > 0){
      const r = ease(seg(p10, .1, .6));
      o += A.op(r, `<rect x="${60}" y="${Y.tally - 44}" width="520" height="116" rx="18" fill="#fff" stroke="${GREEN}" stroke-width="2.5"/>`);
      o += A.op(r, lbl(320, Y.tally - 12, "This one NADH + FADH₂ pass:", "#343b4a", 15));
      o += A.op(r, lbl(320, Y.tally + 20, "16 H⁺ pumped · about 4 ATP made", GREEN, 18));
      o += A.op(r, lbl(320, Y.tally + 50, FINAL.key === "anaerobic" ? "(drawn the same as with O₂; real nitrate chains pump fewer H⁺)" : "(NADH ≈ 2.5 ATP, FADH₂ ≈ 1.5 ATP)", "#5a6376", 13));
    }
    /* ---------- step 11: the whole-glucose grand total ---------- */
    const p11 = p(11);
    if (idx >= 11 && p11 > 0){
      const r = ease(seg(p11, .1, .6)), Yg = BASIC ? Y.tally : Y.grand;
      o += A.op(r, `<rect x="40" y="${Yg - 46}" width="560" height="148" rx="18" fill="#fff" stroke="${FINAL.color}" stroke-width="2.5"/>`);
      o += A.op(r, lbl(320, Yg - 14, "Glycolysis: 2 ATP  ·  Krebs cycle: 2 ATP", "#343b4a", 15));
      o += A.op(r, lbl(320, Yg + 18, "Electron transport chain: ~28–34 ATP", "#343b4a", 15));
      o += A.op(r, lbl(320, Yg + 58, FINAL.key === "anaerobic" ? "Total: usually a bit less than aerobic" : "Total: up to ~32–38 ATP per glucose", FINAL.color, 18));
    }
    /* ---------- step 12: where next ---------- */
    const p12 = p(12);
    if (idx >= 12 && p12 > 0){
      const r = ease(seg(p12, 0, .6)), Yq = BASIC ? Y.grand : Y.go;
      o += A.op(r, `<circle cx="320" cy="${Yq}" r="34" fill="#fbe8e7" stroke="${RED}" stroke-width="2.5"/>` + lbl(320, Yq + 8, "?", RED, 24));
      o += A.op(r, lbl(320, Yq + 62, "No final acceptor at all → fermentation", RED, 14));
    }
    return o;
   };
  }

  /* ================= Two variants: Aerobic and Anaerobic ================= */

       pop:{y:CARDY[4], x:CARDX, title:"Moving electrons: Q to Complex III",

      {focusY:MY - 40, animMs:2400, tally:{h:4},
       action:{type:"drag", token:"epair", count:2, from:[[POS.cyt - 28, CYT_Y - 38], [POS.cyt + 28, CYT_Y - 38]], targets:[[POS.c4 - 18, MY - 28], [POS.c4 + 16, MY + 28]], r:60, label:"Drag both electron pairs from cytochrome c to Complex IV."},
       pop:{y:CARDY[5], x:CARDX, title:"Moving electrons: cytochrome c to Complex IV", more:"cytc",
         text:`Cytochrome c is another mobile carrier, ferrying electrons along the outer face of the membrane to Complex IV, the last stop before they're handed off for good. Complex IV pumps 2 H⁺ for each pair, so 4 H⁺ this time. That makes 16 H⁺ pumped by one NADH and one FADH₂.`}},

       pop:{y:CARDY[6], x:CARDX, title:FINAL.finalTitle, more:FINAL.key === "aerobic" ? "poisons" : "altacceptors",

       pop:{y:CARDY[8], x:CARDX, title:"ATP synthase: the payoff", more:"motor",
         text:`H⁺ flows back down its gradient through a channel in {{atpsynthase}}. Each proton turns the ring of c subunits one notch, and the ring spins the central stalk like a tiny turbine. The spinning stalk twists the F₁ head, which squeezes ADP and phosphate together into ATP. It takes about 4 H⁺ to make 1 ATP, and making ATP with a proton gradient is called {{chemiosmosis}}.`}},

    ];
    return {title:`Electron Transport Chain: ${FINAL.label}`, page:"etc.html", H, narrowW:680, BL:{...BL, acceptor:FINAL.acceptorBL, product:FINAL.productBL}, MORE, steps:STEPS,

      tally:[["h", "H⁺ pumped", BLUE], ["made", "ATP made", GREEN]],
      endTitle:"You built the electron transport chain!", endText:"The chain moved electrons, pumped H⁺, and used that gradient to make ATP, most of the cell's energy payoff. Tap any marker to review a step.",
      next:[["Fermentation & Anaerobic Respiration →", "fermentation.html"], ["Try it in the lab: " + (FINAL.key === "anaerobic" ? "the nitrate reduction test →" : "the oxidase test →"), "id-tests.html#" + (FINAL.key === "anaerobic" ? "nitrate" : "oxidase")], ["Big picture: respiration overview", "respiration-overview.html"], ["All modules", "index.html"]]};
  }


  /* ================= The Basics: one aerobic pass, told simply =================
     The board is the same; each step can play several full-pathway stages (MAP). */
  function buildBasic(){
    const FINAL = AEROBIC, HB = 1660;
    const MAP = [[[0, 1]], [[1, 1]], [[2, 1]], [[3, .42], [4, .58]], [[5, .45], [6, .55]], [[7, 1]], [[9, 1]], [[11, 1]], [[12, 1]]];
    const CY = [220, 300, 380, 440, 520, 600, 1000, Y.tally, Y.grand];
    const STEPS = [
      {focusY:310, animMs:900,
       pop:{y:CY[0], x:CARDX, title:"The electron transport chain",
         text:`NADH and FADH₂ arrive from glycolysis and the Krebs cycle, loaded with high-energy electrons. They wait in the matrix next to a chain of proteins built into the {{innermembrane}} (bacteria: the plasma membrane). Your job: move those electrons down the chain.`}},
      {focusY:300, animMs:1700,
       action:{type:"click", at:[320, 235], button:"See the electrons move!", label:"Click to watch an electron transfer."},
       pop:{y:CY[1], x:CARDX, title:"A quick refresher: redox",
         text:`Every handoff in this chain is a redox reaction. The molecule that gives up electrons is {{oxidized}}; the one that accepts them is {{reduced}}.`}},
      {focusY:MY + 40, animMs:2300, tally:{h:4},
       action:{type:"drag", token:"NADH", count:1, from:[NADHP], targets:[[POS.c1, MY + 20]], r:80, label:"Drag NADH up to the first protein in the chain."},
       pop:{y:CY[2], x:CARDX, title:"NADH drops off its electrons", more:"iron",
         text:`NADH hands its high-energy electrons to the first protein in the chain and is oxidized back to {{nadplus2}}, which goes back to glycolysis and the Krebs cycle. The energy from those electrons powers a pump that pushes H⁺ out across the membrane. Watch them rise!`}},
      {focusY:MY, animMs:4600, tally:{h:8},
       action:{type:"drag", token:"FADH2", count:1, from:[FADP], targets:[[POS.c2, MY + 20]], r:80, label:"Drag FADH₂ up to the chain."},
       pop:{y:CY[3], x:CARDX, title:"Down the chain",
         text:`FADH₂ drops off its electrons too. Now the high-energy electrons hop from carrier to carrier down the chain. Each hop is a redox reaction that releases a little energy, and the proteins use that energy as pumps, pushing more H⁺ across the membrane.`}},
      {focusY:MY + 40, animMs:5000, tally:{h:4},
       action:{type:"drag", token:"O2", count:1, from:FINAL.from, targets:FINAL.targets, r:70, label:"Drag O₂ to the end of the chain."},
       pop:{y:CY[4], x:CARDX, title:"Cytochrome c and oxygen", more:"poisons",
         text:`The small carrier cytochrome c ferries the electrons to the last protein in the chain, <b>cytochrome c oxidase</b>, which pumps a few more H⁺. Then the spent electrons are handed to {{acceptor}}, the final electron acceptor, which also picks up H⁺ and becomes {{product}}. Without oxygen waiting at the end, the whole chain backs up and stops.<br><br><a class="btn secondary sm" href="id-tests.html#oxidase">🧪 The oxidase test looks for cytochrome c oxidase →</a>`}},
      {focusY:MY + 50, animMs:1900,
       pop:{y:CY[5], x:CARDX, title:"Stored energy: the H⁺ gradient",
         text:`All that pumping built up a {{gradient}}: lots of H⁺ (and positive charge) on one side of the membrane, very few on the other. Like water held behind a dam, that's stored energy, ready to be used.`}},
      {focusY:PANEL.y + 250, animMs:6500, tally:{made:4},
       action:{type:"click", at:[320, 1250], button:"Let the H⁺ flow", label:"Open the door: let the H⁺ flow back through ATP synthase."},
       pop:{y:CY[6], x:CARDX, title:"ATP synthase: the payoff", more:"motor",
         text:`H⁺ can only flow back in through one door: {{atpsynthase}}. Rushing through, the H⁺ spin its rotor like water turning a water wheel, and the spinning head squeezes ADP and phosphate together into ATP. Making ATP with a H⁺ gradient like this is called {{chemiosmosis}}.`}},
      {focusY:Y.tally, animMs:2000,
       action:{type:"click", at:[320, Y.tally - 80], button:"Add it up", label:"Add up the ATP from one glucose."},
       pop:{y:CY[7], x:CARDX, title:"The whole point of respiration",
         text:`Glycolysis makes 2 ATP and the Krebs cycle makes 2 ATP. The electron transport chain and ATP synthase make most of the rest: up to about 32–38 ATP per glucose in all. Nearly everything before this stage exists to load up NADH and FADH₂ for this payoff.`}},
      {focusY:Y.grand, animMs:1500,
       action:{type:"click", at:[320, Y.grand - 60], button:"What if there's no acceptor at all?", label:"See what happens without any final acceptor."},
       pop:{y:CY[8], x:CARDX, title:"Electron transport chain summarized",
         text:`<i>"NADH and FADH₂ deliver high-energy electrons to the chain. As the electrons move, the chain pumps H⁺ across the membrane, and that H⁺ gradient drives ATP synthase to make most of the cell's ATP."</i> But what happens when there's no acceptor at all waiting at the end?`}}
    ];
    return {title:"Electron Transport Chain: The Basics", page:"etc.html", H:HB, narrowW:680, BL:{...BL, acceptor:FINAL.acceptorBL, product:FINAL.productBL}, MORE, steps:STEPS,
      draw:makeDraw(FINAL, MAP), token,
      intro:`Move NADH and FADH₂'s electrons down the chain, watch H⁺ get pumped across the membrane, then let it flow back through ATP synthase to make ATP.`,
      tally:[["h", "H⁺ pumped", BLUE], ["made", "ATP made", GREEN]],
      endTitle:"You built the electron transport chain!", endText:"High-energy electrons moved down the chain, H⁺ got pumped, and the H⁺ flowing back made ATP. Tap any marker to review a step, or try The Full Pathway above.",
      next:[["Fermentation & Anaerobic Respiration →", "fermentation.html"], ["Try it in the lab: the oxidase test →", "id-tests.html#oxidase"], ["Big picture: respiration overview", "respiration-overview.html"], ["All modules", "index.html"]]};
  }

  /* "aerobic" keeps its old key, so a saved choice still works */
  const VARIANTS = [{key:"basic", label:"The Basics"}, {key:"aerobic", label:"The Full Pathway"}, {key:"anaerobic", label:"Anaerobic (no O₂)"}];
  function render(variant, mode){
    const cfg = variant === "basic" ? buildBasic() : buildVariant(variant === "anaerobic" ? ANAEROBIC : AEROBIC);
    cfg.variant = variant; cfg.variants = VARIANTS; cfg.mode = mode;
    cfg.onVariant = v => {
      const m = window.__pw ? window.__pw.mode : "learn";
      try { localStorage.setItem("bio112-etc-variant", v); } catch (e) {}
      render(v, m);
    };
    Pathway.start(cfg);
  }
  let startVariant = "basic";
  try { startVariant = localStorage.getItem("bio112-etc-variant") || "basic"; } catch (e) {}
  render(startVariant);
})();
</script>
