<script>
(function(){
  /* ---------- Sequence and layout ---------- */
  const CODING = "GTATAACGCATGGCATTCGGACGTAACTAAGCGCAT";
  const COMP = {A:"T", T:"A", G:"C", C:"G"};
  const TEMPLATE = CODING.split("").map(b => COMP[b]).join("");
  const N = CODING.length;
  const ORIGIN = 0, END = N - 6;             // fork travels from the origin to END; a few bases beyond stay unreplicated (more genome to go)
  const FL = 6;                              // Okazaki fragment length, in base-index units
  const X0 = 70, DX = 24;
  const X = i => X0 + i * DX;

  const BASE = {A:["#2f9e63","#fff"], T:["#d9534f","#fff"], G:["#f2b134","#3b2a00"], C:["#3b7dd8","#fff"]};

  /* ---------- Helpers ---------- */
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const lerp = (a,b,t) => a + (b - a) * t;
  const smooth = t => { t = clamp(t,0,1); return t * t * (3 - 2 * t); };
  const seg = (t,a,b) => clamp((t - a) / (b - a), 0, 1);
  const f1 = v => v.toFixed(1);
  const f3 = v => v.toFixed(3);

  /* ---------- Blanks ---------- */
  const BL = window.__BL = {
    semiconservative: {show:"semi-conservative", ans:["semiconservative","semiconservativereplication"], fuzzy:true},
    origin:    {show:"origin of replication", ans:["originofreplication","origin","ori"], fuzzy:true},
    helicase:  {show:"DNA helicase", ans:["dnahelicase","helicase"], fuzzy:true},
    primase:   {show:"primase", ans:["primase","rnaprimase"], fuzzy:true},
    okazaki:   {show:"Okazaki fragments", ans:["okazakifragments","okazaki"], fuzzy:true},
    ligase:    {show:"DNA ligase", ans:["dnaligase","ligase"], fuzzy:true},
    multiple:  {show:"multiple", ans:["multiple","many","several"], fuzzy:true},
    heavy:     {show:"heavy", ans:["heavy","heavynitrogen","15n"], fuzzy:true},
    light:     {show:"light", ans:["light","lightnitrogen","14n"], fuzzy:true},
    density:   {show:"density", ans:["density","densitygradient"], fuzzy:true}
  };

  /* ---------- Learn more ---------- */
  const MORE = {
    replicationModels:{title:"Three hypotheses, one experiment", html:`<p>Before 1958, all three ideas about how DNA copies itself, conservative, semi-conservative, and dispersive, were taken seriously. Watson and Crick's double-helix structure hinted that semi-conservative made the most chemical sense (each strand acting as a template for a new partner strand), but nobody had proven it.</p><p>Matthew Meselson and Franklin Stahl designed an experiment clever enough to distinguish all three models at once, without ever directly looking at a single DNA strand, just by tracking the overall density of whole DNA molecules across generations. It's often called "the most beautiful experiment in biology" for how cleanly it separated three competing ideas with one simple technique.</p>`},
    msExperiment:{title:"How Meselson and Stahl actually did it", html:`<p>In 1958, Matthew Meselson and Franklin Stahl grew <i>E. coli</i> for many generations in a medium containing only "heavy" nitrogen (<sup>15</sup>N) so that every base in every DNA strand incorporated the heavier isotope. They then switched the bacteria to ordinary "light" nitrogen (<sup>14</sup>N) medium and let them divide.</p><p>After each generation, they spun a sample of DNA in a centrifuge tube filled with a dense salt solution (cesium chloride). DNA of different densities settles at different heights in the tube: heavier DNA sinks lower, lighter DNA stays higher. This technique, <b>density gradient centrifugation</b>, let them "weigh" the DNA without ever looking at a single strand directly.</p>`},
    originSequence:{title:"What makes a stretch of DNA an origin?", html:`<p>An origin of replication is usually rich in adenine and thymine base pairs. Since A-T pairs are held by only two hydrogen bonds (versus three for G-C), an A-T-rich stretch takes less energy to pull apart, which is exactly what helicase needs to do to get started.</p><p>In bacteria like <i>E. coli</i>, specific initiator proteins recognize the origin sequence directly and recruit helicase to it. In eukaryotes, origins are chosen less by exact sequence and more by which parts of the chromosome are loosely packaged (open chromatin) and accessible at a given time, which is part of why eukaryotic origins are harder to pin down to one exact sequence.</p>`},
    topoisomerase:{title:"The tangle helicase leaves behind", html:`<p>DNA is a coiled helix, not a loose noodle, so prying two strands apart at the fork twists the DNA ahead of it tighter, a problem called <b>supercoiling</b>. Left unchecked, this buildup of twisting strain would eventually stop helicase in its tracks, like trying to unscrew a lid that's wound itself shut.</p><p><b>Topoisomerase</b> (called DNA gyrase in many bacteria) relieves that strain by cutting one or both DNA strands ahead of the fork, letting the helix swivel to release tension, then resealing the cut. It's a repair-and-release job happening continuously just ahead of every moving replication fork.</p>`},
    whyPrimer:{title:"Why can't DNA polymerase just start on its own?", html:`<p>DNA polymerase can only add a new nucleotide onto an existing 3'-OH (hydroxyl) end; it has no ability to link the very first two free nucleotides together from scratch. That means every new strand needs a short starter piece already in place before DNA polymerase can take over.</p><p><b>Primase</b> is a specialized RNA polymerase that solves this by laying down a short RNA primer (about 5 to 10 nucleotides) that DNA polymerase can then extend. Later, a different enzyme activity removes each RNA primer and fills the resulting gap with DNA, which is why the finished molecule contains no leftover RNA at all.</p>`},
    laggingDetail:{title:"Why one strand has to be built backward", html:`<p>The two parental strands are antiparallel, but DNA polymerase can only build a new strand 5' to 3'. At a fork moving in one direction, that geometry works out perfectly for one template (the leading strand can be built continuously, chasing the fork) but not for the other.</p><p>For the lagging strand's template, the only way to build 5' to 3' is to work <i>away</i> from the fork, back toward the previous fragment. So the cell repeats a short cycle over and over as the fork opens up new template: lay a new RNA primer close to the fork, extend it backward with DNA polymerase until it bumps into the previous fragment, then start again on a fresh stretch of exposed template. Each of these short pieces is an <b>Okazaki fragment</b>, named for Reiji and Tsuneko Okazaki, who first detected them in the 1960s.</p>`},
    ligaseDetail:{title:"Finishing the lagging strand", html:`<p>Once an Okazaki fragment's DNA polymerase runs into the RNA primer ahead of it, a different enzyme activity chews out that RNA primer and fills the gap with DNA nucleotides. That leaves two DNA pieces sitting right next to each other with a nick, a broken spot in the sugar-phosphate backbone, but no bond connecting them yet.</p><p><b>DNA ligase</b> seals that nick by forming the final phosphodiester bond between the two fragments, turning a row of separate pieces into one continuous strand. Ligase is the same general type of enzyme used in molecular biology labs to paste DNA fragments together when building recombinant DNA.</p>`},
    originsCompare:{title:"Why eukaryotes need so many origins", html:`<p>A bacterial chromosome is small (a few million base pairs) and circular, so a single origin with two forks racing away from each other in opposite directions can copy the whole thing quickly, at roughly 1000 nucleotides per second per fork.</p><p>A human chromosome can be hundreds of millions of base pairs long, and each fork moves much slower in eukaryotic cells (roughly 50 nucleotides per second). If eukaryotes relied on just one origin per chromosome, replicating a single chromosome could take weeks. Instead, hundreds to thousands of origins fire in a coordinated, time-staggered pattern across the genome during S phase, each opening its own small replication bubble; these bubbles expand and eventually merge as neighboring forks meet, finishing the whole chromosome in only a few hours.</p>`},
    semiconservativeMore:{title:"Why \"semi-conservative\" matters beyond the exam", html:`<p>Because each new DNA molecule keeps one original strand, any copying error in the other strand is checked against a still-correct template, which is part of why DNA replication is so much more accurate than it would be if both strands were built fresh at once (the dispersive model) or thrown away and rebuilt as loose fragments.</p><p>This one-old-one-new pattern is also the reason repair enzymes can often tell which strand is the "trusted" old one and which is the newly made strand that's more likely to contain a mistake, at least briefly after replication, before the new strand is chemically marked as mature.</p>`}

  const STEPS = [
    {title:"Copying the code of life", state:S_HERO,

    {title:"Semi-conservative replication", state:S_MODELS, more:"replicationModels",

    {title:"The Meselson-Stahl experiment", state:S_MS3, more:"msExperiment",

    {title:"Leading vs. lagging, side by side", state:S[10],
     text:`Both new strands are built by the same DNA polymerase enzyme, reading a template 3' to 5' and building 5' to 3', but the fork's direction makes the two jobs look completely different.<div class="cmpwrap"><div class="cmpbox" style="background:#e1f3e8;border:2px solid #1b7f4e"><b style="color:#1b7f4e">Leading strand</b><br>Built continuously, in one long piece, chasing the fork. Needs only <b>one</b> RNA primer, right at the start.</div><div class="cmpbox" style="background:#fbe8e7;border:2px solid #b83a34"><b style="color:#b83a34">Lagging strand</b><br>Built in short, separate Okazaki fragments, moving away from the fork. Needs a <b>new</b> primer for every fragment, later removed and sealed by ligase.</div></div>`},

  /* Drag a piece (or tap it). targets() lists drop zones; drop(zone) returns false to bounce the piece back. */
  function dragify(el, o){
    const nope = () => { el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope"); };
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); if (o.tap() === false) nope(); } });
    el.addEventListener("pointerdown", e => {
      if (e.button > 0) return;
      e.preventDefault();
      const r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
      let moved = false, clone = null, over = null;
      const hit = ev => o.targets().find(z => { const q = z.getBoundingClientRect(); return ev.clientX > q.left - 8 && ev.clientX < q.right + 8 && ev.clientY > q.top - 8 && ev.clientY < q.bottom + 8; }) || null;
      const move = ev => {
        if (!moved && Math.hypot(ev.clientX - e.clientX, ev.clientY - e.clientY) > 6){ moved = true; clone = el.cloneNode(true); clone.classList.add("dragging"); clone.style.width = r.width + "px"; clone.style.height = r.height + "px"; document.body.appendChild(clone); el.classList.add("lifted"); }
        if (!clone) return;
        clone.style.left = (ev.clientX - dx) + "px"; clone.style.top = (ev.clientY - dy) + "px";
        over = hit(ev); o.targets().forEach(z => z.classList.toggle("over", z === over));
      };
      const up = () => {
        document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up); document.removeEventListener("pointercancel", up);
        if (clone) clone.remove(); el.classList.remove("lifted"); o.targets().forEach(z => z.classList.remove("over"));
        if (!moved){ if (o.tap() === false) nope(); return; }
        if (o.drop(over) === false) nope();
      };
      document.addEventListener("pointermove", move); document.addEventListener("pointerup", up); document.addEventListener("pointercancel", up);
    });
  }

  /* ---------- Tweening ---------- */
  function durFor(from, to){
    const da = Math.abs(to.a - from.a);

    if (Math.abs(to.helicase - from.helicase) > 0.5) d = Math.max(d, 1000);

  }

    const p = clamp((now - tw.t0) / tw.dur, 0, 1);
    for (const k in tw.to) cur[k] = lerp(tw.from[k], tw.to[k], smooth(p));
    if (p >= 1) tw = null;
    return true;
  }

      + `<rect x="${f1(cx-52)}" y="${f1(cy-42)}" width="104" height="22" rx="11" fill="${dark}"/><text x="${f1(cx)}" y="${f1(cy-27)}" class="pill">${label}</text></g>`;

  function forkSVG(s){
    const midY = 272;
    const sep = i => smooth(clamp((s.a - i) / 4, 0, 1));
    const topY = i => midY - 20 - 88 * sep(i);
    const botY = i => midY + 20 + 88 * sep(i);
    const newLeadY = i => botY(i) + 26;
    const newLagY = i => topY(i) - 26;
    const path = fn => { let d = ""; for (let u = 0; u <= N - 1; u += 0.2){ d += (d ? "L" : "M") + f1(X0 + u * DX) + "," + f1(fn(u)); } return d; };
    const pathRange = (fn, a, b) => { let d = ""; for (let u = a; u <= b + 0.001; u += 0.2){ d += (d ? "L" : "M") + f1(X0 + u * DX) + "," + f1(fn(u)); } return d; };
    let o = "";
    // parental backbones (continuous throughout)
    o += `<path d="${path(topY)}" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    o += `<path d="${path(botY)}" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
    for (let i = 0; i < N; i++){ o += tile(X(i), topY(i), CODING[i]); o += tile(X(i), botY(i), TEMPLATE[i]); }
    o += `<text x="${X0-30}" y="${f1(topY(0)+18)}" class="prime">5'</text><text x="${X(N-1)+26}" y="${f1(topY(N-1)+18)}" class="prime">3'</text>`;
    o += `<text x="${X0-30}" y="${f1(botY(0)+18)}" class="prime">3'</text><text x="${X(N-1)+26}" y="${f1(botY(N-1)+18)}" class="prime">5'</text>`;

    if (s.originLabel > 0.01){
      /* above the DNA while it's closed; once the fork opens, it slides into the empty gap between the two arms */
      const op = sep(0), lx = X(0) + lerp(62, 72, op), ly = lerp(midY - 66, midY, op);
      o += `<g opacity="${f3(s.originLabel)}">`;
      if (op < 0.5) o += `<path d="M${X(0)},${f1(midY - 22)} L${f1(lx - 50)},${f1(ly + 13)}" stroke="#e0b45c" stroke-width="3" opacity="${f3(1 - op * 2)}"/>`;

    }

    const sealed = s.a >= END - 0.4;

  }

  /* ===== Lab glassware shared by the Meselson-Stahl graphics ===== */

  let gid = 0;
  /* Erlenmeyer flask: black outline, narrow neck, colored broth with a meniscus line */
  function flask(cx, baseY, w, liquid, opt){

  /* centrifuge tube with a density gradient (pale at the top, denser at the bottom) and DNA bands */

  /* ===== Step 1 hero: a spinning double helix being copied, on a night-sky background ===== */
  const SEQ = "ATGCGTACCTAGGCATTCGATCGGATACGTTAGCCATGGATCCGTAATGCGTCA";

  function heroSVG(t){

    const cyc = 15, tc = t % cyc, fx = lerp(-40, 1080, smooth(clamp(tc / 12, 0, 1)));

    o += `<text x="48" y="98" font-size="18" fill="#c7d0f5">How one molecule becomes two, almost perfectly</text>`;
    /* legend */
    o += `<g transform="translate(700,50)"><rect x="0" y="0" width="256" height="50" rx="12" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".18"/><path d="M16,18 h34" stroke="${OLD}" stroke-width="7" stroke-linecap="round"/><text x="60" y="23" font-size="14" fill="#e6ebff">original strand</text><path d="M16,36 h34" stroke="${NEW}" stroke-width="7" stroke-linecap="round"/><text x="60" y="41" font-size="14" fill="#e6ebff">new strand</text></g>`;

    const strands = [
      {col:OLD, y:x => CY - sepOf(x) + Rof(x) * Math.sin(k * x + om), z:x => Math.cos(k * x + om), from:X0, to:X1},
      {col:OLD, y:x => CY + sepOf(x) + Rof(x) * Math.sin(k * x + om + Math.PI), z:x => Math.cos(k * x + om + Math.PI), from:X0, to:X1},
      {col:NEW, y:x => CY - sepOf(x) + Rof(x) * Math.sin(k * x + om + Math.PI), z:x => Math.cos(k * x + om + Math.PI), from:X0, to:Math.min(X1, fx - 70)},
      {col:NEW, y:x => CY + sepOf(x) + Rof(x) * Math.sin(k * x + om), z:x => Math.cos(k * x + om), from:X0, to:Math.min(X1, fx - 70)}

  }

  /* ===== Step 2: the three models, drawn as little double helices ===== */
  function miniHelix(x1, x2, cy, colTop, colBot, t, amp){

  function modelsSVG(t){

    const M = [
      ["Conservative", "#5a6376", "#eef1f5", "#9aa3b5", ["The original helix stays whole;", "a completely new copy is built."], [[old, old], [nw, nw]]],
      ["Semi-conservative", "#1b7f4e", "#e8f6ee", "#1b7f4e", ["Each new molecule keeps one", "original strand + one new strand."], [[old, nw], [nw, old]]],
      ["Dispersive", "#b83a34", "#fbecea", "#b83a34", ["Old and new DNA are chopped", "up and mixed in every strand."], [[mix(0), mix(13)], [mix(13), mix(0)]]]

    M.forEach((m, i) => {
      const cx = 172 + i * 328, x1 = cx - 100, x2 = cx + 100;
      o += `<rect x="${cx - 150}" y="78" width="300" height="378" rx="18" fill="${m[2]}" stroke="${m[3]}" stroke-width="2.5"/>`;
      o += lbl(cx, 112, m[0], 19, m[1], 800) + lbl(cx, 138, m[4][0], 14, "#343b4a", 400) + lbl(cx, 157, m[4][1], 14, "#343b4a", 400);
      o += lbl(cx, 190, "Original DNA", 13, "#5a6376") + miniHelix(x1, x2, 214, old, old, t);
      o += arrowD(cx, 238, 276, "#9aa3b5") + lbl(cx + 38, 262, "copy", 13, "#5a6376");
      o += lbl(cx, 298, "Two DNA molecules after copying", 13, "#5a6376");
      o += miniHelix(x1, x2, 330, m[5][0][0], m[5][0][1], t) + miniHelix(x1, x2, 384, m[5][1][0], m[5][1][1], t + 1.7);
      if (i === 1) o += `<rect x="${cx - 60}" y="420" width="120" height="24" rx="12" fill="#1b7f4e"/>` + lbl(cx, 437, "What cells do!", 13, "#fff");
    });
    return o;
  }

  /* ===== Step 3: the experiment in three panels ===== */
  function nucleotide(t){
    /* deoxyadenosine monophosphate, drawn as a simple skeletal structure; the 5 nitrogens are highlighted */
    const heavy = Math.floor(t / 1.8) % 2 === 0, hc = heavy ? HEAVY : LIGHTN;
    const P = {C6:[240,112], N1:[264,126], C2:[264,154], N3:[240,168], C4:[216,154], C5:[216,126], N7:[190,117], C8:[176,140], N9:[190,163], N6:[240,84],
      O4:[160,190], C1:[184,207], C2s:[176,236], C3:[144,236], C4s:[136,207], C5s:[108,186], O5:[86,170], P:[66,150]};
    const bond = (a, b) => `<path d="M${P[a][0]},${P[a][1]} L${P[b][0]},${P[b][1]}" stroke="#343b4a" stroke-width="3" stroke-linecap="round"/>`;
    let o = "";
    [["C6","N1"],["N1","C2"],["C2","N3"],["N3","C4"],["C4","C5"],["C5","C6"],["C5","N7"],["N7","C8"],["C8","N9"],["N9","C4"],["C6","N6"],["N9","C1"],["O4","C1"],["C1","C2s"],["C2s","C3"],["C3","C4s"],["C4s","O4"],["C4s","C5s"],["C5s","O5"],["O5","P"]].forEach(b => { o += bond(b[0], b[1]); });
    [[-24,-16],[-26,14],[6,-28]].forEach(d => { o += `<path d="M${P.P[0]},${P.P[1]} l${d[0]},${d[1]}" stroke="#343b4a" stroke-width="3"/><circle cx="${P.P[0] + d[0]}" cy="${P.P[1] + d[1]}" r="8" fill="#fff"/><text x="${P.P[0] + d[0]}" y="${P.P[1] + d[1] + 4.5}" font-size="12.5" font-weight="800" fill="#d9443a" text-anchor="middle">O</text>`; });
    o += `<circle cx="${P.P[0]}" cy="${P.P[1]}" r="14" fill="#e8744f"/><text x="${P.P[0]}" y="${P.P[1] + 5}" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">P</text>`;
    [["O4",""],["O5",""]].forEach(k => { o += `<circle cx="${P[k[0]][0]}" cy="${P[k[0]][1]}" r="9" fill="#fff"/><text x="${P[k[0]][0]}" y="${P[k[0]][1] + 5}" font-size="14" font-weight="800" fill="#d9443a" text-anchor="middle">O</text>`; });
    o += `<text x="140" y="258" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle">OH</text>`;
    ["N1","N3","N7","N9","N6"].forEach((n, i) => {
      const [x, y] = P[n], pul = 1 + .12 * Math.sin(t * 5 + i);
      o += `<circle cx="${x}" cy="${y}" r="${f1(15 * pul)}" fill="${hc}" opacity=".18"/><circle cx="${x}" cy="${y}" r="11.5" fill="#fff" stroke="${hc}" stroke-width="3"/><text x="${x}" y="${y + 5}" font-size="14" font-weight="800" fill="${hc}" text-anchor="middle">N</text>`;
    });
    o += lbl(84, 204, "phosphate", 11.5, "#8a4a24") + lbl(160, 278, "sugar", 11.5, "#5a6376") + lbl(300, 180, "base (A)", 11.5, "#5a6376");
    return {svg:o, heavy, hc};
  }
  function ms3SVG(t){
    gid = 0;
    let o = lbl(500, 30, "How Meselson and Stahl tracked old vs. new DNA", 19, "#1d2433", 800);
    const panel = (x, n, title) => `<rect x="${x}" y="46" width="312" height="412" rx="16" fill="#fbfcfe" stroke="#d9dee7" stroke-width="2"/><circle cx="${x + 26}" cy="74" r="14" fill="#3f4cc0"/><text x="${x + 26}" y="79" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">${n}</text><text x="${x + 48}" y="80" font-size="16" font-weight="800" fill="#1d2433">${title}</text>`;
    /* panel 1 */
    o += panel(14, 1, "Why nitrogen?");
    const nuc = nucleotide(t);
    o += `<g transform="translate(-18,16) scale(1.1)">${nuc.svg}</g>`;
    o += `<rect x="30" y="342" width="280" height="36" rx="18" fill="${nuc.hc}"/>` + lbl(170, 366, nuc.heavy ? "¹⁵N = heavy (1 extra neutron)" : "¹⁴N = normal, light nitrogen", 14.5, "#fff");
    o += lbl(170, 404, "Every DNA base contains nitrogen,", 14, "#343b4a", 400) + lbl(170, 424, "so DNA built in ¹⁵N broth is heavier", 14, "#343b4a", 400) + lbl(170, 444, "than DNA built in ¹⁴N broth.", 14, "#343b4a", 400);
    /* panel 2 */
    o += panel(344, 2, "Grow, extract, spin");
    const cols = [[402, HEAVY, "¹⁵N broth", "many gens", [{f:.72, c:HEAVY}], false], [500, LIGHTN, "¹⁴N broth", "1 gen", [], true], [598, LIGHTN, "¹⁴N broth", "2 gens", [], true]];
    cols.forEach((c, i) => {
      o += flask(c[0], 196, 70, c[1], {cells:true}) + lbl(c[0], 218, c[2], 13, c[1] === HEAVY ? HEAVY : "#a8760f") + lbl(c[0], 234, c[3], 12, "#5a6376", 400);
      if (i < 2) o += arrowR(c[0] + 36, 160, c[0] + 62, "#9aa3b5");
      o += arrowD(c[0], 244, 290, "#7a8292");
      o += ctube(c[0], 300, 92, 30, c[4], {q:c[5]}) + lbl(c[0], 412, "Gen " + i, 13, "#343b4a");
    });
    o += `<text x="444" y="274" font-size="11.5" font-weight="700" fill="#5a6376" text-anchor="middle">extract</text><text x="444" y="287" font-size="11.5" font-weight="700" fill="#5a6376" text-anchor="middle">+ spin</text>`;
    o += lbl(500, 438, "After every generation: take a sample,", 13.5, "#343b4a", 400) + lbl(500, 454, "pull out the DNA, and spin it.", 13.5, "#343b4a", 400);
    /* panel 3 */
    o += panel(674, 3, "Reading the tube");
    const TX = 740, TT = 110, TH = 280;
    const bands = [{f:.40, c:LIGHTN, n:"¹⁴N / ¹⁴N", d:"light DNA"}, {f:.55, c:"#6c8c6a", n:"¹⁵N / ¹⁴N", d:"hybrid DNA"}, {f:.70, c:HEAVY, n:"¹⁵N / ¹⁵N", d:"heavy DNA"}];
    o += ctube(TX, TT, TH, 50, bands.map(b => ({f:b.f, c:b.c, op:.85})), {});
    /* molecules sinking to where their density matches the salt */
    bands.forEach((b, i) => { for (let j = 0; j < 2; j++){ const ph = smooth(clamp(((t + i * .7 + j * 1.6) % 4) / 2.6, 0, 1)); const y = lerp(TT + 14, TT + TH * b.f, ph); o += `<circle cx="${TX - 12 + j * 22 + i * 3}" cy="${f1(y)}" r="4.5" fill="${b.c}" opacity="${f3(1 - smooth(clamp((ph - .85) / .15, 0, 1)) * .7)}"/>`; } });
    o += `<text x="${TX - 44}" y="${TT + 20}" font-size="12" font-weight="700" fill="#5a6376" text-anchor="end">top</text><text x="${TX - 44}" y="${TT + TH - 8}" font-size="12" font-weight="700" fill="#5a6376" text-anchor="end">bottom</text>`;
    o += `<path d="M${TX - 58},${TT + 40} V${TT + TH - 40}" stroke="#7a8292" stroke-width="2.5"/><path d="M${TX - 58},${TT + TH - 32} l-6,-11 h12 z" fill="#7a8292"/>`;
    o += `<text x="${TX - 66}" y="${TT + TH / 2}" font-size="12" font-weight="700" fill="#5a6376" text-anchor="middle" transform="rotate(-90 ${TX - 66} ${TT + TH / 2})">denser</text>`;
    bands.forEach(b => { const y = TT + TH * b.f; o += `<path d="M${TX + 28},${f1(y)} H${TX + 46}" stroke="${b.c}" stroke-width="2.5"/><text x="${TX + 52}" y="${f1(y - 2)}" font-size="14" font-weight="800" fill="${b.c}">${b.n}</text><text x="${TX + 52}" y="${f1(y + 15)}" font-size="12.5" font-weight="700" fill="#5a6376">${b.d}</text>`; });
    o += lbl(830, 424, "Heavier DNA sinks lower. Each band is", 13.5, "#343b4a", 400) + lbl(830, 442, "millions of molecules with the same density.", 13.5, "#343b4a", 400);
    return o;
  }

  const DEFS = `<defs><marker id="dh" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" fill="#e8744f"/></marker></defs>`;

  function render(){
    const narrow = stage.clientWidth > 0 && stage.clientWidth < 700;
    const z = narrow ? cur.zoom : 0;
    const w = 1000 - 200 * z, h = 470;
    const focus = X(cur.a);
    const x0 = clamp(focus - w / 2, 0, 1000 - w);
    svg.setAttribute("viewBox", `${f1(x0)} 0 ${f1(w)} ${f1(h)}`);
    let o = DEFS;
    if (cur.gene > 0.01) o += `<g opacity="${f3(cur.gene)}">${forkSVG(cur)}</g>`;
    if (cur.origins > 0.01) o += `<g opacity="${f3(cur.origins)}">${originsSVG()}</g>`;
    if (cur.ms > 0.01) o += `<g opacity="${f3(cur.ms)}">${msSVG()}</g>`;
    const tt = reduced ? 0 : (performance.now() - T0) / 1000;
    if (cur.hero > 0.01) o += `<g opacity="${f3(cur.hero)}">${heroSVG(tt)}</g>`;
    if (cur.models > 0.01) o += `<g opacity="${f3(cur.models)}">${modelsSVG(tt)}</g>`;
    if (cur.ms3 > 0.01) o += `<g opacity="${f3(cur.ms3)}">${ms3SVG(tt)}</g>`;
    svg.innerHTML = o;
  }

  let last = performance.now();
  function frame(now){
    if (stepTween(now)) dirty = true;
    if (cur.hero > .01 || cur.models > .01 || cur.ms3 > .01) dirty = true;
    if (dirty){ render(); dirty = false; }
    requestAnimationFrame(frame);
  }

  /* ---------- Answer checking ---------- */
  function lev(a, b){
    const m = a.length, n = b.length; const d = [];
    for (let i = 0; i <= m; i++){ d[i] = [i]; }
    for (let j = 0; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    return d[m][n];
  }
  function norm(s){ return s.toLowerCase().replace(/[’‘′`´]/g, "'").replace(/[^a-z0-9]/g, ""); }
  function matches(id, val){
    const b = BL[id], v = norm(val);
    if (!v) return false;
    return b.ans.some(a => a === v || (b.fuzzy && a.length >= 5 && lev(v, a) <= 1));
  }

  /* ---------- UI ---------- */
  function termHTML(id, cls){ return `<strong class="term ${cls || ""}">${BL[id].show}</strong>`; }
  function termEl(id, cls){ const s = document.createElement("strong"); s.className = "term " + cls; s.textContent = BL[id].show; return s; }
  function blankHTML(id){
    if (mode === "learn") return termHTML(id);
    if (bl[id]) return termHTML(id, bl[id]);
    const size = Math.max(3, BL[id].show.length + 1);
    return `<input class="blank" data-id="${id}" size="${size}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Fill in the blank">`;
  }

  function renderLegend(){
    $("legend").innerHTML = ["A","T","G","C"].map(b => `<span><i style="background:${BASE[b][0]};color:${BASE[b][1]}">${b}</i>${{A:"Adenine",T:"Thymine",G:"Guanine",C:"Cytosine"}[b]}</span>`).join("");
  }

  function renderBubble(){
    const st = STEPS[idx];
    $("stepNo").textContent = `Step ${idx + 1} of ${STEPS.length}`;
    $("stepTitle").textContent = st.title;
    textEl.innerHTML = st.text.replace(/\{\{(\w+)\}\}/g, (m, id) => blankHTML(id));
    textEl.querySelectorAll("input.blank").forEach(inp => {
      inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); check(); } });
      inp.addEventListener("input", () => inp.classList.remove("wrong"));
    });
    showAfter();
    $("bubbleFoot").innerHTML = st.more ? `<button class="more-btn" data-more="${st.more}">Learn more</button>` : "";
    $("bubbleFoot").querySelectorAll("[data-more]").forEach(b => b.addEventListener("click", () => openMore(b.dataset.more)));
    fb.textContent = ""; fb.className = "feedback";
    updateButtons();
    bubble.classList.remove("pop"); void bubble.offsetWidth; bubble.classList.add("pop");
    const firstInput = textEl.querySelector("input.blank");
    if (firstInput && mode === "test") firstInput.focus({preventScroll:true});
  }
  function showAfter(){
    const st = STEPS[idx];
    if (st.after && stepResolved(idx)){ afterEl.textContent = st.after; afterEl.hidden = false; }
    else { afterEl.hidden = true; }
  }

  function updateButtons(){
    const open = mode === "test" && !!textEl.querySelector("input.blank");
    checkRow.hidden = !open;
    nextBtn.disabled = open || !gateDone(idx);
    backBtn.disabled = idx === 0;
    replayBtn.disabled = idx === 0;
    nextBtn.textContent = idx === LAST ? "Start over" : "Next";
  }

  function renderNav(){
    const dots = $("dots"); dots.innerHTML = "";
    STEPS.forEach((st, i) => {
      const b = document.createElement("button");
      b.className = "dot" + (i === idx ? " current" : (i < furthest || i < idx ? " seen" : ""));
      b.textContent = i + 1;
      b.setAttribute("aria-label", `Go to step ${i + 1}: ${st.title}`);
      b.disabled = mode === "test" && i > furthest;
      b.addEventListener("click", () => goTo(i));
      dots.appendChild(b);
    });
    renderLegend();
  }

  function renderSlider(){
    const el = $("polSlide"), st = STEPS[idx];
    if (!st.slider){ el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    const [lo, hi] = st.sliderRange;
    el.innerHTML = `<span class="plbl">Move the replication fork:</span><input type="range" id="polRange" min="${lo}" max="${hi}" step="0.2" value="${clamp(cur.a, lo, hi)}">`;
    $("polRange").addEventListener("input", e => { tw = null; cur.a = +e.target.value; dirty = true; });
  }
  function enterStep(i){
    idx = i;
    const st = STEPS[i], res = stepResolved(i);
    if (res) furthest = Math.max(furthest, i + 1);
    animateTo(res ? st.state : prevState(i));
    renderBubble(); renderNav(); renderGate(); renderSlider(); dirty = true;
  }
  function goTo(i){ enterStep(clamp(i, 0, LAST)); }

  function resolvedNow(){
    if (!stepResolved(idx)){ updateButtons(); renderNav(); renderGate(); return; }
    furthest = Math.max(furthest, idx + 1);
    updateButtons(); renderNav(); showAfter();
    animateTo(STEPS[idx].state);
    dirty = true;
    nextBtn.focus({preventScroll:true});
  }

  function check(){
    const inputs = [...textEl.querySelectorAll("input.blank")];
    let wrong = 0, empty = 0;
    inputs.forEach(inp => {
      const id = inp.dataset.id;
      if (!inp.value.trim()){ empty++; wrong++; return; }
      if (matches(id, inp.value)){ bl[id] = "correct"; inp.replaceWith(termEl(id, "correct")); }
      else { wrong++; inp.classList.remove("wrong"); void inp.offsetWidth; inp.classList.add("wrong"); }
    });
    if (wrong){
      fb.className = "feedback bad";
      fb.textContent = empty === wrong ? "Type an answer in each blank, or tap Move on to see it." : "Not quite. Try again, or tap Move on to see the answer.";
      const nextInput = textEl.querySelector("input.blank.wrong") || textEl.querySelector("input.blank");
      if (nextInput) nextInput.focus({preventScroll:true});
      updateButtons();
      if (!textEl.querySelector("input.blank")) resolvedNow();
    } else {
      fb.className = "feedback good"; fb.textContent = "Correct!";
      resolvedNow();
    }
  }
  function moveOn(){
    textEl.querySelectorAll("input.blank").forEach(inp => { const id = inp.dataset.id; bl[id] = "revealed"; inp.replaceWith(termEl(id, "revealed")); });
    fb.className = "feedback warn"; fb.textContent = "Here's the answer. Read it over, then tap Next.";
    resolvedNow();
  }

  function setMode(m){
    mode = m;
    $("learnBtn").setAttribute("aria-pressed", m === "learn");
    $("testBtn").setAttribute("aria-pressed", m === "test");
    $("modeHint").textContent = m === "learn"
      ? ""
      : "Test mode: type the missing term to keep going. Stuck? Tap Move on to see the answer.";
    if (m === "test") furthest = Math.max(furthest, 0);
    enterStep(idx);
  }
  function restart(){
    for (const k in gates) delete gates[k];
    GATES.incubateHeavy.dropped = false; GATES.incubateHeavy.incubated = false;
    GATES.incubateLight1.dropped = false; GATES.incubateLight1.incubated = false; GATES.incubateLight1.picked = null; GATES.incubateLight1.correct = false;
    GATES.incubateLight2.incubated = false; GATES.incubateLight2.picked = null; GATES.incubateLight2.correct = false;
    bl = {}; furthest = 0; idx = 0;
    cur = {...S_HERO}; tw = null;
    enterStep(0);
  }
  function replay(){
    if (idx === 0) return;
    cur = {...prevState(idx)};
    if (stepResolved(idx)) animateTo(STEPS[idx].state);
    dirty = true;
  }

  $("learnBtn").addEventListener("click", () => setMode("learn"));
  $("testBtn").addEventListener("click", () => setMode("test"));
  $("restartBtn").addEventListener("click", restart);
  $("checkBtn").addEventListener("click", check);
  $("moveOnBtn").addEventListener("click", moveOn);
  backBtn.addEventListener("click", () => goTo(idx - 1));
  replayBtn.addEventListener("click", replay);
  nextBtn.addEventListener("click", () => { if (idx === LAST) restart(); else goTo(idx + 1); });
  $("moreClose").addEventListener("click", closeMore);
  $("moreOverlay").addEventListener("click", e => { if (e.target.id === "moreOverlay") closeMore(); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("moreOverlay").hidden){ closeMore(); return; }
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" && !nextBtn.disabled && idx < LAST) goTo(idx + 1);
    if (e.key === "ArrowLeft" && idx > 0) goTo(idx - 1);
  });
  window.addEventListener("resize", () => { dirty = true; });

  setMode("learn");
  requestAnimationFrame(frame);

  // exposed for testing only
  window.__rep = {STEPS, goTo, check, moveOn, setMode, openMore, closeMore, get idx(){return idx;}, get cur(){return cur;}, get bl(){return bl;}, matches, GATES};
})();
</script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const PAGE = (location.pathname.split("/").pop() || "index.html");
  const testing = () => { const t = $("testBtn"); return t && t.getAttribute("aria-pressed") === "true"; };

  const row = $("checkRow"), moveOn = $("moveOnBtn");
  if (row && moveOn && window.__BL){
    const hb = document.createElement("button");
    hb.className = "btn hint"; hb.id = "hintBtn"; hb.textContent = "Hint";
    row.insertBefore(hb, moveOn);
    hb.addEventListener("click", () => {
      const ins = [...document.querySelectorAll("#stepText input.blank")];
      ins.forEach(inp => {
        const b = window.__BL[inp.dataset.id]; if (!b) return;
        const w = b.show, lvl = Math.min((+inp.dataset.hint || 0) + 1, Math.max(1, Math.ceil(w.length / 2)));
        inp.dataset.hint = lvl;
        if (inp.classList.contains("wrong")) inp.value = "";
        inp.placeholder = w.slice(0, lvl) + w.slice(lvl).replace(/[^\s-]/g, "_");
        inp.size = Math.max(inp.size || 3, w.length + 1);
      });
      const fb = $("feedback");
      if (fb && ins.length){ fb.className = "feedback warn"; fb.textContent = "Hint: the first letter" + (ins.some(i => +i.dataset.hint > 1) ? "s are" : " is") + " shown, and each dash is one letter. Tap Hint again for more."; }
      const f = ins[0]; if (f) f.focus({preventScroll:true});
    });
  }

  let links = []; try { links = JSON.parse(document.body.dataset.next || "[]"); } catch (e) {}
  const bubble = $("bubble");
  let bridge = null;
  if (links.length && bubble){
    bridge = document.createElement("div"); bridge.className = "bridge callout"; bridge.hidden = true; bridge.setAttribute("role", "note");
    bridge.innerHTML = `<b>${document.body.dataset.nextLabel || "Where to next?"}</b>` + (document.body.dataset.nextText ? `<p>${document.body.dataset.nextText}</p>` : "")
      + `<div class="links">` + links.map((l, i) => `<a class="btn ${i ? "secondary" : "primary go"}" href="${l[1]}">${l[0]}</a>`).join("") + `</div>`;
    bubble.insertAdjacentElement("afterend", bridge);
  }

  const next = $("nextBtn");
  let toasted = false;
  function watch(){
    if (!next) return;
    const last = next.textContent.trim() === "Start over";
    if (bridge) bridge.hidden = !last;
    if (last && testing() && !next.disabled){
      let was = false; try { was = localStorage.getItem("bio112-done:" + PAGE) === "1"; localStorage.setItem("bio112-done:" + PAGE, "1"); } catch (e) {}
      if (!toasted && !was){
        toasted = true;
        const t = document.createElement("div"); t.className = "donetoast"; t.setAttribute("role", "status");
        t.textContent = "Module complete! It now has a checkmark on the home page.";
        document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
      }
    }
  }
  if (next){ new MutationObserver(watch).observe(next, {attributes:true, childList:true, characterData:true, subtree:true}); watch(); }
})();
</script>
