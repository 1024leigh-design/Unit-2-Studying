<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Respiration Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, f3, lerp, clamp, smooth, seg, C} = A;

  const BL = {
    glycolysis:{show:"glycolysis", ans:["glycolysis"], fuzzy:true},
    krebs:{show:"Krebs cycle", ans:["krebscycle","krebs","citricacidcycle","tcacycle","tca"], fuzzy:true},
    etc:{show:"electron transport chain", ans:["electrontransportchain","etc","electrontransport"], fuzzy:true},
    matrix:{show:"mitochondrial matrix", ans:["mitochondrialmatrix","matrix"], fuzzy:true},
    inner:{show:"inner mitochondrial membrane", ans:["innermitochondrialmembrane","innermembrane","innermitochondria"], fuzzy:true},
    plasma:{show:"plasma membrane", ans:["plasmamembrane","cellmembrane","membrane","cytoplasmicmembrane"], fuzzy:true},
    pyruvate:{show:"pyruvate", ans:["pyruvate","pyruvicacid","pyruvates"], fuzzy:true},
    cytoplasm:{show:"cytoplasm", ans:["cytoplasm","cytosol"], fuzzy:true},
    invest:{show:"2", ans:["2","two"]},
    twice:{show:"twice", ans:["twice","two","2","2times","twotimes","double"], fuzzy:true},
    four:{show:"4", ans:["4","four"]},
    nadh:{show:"NADH", ans:["nadh"]},
    net:{show:"2", ans:["2","two"]},
    nadplus:{show:"NAD⁺", ans:["nad","nadplus"]},
    fad:{show:"FAD", ans:["fad"]},
    total:{show:"38", ans:["38","thirtyeight"]},
    phosphorylation:{show:"phosphorylation", ans:["phosphorylation","phosphorylated","phosphorylate"], fuzzy:true},
    substrate:{show:"Substrate-level", ans:["substratelevel","substrate"], fuzzy:true},
    oxidative:{show:"Oxidative", ans:["oxidative"], fuzzy:true},
    atp:{show:"ATP", ans:["atp","adenosinetriphosphate"], fuzzy:true},
    fermentation:{show:"fermentation", ans:["fermentation","fermenting","ferment"], fuzzy:true}
  };
  const MORE = {
    atp:{title:"Why \"up to\" 38 ATP?", html:`<p>38 ATP is the maximum, most often quoted for prokaryotes. In eukaryotes the number is usually a bit lower (about 36), because moving NADH from glycolysis into the mitochondrion costs some energy. Real cells often make even less, since membranes leak some H⁺.</p><p>Remember the pattern: glycolysis and Krebs make a little ATP directly, and the electron transport chain makes most of it.</p>`},
    atpdaily:{title:"How much ATP do you use?", html:`<p>You recycle roughly your own body weight in ATP every day! Your body only holds about 250 grams of ATP at any moment, so each ATP is used and rebuilt from ADP + P thousands of times a day. A bacterium dividing quickly also burns through ATP to build new proteins, DNA, and cell wall.</p><p><b>Where your Calories go.</b> Your daily metabolic rate (the Calories you burn in a day) is basically a measure of how fast you're making and spending ATP. The Calories you eat are the energy stored in the bonds of food. Breaking the food down captures part of that energy (roughly 40%) in ATP, and the rest is released as heat, which keeps you warm. A person burning about 2,000 Calories a day turns over on the order of 100 moles of ATP. When you exercise, your muscles spend ATP faster, your metabolic rate goes up, and you need more food energy to rebuild that ATP.</p>`}
  };


  /* ================= Scenes ================= */
  /* slide 1: the whole equation drawn molecule by molecule. Glucose's 6 carbons fly over to become the 6 CO2,
     the 6 O2 become 6 H2O, and ATP coins pile up as the three stages light up in turn. */
  const OV = {ring:[95, 200], o2:[], co2:[], h2o:[], coins:[]};
  for (let i = 0; i < 6; i++){ const c = i % 2, r = Math.floor(i / 2); OV.o2.push([218 + c * 52, 150 + r * 50]); OV.co2.push([556 + c * 80, 150 + r * 50]); OV.h2o.push([742 + c * 52, 150 + r * 50]); }
  for (let k = 0; k < 38; k++) OV.coins.push([872 + (k % 5) * 18, 132 + Math.floor(k / 5) * 17]);
  const coinAt = k => k < 2 ? 2.0 : k < 4 ? 3.2 : 3.9 + (k - 4) * .045;
  function overviewScene(t, R){
    const T = 10.5, tt = t % T, reset = smooth(seg(tt, 9.6, 10.3)), fwd = 1 - reset;
    const stage = tt >= 1.2 && tt < 2.4 ? 0 : tt >= 2.4 && tt < 3.6 ? 1 : tt >= 3.6 && tt < 5 ? 2 : -1;
    let o = A.tx(500, 40, "Cellular respiration: one glucose, completely broken down", "t20 mid") + A.tx(500, 76, "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + ATP", "t16 mid", `style="fill:#5b3fb0"`);
    /* plus signs, the big arrow, and the labels that always stay put */
    o += A.tx(165, 210, "+", "t20 mid") + A.tx(705, 210, "+", "t20 mid") + A.tx(845, 210, "+", "t20 mid");
    o += A.arrow(312, 200, 528, 200, "#5a6376", 5) + A.tx(420, 186, "enzymes, step by step", "t12 mid muted");
    o += A.tx(95, 286, "C₆H₁₂O₆", "t16 mid") + A.tx(95, 304, "1 glucose", "t12 mid muted");
    o += A.tx(244, 286, "6 O₂", "t16 mid") + A.tx(244, 304, "oxygen", "t12 mid muted");
    o += A.tx(596, 286, "6 CO₂", "t16 mid") + A.tx(596, 304, "carbon dioxide", "t12 mid muted");
    o += A.tx(768, 286, "6 H₂O", "t16 mid") + A.tx(768, 304, "water", "t12 mid muted");
    o += A.tx(908, 286, "up to 38", "t16 mid", `style="fill:#5b3fb0"`) + A.tx(908, 304, "ATP", "t12 mid", `style="fill:#5b3fb0"`);
    /* glucose ring: bonds fade as the carbons leave, one at a time */
    const ringPt = i => { const a = -Math.PI / 2 + i * Math.PI / 3; return [OV.ring[0] + 34 * Math.cos(a), OV.ring[1] + 34 * Math.sin(a)]; };
    const cp = i => smooth(seg(tt, 1.2 + .28 * i, 3.4 + .28 * i));
    for (let i = 0; i < 6; i++){ const a = ringPt(i), b = ringPt((i + 1) % 6), on = Math.min(1 - cp(i), 1 - cp((i + 1) % 6)) * fwd + reset;
      o += `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${C.carbon}" stroke-width="5" opacity="${f3(clamp(on, 0, 1))}"/>`; }
    for (let i = 0; i < 6; i++){
      const p = cp(i), s = ringPt(i), d = OV.co2[i], arr = smooth(seg(p, .8, 1));
      const x = lerp(s[0], d[0], p), y = lerp(s[1], d[1], p) - 70 * Math.sin(Math.PI * p);
      if (arr > 0) o += A.op(arr * fwd, `<circle cx="${d[0] - 21}" cy="${d[1]}" r="10" fill="${C.O}"/><circle cx="${d[0] + 21}" cy="${d[1]}" r="10" fill="${C.O}"/><line x1="${d[0] - 13}" y1="${d[1]}" x2="${d[0] + 13}" y2="${d[1]}" stroke="#343b4a" stroke-width="3"/>`);
      o += A.op(fwd, `<circle cx="${f1(x)}" cy="${f1(y)}" r="12" fill="${C.carbon}" stroke="#fff" stroke-width="2"/><text x="${f1(x)}" y="${f1(y + 4)}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>`);
      if (reset > 0) o += A.op(reset, `<circle cx="${f1(s[0])}" cy="${f1(s[1])}" r="12" fill="${C.carbon}" stroke="#fff" stroke-width="2"/><text x="${f1(s[0])}" y="${f1(s[1] + 4)}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>`);
    }
    o += A.op(clamp(1 - cp(0) + reset, 0, 1), A.tx(OV.ring[0], OV.ring[1] + 5, "glucose", "t11 mid muted"));
    /* O2 travels last (it's the final electron acceptor in stage 3) and becomes water */
    for (let i = 0; i < 6; i++){
      const p = smooth(seg(tt, 3.6 + .12 * i, 5 + .12 * i)), s = OV.o2[i], d = OV.h2o[i], arr = smooth(seg(p, .85, 1));
      const x = lerp(s[0], d[0], p), y = lerp(s[1], d[1], p) + 60 * Math.sin(Math.PI * p);
      o += A.op(1 - arr, A.o2(x, y)) + A.op(arr * fwd, A.h2o(d[0], d[1]));
      if (reset > 0) o += A.op(reset, A.o2(s[0], s[1]));
    }
    /* ATP coins: 2 from glycolysis, 2 from Krebs, the rest from the ETC */
    OV.coins.forEach((c, k) => { const on = smooth(seg(tt, coinAt(k), coinAt(k) + .25)) * fwd, col = k < 2 ? "#b83a34" : k < 4 ? "#9a6212" : "#3f4cc0";
      o += `<circle cx="${c[0]}" cy="${c[1]}" r="7" fill="${on > .02 ? C.atp : "#f1eef8"}" stroke="${on > .02 ? col : "#ddd6ee"}" stroke-width="${on > .02 ? 2.5 : 1.2}" opacity="${f3(.35 + .65 * on)}"/>`; });
    /* the three stages, lit in turn as the molecules move */
    const ST = [[`1. ${R("glycolysis") === "?" ? "?" : "Glycolysis"}`, "glucose split → 2 pyruvate", "#b83a34", "#fbe8e7"], [`2. ${R("krebs")}`, "carbons leave as CO₂", "#9a6212", "#fff3dc"], [`3. ${R("etc") === "?" ? "?" : "Electron transport chain"}`, "O₂ takes electrons → H₂O, most ATP", "#3f4cc0", "#e7e9fb"]];
    ST.forEach((s, i) => { const x = 180 + i * 320, on = stage === i;
      o += `<rect x="${x - 145}" y="340" width="290" height="70" rx="18" fill="${on ? s[3] : "#fff"}" stroke="${s[2]}" stroke-width="${on ? 5 : 2.5}"/>` + A.tx(x, 370, s[0], "t16 mid", `style="fill:${s[2]}"`) + A.tx(x, 395, s[1], "t12 mid");
      if (i < 2) o += A.arrow(x + 150, 375, x + 170, 375, "#5a6376", 3); });
    o += A.tx(500, 446, "Every carbon of glucose leaves as CO₂. The O₂ ends up in water. The energy is caught as ATP.", "t14 mid", `style="fill:#5a6376"`);
    return o;
  }
  /* ---- organic cells with phospholipid-bilayer membranes ---- */
  /* sample a closed curve f(a) evenly by arc length: returns n points with outward normals */
  function along(f, n){
    const M = 720, P = [], L = [0];
    for (let i = 0; i <= M; i++) P.push(f(i / M * 2 * Math.PI));
    for (let i = 1; i <= M; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    const out = []; let j = 0;
    for (let k = 0; k < n; k++){
      const want = k / n * L[M]; while (j < M - 1 && L[j + 1] < want) j++;
      const u = (want - L[j]) / ((L[j + 1] - L[j]) || 1), x = lerp(P[j][0], P[j + 1][0], u), y = lerp(P[j][1], P[j + 1][1], u);
      let nx = P[j + 1][1] - P[j][1], ny = -(P[j + 1][0] - P[j][0]); const d = Math.hypot(nx, ny) || 1;
      out.push([x, y, nx / d, ny / d]);
    }
    return out;
  }
  const pathOf = (f, n) => "M" + Array.from({length:n}, (_, i) => { const p = f(i / n * 2 * Math.PI); return f1(p[0]) + "," + f1(p[1]); }).join(" L") + " Z";
  /* two rows of round heads with tails pointing in toward each other */
  function bilayer(f, n, o){
    o = o || {}; const w = o.w || 6, hr = o.hr || 2.8; let tails = "", heads = "";
    along(f, n).forEach(([x, y, nx, ny]) => {
      const ox = x + nx * w, oy = y + ny * w, ix = x - nx * w, iy = y - ny * w;
      tails += `M${f1(ox)},${f1(oy)} L${f1(x + nx * .8)},${f1(y + ny * .8)} M${f1(ix)},${f1(iy)} L${f1(x - nx * .8)},${f1(y - ny * .8)} `;
      heads += `<circle cx="${f1(ox)}" cy="${f1(oy)}" r="${hr}"/><circle cx="${f1(ix)}" cy="${f1(iy)}" r="${hr}"/>`;
    });
    return `<path d="${tails}" stroke="${o.tail || "#c9a15a"}" stroke-width="1.4" fill="none"/><g fill="${o.head || "#e0a83e"}">${heads}</g>`;
  }
  const wobble = (cx, cy, rx, ry, w, ph, rot) => a => { const r = 1 + w * Math.sin(3 * a + ph) + w * .5 * Math.sin(5 * a + ph * 1.7), x = rx * r * Math.cos(a), y = ry * r * Math.sin(a), c = Math.cos(rot || 0), s = Math.sin(rot || 0); return [cx + x * c - y * s, cy + x * s + y * c]; };
  const dots = (pts, col) => pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${col}"/>`).join("");
  let WHERE_STATIC = null;
  function whereStatic(){
    if (WHERE_STATIC) return WHERE_STATIC;
    /* eukaryote: cell, nucleus, one mitochondrion with a folded inner membrane */
    const cell = wobble(250, 262, 212, 172, .035, .6), mOut = wobble(298, 322, 128, 64, .02, 1.2, -.08);
    const mIn = a => { const fold = Math.pow(Math.max(0, Math.sin(7 * a)), 3), r = .8 - .32 * fold, c = Math.cos(-.08), s = Math.sin(-.08), x = 128 * r * Math.cos(a), y = 64 * r * Math.sin(a); return [298 + x * c - y * s, 322 + x * s + y * c]; };
    let e = `<path d="${pathOf(cell, 240)}" fill="#f6f1fb"/>` + bilayer(cell, 230);
    e += dots([[90, 300], [110, 340], [200, 410], [250, 150], [380, 160], [420, 240], [70, 250], [160, 120], [330, 420], [430, 330]], "#9a86cf");
    e += `<circle cx="128" cy="205" r="56" fill="#ebe4f8" stroke="#7d64c4" stroke-width="2.5"/><circle cx="128" cy="205" r="49" fill="none" stroke="#7d64c4" stroke-width="2.5" stroke-dasharray="26 6"/><circle cx="138" cy="210" r="15" fill="#b9a6e0"/>`;
    e += `<path d="M95,190 q8,-14 18,-2 t18,4 M100,228 q10,10 20,0 t20,2 M150,180 q8,10 16,0" fill="none" stroke="#9a86cf" stroke-width="2"/>` + A.tx(128, 248, "nucleus", "t11 mid", `style="fill:#5b3fb0"`);
    e += `<path d="${pathOf(mOut, 200)}" fill="#fde9dc"/>` + bilayer(mOut, 150, {head:"#d9673f", tail:"#e8a083", w:5, hr:2.4});
    e += `<path d="${pathOf(mIn, 400)}" fill="#fbd0b8"/>` + bilayer(mIn, 230, {head:"#c4532f", tail:"#e8a083", w:4.5, hr:2.2});
    e += A.tx(298, 405, "mitochondrion", "t11 mid", `style="fill:#a8401f"`);
    /* prokaryote: rod with a cell wall, plasma membrane bilayer, nucleoid and plasmids */
    const rod = (sc) => a => { const c = Math.cos(a), s = Math.sin(a), n = 2 / 4; return [800 + 150 * sc * Math.sign(c) * Math.pow(Math.abs(c), n), 258 + 82 * sc * Math.sign(s) * Math.pow(Math.abs(s), n) + 6 * Math.sin(a * 2)]; };
    let p = `<path d="${pathOf(rod(1.08), 240)}" fill="#e3efd9" stroke="#5f8a4f" stroke-width="6"/><path d="${pathOf(rod(1), 240)}" fill="#f1f7ec"/>` + bilayer(rod(.985), 200);
    p += dots([[690, 230], [760, 320], [905, 250], [840, 200], [700, 290], [930, 290], [770, 205]], "#7fae6c");
    const nuc = a => { const r = 30 + 7 * Math.sin(7 * a) + 4 * Math.sin(13 * a + 1); return [862 + r * Math.cos(a), 262 + r * .8 * Math.sin(a)]; };
    p += `<path d="${pathOf(nuc, 160)}" fill="none" stroke="#7a5cc0" stroke-width="2.5"/>` + A.tx(862, 318, "nucleoid (DNA)", "t11 mid", `style="fill:#5b3fb0"`);
    [[905, 208], [692, 318]].forEach(([x, y]) => { p += `<circle cx="${x}" cy="${y}" r="10" fill="none" stroke="#c4532f" stroke-width="2.5"/><circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#c4532f" stroke-width="1.5"/>`; });
    p += A.tx(890, 212, "plasmid", "t11 end", `style="fill:#a8401f"`);
    WHERE_STATIC = {e, p};
    return WHERE_STATIC;
  }
  function whereScene(t, R){
    const S = whereStatic();
    let o = A.tx(250, 40, "Eukaryote", "t20 mid") + A.tx(750, 40, "Prokaryote", "t20 mid") + `<line x1="500" y1="56" x2="500" y2="450" stroke="#d9dee7" stroke-width="2" stroke-dasharray="6 6"/>`;
    o += S.e;
    o += A.pill(318, 140, "1. Glycolysis", "#b83a34", 1, 13) + A.tx(318, 166, R("cytoplasm") === "?" ? "?" : "in the cytoplasm", "t12 mid");
    o += A.pill(298, 328, "2. Krebs", "#9a6212", 1, 13) + A.tx(298, 352, R("matrix") === "?" ? "?" : "matrix", "t11 mid", `style="fill:#7a3418"`);
    o += A.pill(410, 205, "3. ETC", "#3f4cc0", 1, 13) + A.tx(410, 230, R("inner") === "?" ? "?" : "inner membrane", "t11 mid", `style="fill:#2c3796"`) + A.arrow(400, 238, 378, 288, "#3f4cc0", 2.5);
    /* bacterial flagella whip from the left pole */
    for (let k = 0; k < 2; k++){ let d = ""; for (let x = 640; x >= 520; x -= 4){ const y = 240 + k * 40 + 9 * Math.sin((x + t * 140 + k * 30) / 16) * (640 - x) / 120; d += (x === 640 ? "M" : " L") + x + "," + f1(y); } o += `<path d="${d}" fill="none" stroke="#5f8a4f" stroke-width="3" stroke-linecap="round"/>`; }
    o += A.tx(565, 218, "flagella", "t11 mid", `style="fill:#3f6b33"`);
    o += S.p;
    o += A.pill(740, 228, "1. Glycolysis", "#b83a34", 1, 13) + A.pill(740, 290, "2. Krebs", "#9a6212", 1, 13) + A.tx(750, 380, "Glycolysis and Krebs: both in the cytoplasm", "t12 mid");
    o += A.pill(800, 120, "3. ETC", "#3f4cc0", 1, 13) + A.arrow(800, 134, 800, 166, "#3f4cc0", 2.5);
    o += A.tx(750, 412, R("plasma") === "?" ? "?" : "ETC: in the plasma membrane", "t14 mid", `style="fill:#2c3796"`) + A.tx(750, 434, "(no mitochondria!)", "t12 mid muted");
    return o;
  }
  /* NADH's journey: loop A (with O2) delivers to the ETC; loop B (no O2) dumps the electrons in fermentation
     and the regenerated NAD+ travels the long way back to where it started */
  /* NADH parks just outside each box, so it never covers the box title */
  const NADP = {home:[330, 215], etc:[630, 128], ferm:[630, 300]};
  const bez = (p, a, b, c, d) => { const v = 1 - p; return [v * v * v * a[0] + 3 * v * v * p * b[0] + 3 * v * p * p * c[0] + p * p * p * d[0], v * v * v * a[1] + 3 * v * v * p * b[1] + 3 * v * p * p * c[1] + p * p * p * d[1]]; };
  const LOOP = [[760, 354], [720, 476], [330, 476], [330, 240]];
  function nadScene(t, R){
    const T = 11, tt = t % T, B = tt >= 5.5, u = B ? tt - 5.5 : tt;
    const load = smooth(seg(u, .3, 1.1)), go = smooth(seg(u, 1.4, 2.5)), drop = smooth(seg(u, 2.6, 3.2)), back = smooth(seg(u, 3.4, 5));
    const dock = B ? NADP.ferm : NADP.etc, H = NADP.home;
    let cx, cy;
    if (u < 3.4){ cx = lerp(H[0], dock[0], go); cy = lerp(H[1], dock[1], go); }
    else if (B){ [cx, cy] = bez(back, LOOP[0], LOOP[1], LOOP[2], [H[0], H[1]]); }
    else { cx = lerp(dock[0], H[0], back); cy = lerp(dock[1], H[1], back); }
    const full = load > .9 && drop < .5;
    let o = A.tx(500, 38, "Where do NADH's electrons go next?", "t20 mid") + A.tx(500, 62, "FAD (→ FADH₂) is the other carrier; you'll meet it in the Krebs cycle.", "t12 mid muted");
    /* the two destinations */
    o += A.arrow(390, 200, 650, 132, B ? "#c9cfdb" : "#3f4cc0", 3, "8 6") + A.tx(505, 146, "with O₂", "t14 mid", `style="fill:${B ? "#9aa3b5" : "#3f4cc0"}"`);
    o += A.arrow(390, 232, 650, 296, B ? "#b83a34" : "#c9cfdb", 3, "8 6") + A.tx(530, 252, "no O₂", "t14 mid", `style="fill:${B ? "#b83a34" : "#9aa3b5"}"`);
    o += `<rect x="700" y="80" width="270" height="92" rx="18" fill="${B ? "#f4f5fb" : "#e7e9fb"}" stroke="#3f4cc0" stroke-width="${B ? 1.5 : 4}"/>` + A.tx(835, 112, "Electron transport chain", "t16 mid", `style="fill:#2c3796"`) + A.tx(835, 134, "electrons' energy → lots of ATP", "t12 mid");
    for (let k = 0; k < 3; k++){ const on = B ? 0 : smooth(seg(u, 3 + k * .2, 3.25 + k * .2)) * (1 - smooth(seg(u, 4.9, 5.4))); o += A.op(on, `<circle cx="${805 + k * 30}" cy="156" r="10" fill="${C.atp}"/><text x="${805 + k * 30}" y="160" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">ATP</text>`); }
    o += `<rect x="700" y="262" width="270" height="92" rx="18" fill="${B ? "#fbe8e7" : "#fdf6f5"}" stroke="#b83a34" stroke-width="${B ? 4 : 1.5}"/>` + A.tx(835, 294, "Fermentation", "t16 mid", `style="fill:#b83a34"`) + A.tx(835, 316, "electrons go onto pyruvate", "t12 mid") + A.op(B ? drop : 0, A.tx(835, 338, "→ lactic acid or ethanol", "t12 mid", `style="fill:#8a2621"`));
    /* the recycling loop: NAD+ comes all the way back to pick up more electrons */
    let d = ""; for (let i = 0; i <= 40; i++){ const p = bez(i / 40, ...LOOP); d += (i ? " L" : "M") + f1(p[0]) + "," + f1(p[1]); }
    o += `<path d="${d}" fill="none" stroke="${B ? "#b83a34" : "#e3c4c1"}" stroke-width="3" stroke-dasharray="8 6"/>` + A.arrow(330, 270, 330, 242, B ? "#b83a34" : "#e3c4c1", 3);
    o += A.tx(545, 462, "NAD⁺ is recycled, so glycolysis can keep going", "t14 mid", `style="fill:${B ? "#b83a34" : "#c9a9a6"}"`);
    /* the electron source */
    o += A.glucoseRing(95, 215, {r:9}) + A.tx(95, 268, "glucose", "t12 mid") + A.tx(95, 284, "(glycolysis)", "t11 mid muted");
    /* high-energy callout under the carrier's home */
    o += `<rect x="24" y="318" width="282" height="96" rx="16" fill="#fff8dc" stroke="#e0b84a" stroke-width="2"/>` + A.tx(165, 344, "NADH = NAD⁺ +", "t16 mid", `style="fill:#8a5a00"`) + A.tx(165, 368, "2 HIGH-ENERGY electrons", "t16 mid", `style="fill:#8a5a00"`) + A.tx(165, 394, "energy from glucose, ready to deliver", "t12 mid muted");
    /* the carrier (drawn big), glowing while it holds the electrons */
