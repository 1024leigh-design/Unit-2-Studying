<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enzymes and Metabolism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="metab.css">
</head>
<body>
<div id="app"></div>
<script src="metab.js"></script>
<script>
(function(){
  const A = Metab.A, {f1, f3, lerp, clamp, smooth, seg, C} = A;
  /* enzyme with a V-shaped active site; w/d = notch half-width/depth (22/30 is an exact fit for SB) */
  const E = (x, y, o) => { o = o || {}; const sc = o.sc || 1, w = o.w === undefined ? 22 : o.w, d = o.d === undefined ? 30 : o.d;
    return `<g transform="translate(${f1(x)},${f1(y)}) scale(${sc})"><path d="M-60,-46 L${f1(-w)},-46 L0,${f1(-46 + d)} L${f1(w)},-46 L60,-46 C84,-46 88,-20 88,4 C88,40 60,54 0,54 C-60,54 -88,40 -88,4 C-88,-20 -84,-46 -60,-46 Z" fill="${o.col || C.enz}" stroke="#3e4aa8" stroke-width="2.5" stroke-linejoin="round"/>${o.label ? `<text x="0" y="16" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">${o.label}</text>` : ""}${o.allo ? `<rect x="66" y="10" width="26" height="26" rx="6" fill="#fff" stroke="#3e4aa8" stroke-width="2" stroke-dasharray="4 3"/>` : ""}</g>`; };
  /* substrate: ONE molecule whose V-shaped bottom matches the active site. Docked center = (enzX, enzY - 43*sc). gap > 0 splits it into two products */
  const SB = (x, y, sc, gap, o) => { o = o || {}; const g = gap || 0, col = o.col || "#2f9e63", k = o.stroke || "#1b6b43";
    const P = pts => `<polygon points="${pts.map(p => f1(p[0]) + "," + f1(p[1])).join(" ")}" fill="${col}" stroke="${k}" stroke-width="2.5" stroke-linejoin="round"/>`;
    let s = `<g transform="translate(${f1(x)},${f1(y)}) scale(${sc || 1})"${o.op === undefined ? "" : ` opacity="${f3(o.op)}"`}>`;
    if (g <= 0) s += P([[-22, -27], [22, -27], [22, -3], [0, 27], [-22, -3]]) + (o.bond ? `<line x1="0" y1="-22" x2="0" y2="19" stroke="#fff" stroke-width="3" stroke-dasharray="5 3" opacity="${f3(o.bond)}"/>` : "");
    else s += P([[-22 - g, -27], [-g, -27], [-g, 27], [-22 - g, -3]]) + P([[22 + g, -27], [g, -27], [g, 27], [22 + g, -3]]);
    return s + `</g>`; };
  const sq = (x, y, s, col) => `<rect x="${f1(x - 22 * s)}" y="${f1(y - 22 * s)}" width="${f1(44 * s)}" height="${f1(44 * s)}" rx="5" fill="${col || C.orange}" stroke="#a8461f" stroke-width="2.5"/>`;
  const circ = (x, y, s) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(24 * s)}" fill="#4f7fd8" stroke="#2c3796" stroke-width="2.5"/>`;
  const svgDrag = Metab.svgDrag;
  /* where a draggable item is drawn: under the pointer while dragged, otherwise at home */
  const at = (st, k, x, y) => st && st.drag && st.drag.moved && st.drag.kind === k ? [st.drag.x, st.drag.y] : [x, y];
  const pickRing = (st, k, x, y, r) => st && st.pick === k ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="none" stroke="${C.gold}" stroke-width="4" stroke-dasharray="6 4"/>` : "";
  const hit = (x, y, r) => `<circle cx="${f1(x)}" cy="${f1(y)}" r="${r}" fill="#fff" opacity="0"/>`;
  const spark = (x, y, s) => A.op(s, `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(8 + 12 * s)}" fill="#ffe36b" opacity=".75"/>` + [0, 1, 2, 3].map(j => { const a = j * Math.PI / 4, r = 12 + 12 * s; return `<line x1="${f1(x - r * Math.cos(a))}" y1="${f1(y - r * Math.sin(a))}" x2="${f1(x + r * Math.cos(a))}" y2="${f1(y + r * Math.sin(a))}" stroke="#f2b134" stroke-width="3" stroke-linecap="round"/>`; }).join(""));
  const initMsg = (g, api, s) => { if (!g.querySelector("#gateMsg").textContent) api.msg(s, ""); };

  /* ================= Blanks ================= */
  const BL = {
    metabolism:{show:"metabolism", ans:["metabolism"], fuzzy:true},
    catabolism:{show:"Catabolism", ans:["catabolism","catabolic"], fuzzy:true},
    anabolism:{show:"Anabolism", ans:["anabolism","anabolic"], fuzzy:true},
    pathway:{show:"metabolic pathway", ans:["metabolicpathway","pathway","metabolicpathways","pathways"], fuzzy:true},
    amphibolic:{show:"amphibolic", ans:["amphibolic"], fuzzy:true},
    collision:{show:"collision", ans:["collision","collide","collisions"], fuzzy:true},
    activation:{show:"activation", ans:["activation"], fuzzy:true},
    rate:{show:"reaction rate", ans:["reactionrate","rate"], fuzzy:true},
    catalysts:{show:"catalysts", ans:["catalysts","catalyst"], fuzzy:true},
    lowers:{show:"lowers", ans:["lowers","lower","decreases","decrease","reduces","reduce","lowering"], fuzzy:true},
    substrate:{show:"substrate", ans:["substrate","substrates","reactant","reactants"], fuzzy:true},
    activesite:{show:"active site", ans:["activesite","active"], fuzzy:true},
    esc:{show:"enzyme-substrate complex", ans:["enzymesubstratecomplex","enzymesubstrate","escomplex","es"], fuzzy:true},
    products:{show:"products", ans:["products","product"], fuzzy:true},
    inducedfit:{show:"induced fit", ans:["inducedfit","induced"], fuzzy:true},
    turnover:{show:"turnover number", ans:["turnovernumber","turnover"], fuzzy:true},
    cofactors:{show:"Cofactors", ans:["cofactors","cofactor"], fuzzy:true},
    apoenzyme:{show:"apoenzyme", ans:["apoenzyme","apoenzymes"], fuzzy:true},
    denature:{show:"denature", ans:["denature","denatures","denatured","denaturation","unfold"], fuzzy:true},
    saturation:{show:"saturation", ans:["saturation","saturated","saturate","saturationpoint"], fuzzy:true},
    allosteric:{show:"allosteric", ans:["allosteric"], fuzzy:true},
    competitive:{show:"Competitive", ans:["competitive"], fuzzy:true},
    noncompetitive:{show:"Non-competitive", ans:["noncompetitive","noncomp"], fuzzy:true},
    first:{show:"first", ans:["first","1st","one","1","firstenzyme"]},
    feedback:{show:"feedback", ans:["feedback"], fuzzy:true}
  };

  /* ================= Learn more ================= */
  const MORE = {
    meta:{title:"Metabolism by the numbers", html:`<p>A single <i>E. coli</i> cell carries out well over a thousand different chemical reactions, and it can divide about every 20 minutes when food is plentiful. Every one of those reactions is sped up by a specific enzyme.</p><p>Catabolism and anabolism are linked by ATP: catabolic reactions make ATP, and anabolic reactions spend it.</p>`},
    ea:{title:"Why don't things just burst into flames?", html:`<p>Sugar and oxygen could react to release lots of energy, but a sugar cube sitting in air doesn't catch fire on its own. The activation energy barrier is too high at room temperature. A flame supplies that energy; inside a cell, enzymes lower the barrier instead, so the same reaction can happen at body temperature, one controlled step at a time.</p>`},
    names:{title:"How enzymes get their names", html:`<p>Most enzyme names end in <b>-ase</b> and hint at their job: lactase splits lactose, DNA polymerase builds DNA, dehydrogenases remove hydrogen atoms (electrons!), and kinases add phosphate groups.</p>`},
    vit:{title:"Vitamins are cofactor precursors", html:`<p>Many B vitamins are used to build coenzymes. Niacin (B3) becomes NAD⁺, riboflavin (B2) becomes FAD, and pantothenic acid (B5) becomes coenzyme A, which you'll meet in the Krebs cycle. That's why vitamin deficiencies can slow down metabolism. (This detail is not for memorization.)</p><p>Metal ions like Mg²⁺, Zn²⁺, Fe²⁺ and Cu²⁺ are inorganic cofactors.</p>`},
    temp:{title:"Heat-loving enzymes", html:`<p>Human enzymes work best near 37°C. But thermophilic microbes living in hot springs have enzymes that work at 70°C or more. Taq polymerase, from the hot-spring bacterium <i>Thermus aquaticus</i>, is the enzyme that makes PCR possible because it survives repeated heating to 95°C.</p>`},
    statin:{title:"Drugs as enzyme inhibitors", html:`<p>Many medicines are enzyme inhibitors. Statins compete with HMG-CoA for the active site of the enzyme that makes cholesterol. Sulfa drugs compete with a molecule bacteria use to make folic acid, which is why they work as antibiotics. Heavy metals like mercury and lead are toxic partly because they bind enzymes and change their shape.</p>`},
    fb:{title:"Feedback everywhere", html:`<p>Feedback inhibition is fast: it works on enzymes that are already made. Cells often combine it with slower gene regulation. The trp operon is a great example: tryptophan both turns off the trp genes (repression) and inhibits the first enzyme of the tryptophan pathway (feedback inhibition).</p>`}
  };

  /* ================= Scenes ================= */
  const MCARDS = [["g","Glycolysis","cat","Glycolysis splits glucose in half. That's breaking down: catabolic."],["k","Krebs cycle","cat","The Krebs cycle finishes breaking glucose down into CO₂: catabolic."],["f","Fat breakdown","cat","Breaking fats apart releases energy: catabolic."],["p","Protein synthesis","ana","Joining amino acids into a protein uses ATP: anabolic."],["d","DNA replication","ana","Copying DNA builds a brand-new strand: anabolic."],["ph","Photosynthesis","ana","Photosynthesis builds glucose out of CO₂: anabolic."]];
  const chipW = s => s.length * 7.8 + 28;
  /* centered rows of chips, wrapping past maxW */
  function chipRows(list, cx, y, maxW, gap){
    const rows = [[]]; let w = 0;
    list.forEach(c => { const cw = chipW(c[1]); if (w + cw > maxW && rows[rows.length - 1].length){ rows.push([]); w = 0; } rows[rows.length - 1].push(c); w += cw + 12; });
    const out = {};
    rows.forEach((r, ri) => { let x = cx - (r.reduce((s, c) => s + chipW(c[1]), 0) + 12 * (r.length - 1)) / 2; r.forEach(c => { const cw = chipW(c[1]); out[c[0]] = [x + cw / 2, y + ri * gap]; x += cw + 12; }); });
    return out;
  }
  const chip = (x, y, s, fill, stroke, txt, sw) => `<rect x="${f1(x - chipW(s) / 2)}" y="${f1(y - 17)}" width="${f1(chipW(s))}" height="34" rx="17" fill="${fill}" stroke="${stroke}" stroke-width="${sw || 2.5}"/>` + A.tx(x, y + 5, s, "t12 mid", `style="fill:${txt}"`);

  function metabScene(t, R, g, done){
    const st = g || {}, T = 8, tt = t % T, V = smooth(seg(tt, 0, .4)) * (1 - smooth(seg(tt, 7.3, 7.9)));
    const placed = done ? Object.fromEntries(MCARDS.map(c => [c[0], c[2]])) : (st.placed || {});
    const drag = st.drag && st.drag.moved ? st.drag : null, hover = drag && drag.y < 400 ? (drag.x < 500 ? "cat" : "ana") : null;
    let o = A.tx(500, 40, `All chemical reactions in a cell = ${R("metabolism")}`, "t20 mid");
    [["cat", 30, "#b83a34", "#fff1ef"], ["ana", 520, "#1b7f4e", "#eaf8ef"]].forEach(([k, x, col, bg]) => {
      o += `<rect x="${x}" y="60" width="450" height="336" rx="22" fill="${hover === k ? bg : "#fcfdff"}" stroke="${col}" stroke-width="${hover === k ? 4 : 2}" stroke-dasharray="${hover === k ? "0" : "7 5"}"/>`; });
    o += A.tx(255, 92, `${R("catabolism")}: breaking down`, "t16 mid", `style="fill:#b83a34"`) + A.tx(255, 114, "Bonds BREAK → energy released (ATP made)", "t12 mid muted");
    o += A.tx(745, 92, `${R("anabolism")}: building up`, "t16 mid", `style="fill:#1b7f4e"`) + A.tx(745, 114, "Bonds FORM → energy used (ATP spent)", "t12 mid muted");

    /* catabolism: a glucose ring snaps bond by bond, the carbons fly apart as CO2, and ATP is released */
    const cx = 255, cy = 214, fly = smooth(seg(tt, 1.5, 3.3)), ox = smooth(seg(tt, 3.3, 3.9));
    const pos = i => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + lerp(44, 150, fly) * Math.cos(a), cy + lerp(44, 62, fly) * Math.sin(a)]; };
    let cat = "";
    for (let k = 0; k < 6; k++){
      const a = pos(k), b = pos((k + 1) % 6), b0 = 1.2 + .28 * k, br = seg(tt, b0, b0 + .12);
      if (br < 1) cat += `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${C.carbon}" stroke-width="6" opacity="${f3(1 - br)}"/>`;
      const sp = Math.sin(Math.PI * seg(tt, b0, b0 + .45)); if (sp > .01) cat += spark((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, sp);
    }
    for (let i = 0; i < 6; i++){ const p = pos(i); if (ox > 0) cat += A.co2(p[0], p[1], ox); cat += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="12" fill="${C.carbon}" stroke="#fff" stroke-width="2"/><text x="${f1(p[0])}" y="${f1(p[1] + 4)}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">C</text>`; }
    cat += A.op(1 - fly, A.tx(cx, cy + 5, "glucose", "t12 mid"));
    const atpC = smooth(seg(tt, 2.9, 3.5));
    for (let k = 0; k < 5; k++){ const a = -Math.PI / 2 + (k - 2) * .5, d = 30 + 60 * seg(tt, 2.7, 3.7); cat += A.op(Math.sin(Math.PI * seg(tt, 2.7, 3.9)), `<text x="${f1(cx + d * Math.cos(a))}" y="${f1(cy + 8 + d * Math.sin(a))}" font-size="20" text-anchor="middle">⚡</text>`); }
    cat += A.op(atpC, `<g transform="translate(${cx - 15},${f1(cy + 4)}) scale(${f3(.6 + .3 * atpC)})">${A.atp(0, 0, 3, {label:false})}</g>` + A.tx(cx, cy - 22, "ATP made!", "t12 mid", `style="fill:#1b7f4e"`));
    cat += A.op(ox, A.tx(cx, 308, "6 CO₂ + energy", "t12 mid muted"));
    o += A.op(V, cat);

    /* anabolism: ATP is spent, then amino acids link up bond by bond into a protein */
    const ax = 745, ay = 214, AAC = ["#e8744f", "#4f7fd8", "#f2b134", "#8e5bd0", "#2f9e63"], S0 = [[-160, -42], [150, -50], [-135, 50], [158, 46], [20, -40]];
    const atpIn = smooth(seg(tt, .3, 1.3)), spend = smooth(seg(tt, 1.4, 1.9)), join = smooth(seg(tt, 1.9, 3.1)), out = smooth(seg(tt, 1.9, 2.6));
    const fin = i => [ax + (i - 2) * 58, ay + (i % 2 ? 14 : -14)], bp = i => [lerp(ax + S0[i][0], fin(i)[0], join), lerp(ay + S0[i][1], fin(i)[1], join)];
    let ana = "";
    ana += A.op(atpIn * (1 - spend), `<g transform="translate(${f1(lerp(930, ax, atpIn) - 15)},${ay}) scale(.8)">${A.atp(0, 0, 3, {label:false})}</g>` + A.tx(lerp(930, ax, atpIn), ay - 20, "ATP", "t12 mid"));
    ana += A.op(spend * (1 - out), `<text x="${ax}" y="${ay + 8}" font-size="26" text-anchor="middle">⚡</text>`);
    ana += A.op(spend * (1 - smooth(seg(tt, 2.3, 2.8))), `<g transform="translate(${ax - 15},${f1(ay + 55 * out)}) scale(.7)">${A.atp(0, 0, 2, {label:false})}</g>` + A.tx(ax, ay + 55 * out + 30, "ATP spent → ADP + P", "t12 mid", `style="fill:#b83a34"`));
    for (let k = 0; k < 4; k++){
      const a = bp(k), b = bp(k + 1), b0 = 3.0 + .28 * k, on = seg(tt, b0, b0 + .12);
      if (on > 0) ana += `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="#343b4a" stroke-width="6" opacity="${f3(on)}"/>`;
      const sp = Math.sin(Math.PI * seg(tt, b0, b0 + .45)); if (sp > .01) ana += spark((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, sp);
    }
    for (let i = 0; i < 5; i++){ const p = bp(i); ana += `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="16" fill="${AAC[i]}" stroke="#fff" stroke-width="2.5"/>`; }
    ana += A.op(1 - join, A.tx(ax, 145, "amino acids", "t12 mid muted")) + A.op(smooth(seg(tt, 4.1, 4.5)), A.tx(ax, 308, "a protein (built with energy)", "t12 mid muted"));
    o += A.op(V, ana);

    /* sorting: cards wait in the tray at the bottom and get dropped onto a side */
    [["cat", 255, "#fde8e6", "#b83a34", "#8a2621"], ["ana", 745, "#e3f5ea", "#1b7f4e", "#145c38"]].forEach(([k, x, fill, stroke, txt]) => {
      const L = MCARDS.filter(c => placed[c[0]] === k), P = chipRows(L, x, 336, 430, 34);
      L.forEach(c => { o += chip(P[c[0]][0], P[c[0]][1], c[1], fill, stroke, txt); }); });
    const un = MCARDS.filter(c => !placed[c[0]]), TP = chipRows(un, 500, 434, 960, 0);
    if (un.length) o += A.tx(500, 412, "Drag each card into a side", "t11 mid muted");
    un.sort((a, b) => (drag && drag.kind === a[0]) - (drag && drag.kind === b[0])).forEach(c => {
      const [x, y] = at(st, c[0], TP[c[0]][0], TP[c[0]][1]), sel = st.pick === c[0];
      o += `<g data-drag="${c[0]}" style="cursor:grab">` + chip(x, y, c[1], sel ? "#fff6d6" : "#fff", sel ? C.gold : "#5a6376", "#343b4a", sel ? 4 : 2.5) + `</g>`; });
    return o;
  }
  function pathwayScene(t, R){
    const T = 6, tt = t % T, k = Math.floor(tt / 1.2) % 4;
    let o = A.tx(500, 50, `A ${R("pathway")}: one enzyme per step`, "t20 mid");
    const X = [140, 380, 620, 860], L = ["A", "B", "C", "D"];
    X.forEach((x, i) => {
      o += `<circle cx="${x}" cy="175" r="42" fill="${i === k ? "#fff6d6" : "#fff"}" stroke="${i === k ? C.gold : "#9aa3b5"}" stroke-width="${i === k ? 5 : 2.5}"/>` + A.tx(x, 187, L[i], "t20 mid");
      if (i < 3){ o += A.arrow(x + 50, 175, X[i + 1] - 52, 175, "#5a6376", 3); o += A.enzyme((x + X[i + 1]) / 2, 248, {sc:.42, label:""}) + A.tx((x + X[i + 1]) / 2, 302, `Enzyme ${i + 1}`, "t12 mid"); }
    });
    /* Key idea: each enzyme is specific — only catalyzes ONE step */
    o += `<rect x="60" y="325" width="880" height="110" rx="18" fill="#fff" stroke="#d9dee7" stroke-width="1.5"/>`;
    o += A.tx(500, 355, "Each enzyme is specific: it only speeds up its own one reaction.", "t15 mid");
    o += A.tx(500, 383, "Enzyme 1 cannot do Enzyme 3's job — and it won't even try.", "t14 mid muted");
    o += A.tx(250, 418, `${R("amphibolic") === "?" ? "?" : "Amphibolic"}: can go catabolic OR anabolic`, "t12 mid", `style="fill:#5b3fb0"`);
    o += A.tx(680, 418, "e.g. Krebs cycle intermediates → energy OR building blocks", "t12 mid", `style="fill:#5b3fb0"`);
    return o;
  }
  /* collision theory: little particle simulation driven by the activity sliders */
  function collisionScene(t, R, g){
    const temp = g.temp || 1, n = g.conc || 12;
    const tempScaled = temp / 3.33; /* map 1-10 slider to 0-3 range */
    if (!g.sim || g.sim.n !== n){ g.sim = {n, p:Array.from({length:n}, (_, i) => ({x:120 + (i * 97) % 760, y:120 + (i * 53) % 250, a:i * 2.4, k:i % 2, prod:false})), t:t, made:0, hits:[]}; }
    const S = g.sim, dt = Math.min(.05, Math.max(0, t - S.t)); S.t = t;
    const sp = 60 + 90 * tempScaled;
    S.p.forEach(q => { q.x += Math.cos(q.a) * sp * dt; q.y += Math.sin(q.a) * sp * dt; if (q.x < 80 || q.x > 920) q.a = Math.PI - q.a; if (q.y < 100 || q.y > 390) q.a = -q.a; q.x = clamp(q.x, 80, 920); q.y = clamp(q.y, 100, 390); });
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++){ const a = S.p[i], b = S.p[j]; if (a.prod || b.prod || a.k === b.k) continue; if (Math.hypot(a.x - b.x, a.y - b.y) < 26){ const tmp = a.a; a.a = b.a; b.a = tmp; S.hits.push({x:(a.x + b.x) / 2, y:(a.y + b.y) / 2, t, ok:tempScaled >= 2}); if (tempScaled >= 2 || ((i + j + Math.floor(t)) % 5 === 0)){ a.prod = b.prod = true; S.made++; } a.x += 14 * Math.cos(a.a); b.x += 14 * Math.cos(b.a); } }
    S.hits = S.hits.filter(h => t - h.t < .5);
    let o = `<rect x="60" y="80" width="880" height="330" rx="20" fill="#fbfcff" stroke="#c9cfdb" stroke-width="2"/>` + A.tx(500, 50, `${R("collision") === "?" ? "?" : "Collision"} theory: molecules must collide with enough energy`, "t20 mid");
    S.hits.forEach(h => { o += A.op(1 - (t - h.t) * 2, `<circle cx="${f1(h.x)}" cy="${f1(h.y)}" r="${f1(14 + 40 * (t - h.t))}" fill="none" stroke="${h.ok ? C.gold : "#9aa3b5"}" stroke-width="3"/>`); });
    S.p.forEach(q => { o += `<circle cx="${f1(q.x)}" cy="${f1(q.y)}" r="12" fill="${q.prod ? C.gold : q.k ? "#7fb2f0" : "#2f4fb0"}" stroke="#fff" stroke-width="2"/>`; });
    const fast = tempScaled + n / 12;
    o += `<text x="90" y="446" class="t14"><tspan style="fill:#2f4fb0">●</tspan> reactant 1   <tspan style="fill:#7fb2f0">●</tspan> reactant 2   <tspan style="fill:#f2b134">●</tspan> product</text>`;
    o += A.pill(800, 440, `Reaction rate: ${fast >= 4 ? "FAST" : fast >= 2.6 ? "medium" : "slow"}`, fast >= 4 ? C.green : fast >= 2.6 ? "#9a6212" : "#7a8292", 1, 15);
    if (S.p.every(q => q.prod) || S.made > n) g.sim = null;
    return o;
  }
  function energyScene(t, R, g, done){
    const T = 7, tt = t % T;
    let o = A.tx(500, 44, `Enzymes lower the ${R("activation") === "?" ? "?" : "activation"} energy`, "t20 mid");
    o += `<line x1="110" y1="80" x2="110" y2="420" stroke="#343b4a" stroke-width="3"/><line x1="110" y1="420" x2="930" y2="420" stroke="#343b4a" stroke-width="3"/>`;
    o += `<text x="70" y="250" class="t14 mid" transform="rotate(-90 70 250)">Energy</text>` + A.tx(520, 452, "Progress of the reaction →", "t14 mid");
    const curve = h => `M130,300 C300,300 330,${h} 480,${h} C630,${h} 660,370 900,370`;
    o += `<path d="${curve(110)}" fill="none" stroke="#b83a34" stroke-width="5"/><path d="${curve(230)}" fill="none" stroke="#2f9e63" stroke-width="5" stroke-dasharray="${done ? "0" : "10 8"}"/>`;

    const W = [["Metabolism","all chemical reactions in a cell"],["Catabolism","breaking down; releases energy"],["Anabolism","building up; uses energy"],["Activation energy","energy needed to start a reaction"],["Catalyst","speeds a reaction; not used up"],["Substrate","what the enzyme acts on"],["Active site","where the substrate binds"],["Enzyme-substrate complex","enzyme with substrate bound"],["Induced fit","active site reshapes around substrate"],["Turnover number","substrates per enzyme per second"],["Cofactor","non-protein helper (Mg²⁺, NAD⁺)"],["Apoenzyme","protein part alone; inactive"],["Denature","loses its shape (heat, pH)"],["Saturation","every active site is full"],["Allosteric site","regulatory site away from active site"],["Competitive inhibitor","blocks the active site"],["Non-competitive inhibitor","binds elsewhere, warps enzyme"],["Feedback inhibition","end product stops the 1st enzyme"]];
    let o = A.tx(500, 40, "Vocab you need", "t20 mid");
    const n = W.length, on = Math.floor(t / 1.4) % n;
    W.forEach((w, i) => { const x = 30 + (i % 2) * 475, y = 60 + Math.floor(i / 2) * 44, hi = on === i;
      o += `<rect x="${x}" y="${y}" width="465" height="38" rx="10" fill="${hi ? "#eef0fd" : "#fff"}" stroke="${hi ? C.blue : "#d9dee7"}" stroke-width="${hi ? 2.5 : 1.5}"/>`;
      o += `<text x="${x + 14}" y="${y + 24}" font-size="14"><tspan font-weight="700" fill="#343b4a">${w[0]}</tspan><tspan fill="#5a6376" font-weight="400">  ${w[1]}</tspan></text>`; });
    return o;
  }
  /* ================= Hands-on activities ================= */
  const quiz = (title, done, q, opts, right, why) => ({title, done,
    html:() => `<div class="lbl">${q}</div><div class="row">${opts.map((x, i) => `<button class="choice" data-i="${i}">${x}</button>`).join("")}</div>`,
    wire:(g, st, api) => { g.querySelectorAll("[data-i]").forEach(b => b.addEventListener("click", () => { const i = +b.dataset.i; if (i === right){ b.classList.add("right"); api.msg(why, "good"); setTimeout(api.pass, 1100); } else { b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong"); api.msg("Not quite. Try another answer.", "bad"); } })); }});

  const GATES = {
    catana:{title:"Your turn: sort each process", done:"Sorted! Catabolic breaks down and releases energy; anabolic builds up and uses energy.",
      init:() => ({placed:{}}),
      html:() => `<div style="font-size:.95rem">Drag each card at the bottom of the diagram into the <b style="color:#b83a34">catabolism</b> side or the <b style="color:#1b7f4e">anabolism</b> side. (Or tap a card, then tap a side.)</div>`,
      wire:(g, st, api) => {
        svgDrag(api, st, {picked:() => api.msg("Now tap the side it belongs on.", ""),
          drop:(k, p) => {
            const c = MCARDS.find(x => x[0] === k); if (!c || st.placed[k]) return;
            if (p.y > 398){ api.msg("Drop the card inside the catabolism box or the anabolism box.", ""); return; }
            if ((p.x < 500 ? "cat" : "ana") !== c[2]){ api.msg(c[3], "bad"); return; }
            st.placed[k] = c[2]; const left = MCARDS.filter(x => !st.placed[x[0]]).length;
            if (!left){ api.msg("All sorted!", "good"); setTimeout(api.pass, 900); } else api.msg(`Yes! ${left} left.`, "good");
          }});
        initMsg(g, api, "Drag a card onto the side of the diagram where it belongs.");
      }},
    collide:{title:"Your turn: speed up the reaction", done:"Fast! Higher temperature and more reactants mean more (and harder) collisions.", live:true, keep:true,
      init:() => ({temp:1, conc:12}),
      html:st => {
        const tempLabel = st.temp <= 3 ? "cool" : st.temp <= 6 ? "warm" : st.temp <= 8 ? "hot" : "very hot";
        return `<div class="slider"><label>Temperature <span>${tempLabel} (${st.temp}/10)</span></label><input type="range" min="1" max="10" step="1" value="${st.temp}" id="sTemp"></div>
        <div class="slider"><label>Concentration of reactants <span>${st.conc} molecules</span></label><input type="range" min="8" max="30" step="2" value="${st.conc}" id="sConc"></div>`;
      },
      wire:(g, st, api) => {
        const up = () => {
          st.temp = +g.querySelector("#sTemp").value; st.conc = +g.querySelector("#sConc").value;
          const tempLabel = st.temp <= 3 ? "cool" : st.temp <= 6 ? "warm" : st.temp <= 8 ? "hot" : "very hot";
          g.querySelector("label span").textContent = `${tempLabel} (${st.temp}/10)`; g.querySelectorAll("label span")[1].textContent = st.conc + " molecules";
          const tempScaled = st.temp / 3.33;
          if (tempScaled + st.conc / 12 >= 4){ api.msg("Watch the gold products pile up. More collisions, with more energy, means a faster reaction rate!", "good"); if (!st.passed){ st.passed = true; setTimeout(api.pass, 1600); } }
          else api.msg(tempScaled >= 2 ? "Hotter molecules collide with more energy. Now add more reactants." : "Heat things up, or pack in more molecules.", "");
        };
        g.querySelectorAll("input").forEach(i => i.addEventListener("input", up));
        if (!g.querySelector("#gateMsg").textContent) api.msg("Use the sliders to get the reaction rate to FAST.", "");
      }},
    lowers:quiz("Quick check", "Right: enzymes lower the activation energy, so the reaction happens faster.", "What does an enzyme change about a reaction?", ["The activation energy", "The energy stored in the products", "Whether energy is released or used"], 0, "Yes! Only the height of the hill changes. The starting and ending energy stay the same."),
    fit:{title:"Your turn: be the enzyme", done:"Catalyzed! The enzyme released the products and is ready to use again.",
      init:() => ({stage:0, uses:0, drag:null}),
      html:st => `<div style="font-size:.95rem">${st.stage === 1 ? "Now tap <b>⚡ Tap to catalyze!</b> on the diagram to break the substrate's bond." : "Drag the shape that fits the enzyme's active site right onto the enzyme in the diagram (or just tap it)."}</div><div class="lbl" style="margin-top:6px">Times this enzyme has been used: ${st.uses} of 2</div>`,
      wire:(g, st, api) => {
        const svg = api.svg; svg.style.touchAction = "none";
        const toSVG = e => { const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); };
        function tryShape(k){
          if (st.stage !== 0) return;
          if (k !== "fit"){ api.msg(k === "sq" ? "The square's flat bottom can't fit into the V-shaped active site. Enzymes are specific!" : "The round shape doesn't match the V-shaped active site. Only one substrate shape fits.", "bad"); return; }
          st.stage = 1; api.redraw(); api.msg("It fits like a puzzle piece! That's the enzyme-substrate complex. Now catalyze it.", "good");
        }
        function catalyze(){
          if (st.stage !== 1) return;
          st.stage = 2; st.catAt = performance.now(); api.redraw(); api.msg("The bond breaks and the two products are released...", "");
          setTimeout(() => { st.stage = 0; st.uses++; api.redraw();
            if (st.uses >= 2){ api.msg("Products released, and the enzyme is unchanged. That's a catalyst!", "good"); setTimeout(api.pass, 900); }
            else api.msg("The enzyme wasn't used up. A new substrate is floating by: do it again!", "good"); }, 2200);
        }
        svg.onpointerdown = e => {
          const d = e.target.closest && e.target.closest("[data-drag]"); if (!d) return;
          e.preventDefault(); const k = d.dataset.drag;
          if (k === "cat"){ catalyze(); return; }
          if (st.stage !== 0) return;
          const p = toSVG(e); st.drag = {kind:k, x:p.x, y:p.y, sx:p.x, sy:p.y, moved:false};
          try { svg.setPointerCapture(e.pointerId); } catch (err) {}
        };
        svg.onpointermove = e => { const d = st.drag; if (!d) return; const p = toSVG(e); d.x = p.x; d.y = p.y; if (Math.hypot(p.x - d.sx, p.y - d.sy) > 8) d.moved = true; };
        svg.onpointerup = svg.onpointercancel = e => {
          const d = st.drag; if (!d) return; st.drag = null;
          if (!d.moved){ tryShape(d.kind); return; }
          const p = toSVG(e);
          if (Math.hypot(p.x - FIT.EX, p.y - FIT.DY) < 110) tryShape(d.kind);
          else api.msg("Drop it right onto the enzyme's active site (the V-shaped pocket on top).", "bad");
        };
        if (!g.querySelector("#gateMsg").textContent) api.msg("Which shape fits the active site? Drag it onto the enzyme (or tap it).", "");
      }},
    cofactor:{title:"Your turn: activate the apoenzyme", done:"Activated! Apoenzyme + cofactor = a working enzyme.",
      init:() => ({}),
      html:() => `<div style="font-size:.95rem">Which one is a cofactor? Drag it on the diagram into the apoenzyme's helper slot (or tap it, then tap the enzyme).</div>`,
      wire:(g, st, api) => {
        svgDrag(api, st, {picked:() => api.msg("Now tap the apoenzyme.", ""),
          drop:(k, p) => {
            if (st.ok) return;
            if (Math.hypot(p.x - COF.slot[0], p.y - COF.slot[1]) > 70 && Math.hypot(p.x - 380, p.y - 300) > 150){ api.msg("Drop it right onto the apoenzyme's helper slot.", ""); return; }
            if (k !== "mg"){ api.msg(k === "glu" ? "Glucose is a substrate (food), not a cofactor." : "Amino acids are part of the protein itself. A cofactor is a NON-protein helper.", "bad"); return; }
            st.ok = true; api.msg("Mg²⁺ is an inorganic cofactor. Now the enzyme works!", "good"); setTimeout(api.pass, 1100);
          }});
        initMsg(g, api, "Which one is a cofactor? Drag it onto the apoenzyme.");
      }},
    factors:{title:"Your turn: test the factors", done:"You found the optimum, denatured it, and saturated it!", live:true,
      init:() => ({temp:37, pH:7, sub:30, seen:{}}),
      html:st => `<div class="slider"><label>Temperature <span>${st.temp}°C</span></label><input type="range" min="0" max="60" value="${st.temp}" data-k="temp"></div>
        <div class="slider"><label>pH <span>${st.pH}</span></label><input type="range" min="1" max="13" value="${st.pH}" data-k="pH"></div>
        <div class="slider"><label>Substrate concentration <span>${st.sub}</span></label><input type="range" min="0" max="100" value="${st.sub}" data-k="sub"></div>
        <div class="chips"><span class="chip ${st.seen.hot ? "on" : ""}">${st.seen.hot ? "✓" : "○"} Denature it with heat</span><span class="chip ${st.seen.ph ? "on" : ""}">${st.seen.ph ? "✓" : "○"} Try an extreme pH</span><span class="chip ${st.seen.sat ? "on" : ""}">${st.seen.sat ? "✓" : "○"} Reach saturation</span></div>`,
      wire:(g, st, api) => { g.querySelectorAll("input").forEach(i => i.addEventListener("input", () => { st[i.dataset.k] = +i.value; i.parentNode.querySelector("span").textContent = i.value + (i.dataset.k === "temp" ? "°C" : "");
          const before = Object.keys(st.seen).length; if (st.temp > 45) st.seen.hot = 1; if (Math.abs(st.pH - 7) > 3) st.seen.ph = 1; if (st.sub > 80) st.seen.sat = 1;
          if (Object.keys(st.seen).length !== before){ api.redraw(); if (Object.keys(st.seen).length === 3){ api.msg("Each enzyme has an optimal temperature and pH. More substrate helps only until every active site is full.", "good"); setTimeout(api.pass, 1300); } } }));
        if (!g.querySelector("#gateMsg").textContent) api.msg("Move the sliders and watch the dots on the graphs.", ""); }},
    allo:{title:"Your turn: switch the enzyme off", done:"The inhibitor bound the allosteric site, changed the enzyme's shape, and the substrate no longer fits.",
      init:() => ({}),
      html:() => `<div style="font-size:.95rem">Drag the purple inhibitor on the diagram onto the enzyme's <b>allosteric site</b> (or tap it, then tap the site).</div>`,
      wire:(g, st, api) => {
        svgDrag(api, st, {picked:() => api.msg("Now tap the allosteric site.", ""),
          drop:(k, p) => {
            if (st.at) return;
            if (Math.hypot(p.x - ALLO.site[0], p.y - ALLO.site[1]) < 60){ st.at = performance.now(); api.msg("It binds the allosteric site and the whole enzyme changes shape. Watch the substrate get pushed out!", "good"); setTimeout(api.pass, 1900); }
            else if (Math.hypot(p.x - 500, p.y - 225) < 90) api.msg("That's the active site, where the substrate binds. The allosteric site is a separate spot.", "bad");
            else api.msg("Drop it on the allosteric site: the dashed square on the enzyme's side.", "");
          }});
        initMsg(g, api, "Drag the inhibitor onto the allosteric site.");
      }},
    inhib:{title:"Your turn: place each inhibitor", done:"Competitive inhibitors block the active site; non-competitive inhibitors bind the allosteric site.",
      init:() => ({placed:{}}),
      html:st => st.placed.st && st.placed.hg ? `<div class="lbl">Now add LOTS more substrate. Which inhibitor gets outcompeted?</div><div class="row"><button class="choice" data-q="st">The statin</button><button class="choice" data-q="hg">The heavy metal</button></div>`
        : `<div style="font-size:.95rem">Drag each inhibitor at the top of the diagram onto the site where it binds (or tap it, then tap the site).</div>`,
      wire:(g, st, api) => {
        const near = (p, q) => Math.hypot(p.x - q[0], p.y - q[1]) < 55;
        svgDrag(api, st, {picked:() => api.msg("Now tap the site where it binds.", ""),
          drop:(k, p) => {
            if (st.placed[k]) return;
            const site = near(p, INH.act.L) ? "actL" : near(p, INH.act.R) ? "actR" : near(p, INH.allo.L) ? "alloL" : near(p, INH.allo.R) ? "alloR" : null;
            if (!site){ api.msg("Drop it right onto a site on one of the enzymes: the V-shaped active site or the dashed allosteric site.", ""); return; }
            if (k === "st"){
              if (site === "actL"){ st.placed.st = 1; api.msg("Competitive: the statin looks like the substrate and competes for the active site.", "good"); }
              else if (site === "actR") { api.msg("Right idea, it goes in an active site! But that's the competitive side: use the enzyme on the left.", "bad"); return; }
              else { api.msg("The statin has the same shape as the substrate. Where does the substrate go?", "bad"); return; }
            } else {
              if (site === "alloR"){ st.placed.hg = 1; api.msg("Non-competitive: Hg²⁺ binds the allosteric site and warps the active site.", "good"); }
              else if (site === "alloL"){ api.msg("Yes, the allosteric site! But that's the non-competitive side: use the enzyme on the right.", "bad"); return; }
              else { api.msg("Heavy metals don't look like the substrate. They bind somewhere else and change the enzyme's shape.", "bad"); return; }
            }
            if (st.placed.st && st.placed.hg) api.redraw();
          }});
        g.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { if (b.dataset.q === "st"){ b.classList.add("right"); api.msg("Right! Tons of substrate wins the race for the active site. The heavy metal doesn't care how much substrate there is.", "good"); setTimeout(api.pass, 1300); } else { b.classList.add("wrong"); api.msg("The heavy metal isn't competing for the active site, so extra substrate can't push it out.", "bad"); } }));
        initMsg(g, api, "Drag each inhibitor to the site it binds.");
      }},
    feedback:{title:"Your turn: shut down the pathway", done:"The end product (D) inhibits the first enzyme, so no resources are wasted.",
      html:() => `<div class="row"><span class="tok" data-d="1" style="background:#efe7fb;border-color:#8e5bd0">D (end product)</span></div>
        <div class="zones">${[1, 2, 3].map(n => `<div class="zone" data-zone="${n}"><span class="zl">Enzyme ${n}: ${["A → B", "B → C", "C → D"][n - 1]}</span></div>`).join("")}</div>`,
      wire:(g, st, api) => { const el = g.querySelector("[data-d]"); api.dragify(el, {tap:() => { st.pick = 1; api.msg("Tap the enzyme D should block.", ""); }, drop:z => put(z.dataset.zone)});
        g.querySelectorAll("[data-zone]").forEach(z => z.addEventListener("click", () => { if (st.pick) put(z.dataset.zone); }));
        function put(z){ if (z !== "1"){ api.msg(z === "3" ? "Blocking the last step would leave A, B, and C piling up. That wastes resources!" : "Close, but B would still be made for nothing. Block the very start of the pathway.", "bad"); return false; } g.querySelector('[data-zone="1"]').classList.add("ok"); api.msg("Yes! D acts as an allosteric inhibitor of enzyme 1, so the whole pathway stops at the start.", "good"); setTimeout(api.pass, 1100); return true; }
        if (!g.querySelector("#gateMsg").textContent) api.msg("Drag D onto the enzyme it should inhibit.", ""); }},
    vocab:Metab.sortGate({title:"Your turn: sort the vocab", done:"Vocab sorted!", tip:"Where does each term belong? Drag it into a box.",
      bins:[["enz","Part of an enzyme"],["rx","About the reaction"],["reg","Regulation (control)"]],
      cards:[["a","Active site","enz"],["b","Apoenzyme","enz"],["c","Cofactor","enz"],["j","Induced fit","enz","Induced fit is about the active site changing shape: part of the enzyme."],["d","Activation energy","rx"],["e","Reaction rate","rx"],["f","Collision theory","rx"],["k","Turnover number","rx","Turnover number measures how fast the reaction goes."],["g","Competitive inhibition","reg"],["l","Non-competitive inhibition","reg"],["h","Feedback inhibition","reg"],["i","Allosteric site","reg","The allosteric site is where regulators bind. Put it with regulation."]]})
  };

  /* ================= Steps ================= */
  const P1 = "Metabolism", P2 = "How enzymes work", P3 = "Controlling enzymes";
  const STEPS = [
    {part:P1, title:"What is metabolism?", scene:(t, c) => metabScene(t, c.R, c.g, c.done), live:true, more:"meta", gate:GATES.catana,
     text:`All of the chemical reactions in a cell are called {{metabolism}}. {{catabolism}} is the BREAKDOWN of molecules to release energy, like breaking glucose down into CO₂ and water. {{anabolism}} is building up molecules using energy, like joining amino acids into a protein.`,
     after:`Catabolism breaks down (releases energy). Anabolism builds up (uses energy).`},
    {part:P1, title:"Metabolic pathways", scene:(t, c) => pathwayScene(t, c.R),
     text:`A {{pathway}} is a series of connected chemical reactions, where the product of one step becomes the reactant for the next. Each step is run by its own enzyme. Some pathways are catabolic, some are anabolic, and some, called {{amphibolic}} pathways, do both. Krebs cycle intermediates, for example, can be broken down for energy or used as building blocks.`},
    {part:P1, title:"Collision theory", scene:(t, c) => collisionScene(t, c.R, c.g), live:true, gate:GATES.collide, more:"ea",
     text:`What makes reactions happen? {{collision}} theory says chemical reactions occur when molecules collide with enough energy and the proper orientation. The minimum energy needed for a reaction to begin is the {{activation}} energy. The speed at which reactants turn into products is the {{rate}}. Temperature, pressure, concentration, surface area, and catalysts all change how often and how hard molecules collide.`,
     after:`More collisions = faster reaction. Higher activation energy = slower reaction.`},
    {part:P2, title:"Enzymes lower the barrier", scene:(t, c) => energyScene(t, c.R, c.g, c.done), gate:GATES.lowers, more:"names",
     text:`Enzymes are biological {{catalysts}}, mostly proteins. They speed up reactions without being used up. An enzyme {{lowers}} the activation energy, so the reaction happens more easily and the reaction rate goes up.`,
     after:`↓ activation energy → ↑ reaction rate`},
    {part:P2, title:"How an enzyme works", scene:(t, c) => stepsScene(t, c.R, c.g, c.done), live:true, gate:GATES.fit,
     text:`The molecule an enzyme acts on is its {{substrate}} (a reactant). 1) The substrate binds to a specific spot on the enzyme called the {{activesite}}. 2) Together they form the {{esc}}. 3) The enzyme helps bonds break or form. 4) The {{products}} are released, and the enzyme is free to work again.`},
    {part:P2, title:"Induced fit and turnover number", scene:(t, c) => inducedScene(t, c.R),
     text:`The active site isn't a rigid lock. In the {{inducedfit}} model, the active site changes shape when the substrate binds, creating a tighter, optimal fit. How efficient is an enzyme? The {{turnover}} is the number of substrate molecules one enzyme converts per second.`},
    {part:P2, title:"Cofactors and apoenzymes", scene:(t, c) => cofactorScene(t, c.R, c.g, c.done), gate:GATES.cofactor, more:"vit",
     text:`Many enzymes need a teammate. {{cofactors}} are non-protein helpers required for enzyme activity: metal ions like Mg²⁺ and Zn²⁺, or organic molecules called coenzymes. The protein portion of the enzyme on its own is the {{apoenzyme}}, and it is inactive by itself.`,
     after:`Apoenzyme (protein) + cofactor = working enzyme`},
    {part:P2, title:"Factors that affect enzyme activity", scene:(t, c) => factorScene(t, c.R, c.g), live:true, gate:GATES.factors, more:"temp",
     text:`Higher temperature means more collisions, but too much heat makes an enzyme {{denature}}: it loses its shape and function. Each enzyme has an optimal pH, and extreme pH changes its shape too. More substrate speeds things up only until {{saturation}}, when every active site is occupied. Enzyme concentration, inhibitors, cofactors, and salt concentration matter as well.`},
    {part:P3, title:"The allosteric site", scene:(t, c) => alloScene(t, c.R, c.g, c.done), gate:GATES.allo,
     text:`Enzymes have two kinds of binding sites. The active site is where the substrate binds, with a shape and chemistry that match the substrate. The {{allosteric}} site is a separate binding site. It's a regulatory site where inhibitors or activators bind to turn the enzyme down or up.`},
    {part:P3, title:"Competitive vs. non-competitive inhibition", scene:(t, c) => inhibScene(t, c.R, c.g, c.done), gate:GATES.inhib, more:"statin",
     text:`{{competitive}} inhibitors have a shape similar to the substrate and compete for the active site. They can be overcome by adding more substrate (example: statins compete with HMG-CoA). {{noncompetitive}} inhibitors bind the allosteric site, change the enzyme's shape, and make the active site nonfunctional. Adding more substrate can't overcome them (example: heavy metals).`},
    {part:P3, title:"Feedback inhibition", scene:(t, c) => feedbackScene(t, c.R, c.g, c.done), gate:GATES.feedback, more:"fb",
     text:`In {{feedback}} inhibition, the end product of a pathway inhibits the {{first}} enzyme in the pathway. In A → B → C → D, product D acts as an allosteric inhibitor of the enzyme that turns A into B. When D is high, the whole pathway shuts down. When D is low, it runs again. This prevents waste and keeps the cell in balance.`,
     after:`"The end product tells the beginning to stop!"`},
    {part:P3, title:"Vocab review", scene:t => vocabScene(t), gate:GATES.vocab,
     text:`Nice work! You now know how enzymes speed up the reactions of metabolism and how cells control them. Next up: where the energy actually comes from, with redox reactions.`,
     after:`Enzymes: done! Up next: enzymes and energy production.`}
  ];

  Metab.start({title:"Enzymes and Metabolism", page:"enzymes.html", BL, MORE, STEPS,
    nextLabel:"Next up: where does the energy come from?", next:[["Chemistry of Energy Production →","energy-chemistry.html"],["Try the Enzyme Lab →","enzyme-lab.html"],["All modules","index.html"]]});
})();
